// Rechnung aus dem gespeicherten Text mit der aktuellen Erkennung neu auslesen
function reparseInvoice(inv){
  if(!inv || !inv.rawText) return null;
  const r = parseInvoiceText(inv.rawText);
  if(!r.items.length && r.total==null) return null;
  return { items: r.items.map(it=>({ id: it.id||uid("it"), category: it.category, label: it.label, menge: it.menge, einheit: it.einheit, preis: it.preis, ep: it.ep!==undefined ? it.ep : null, ...(it.tarifId ? { tarifId: it.tarifId } : {}) })), total: r.total };
}
// Einmalig: offene Rechnungen, deren Positionen nicht zum Rechnungsbetrag passen und nicht von Hand bearbeitet wurden, neu auslesen
let reparseDone = false;
async function autoReparseBroken(){
  if(reparseDone) return; reparseDone = true;
  for(const inv of DB.invoices){
    if(inv.gedrucktAm || !inv.rawText) continue;
    if((inv.verlauf||[]).some(e => /Positionen|Betrag/.test(e.was||""))) continue; // von Hand korrigiert -> nicht anfassen
    const sum = (inv.items||[]).reduce((s,x)=>s+(num(x.preis)||0),0);
    const okNow = num(inv.total)!=null && Math.abs(sum - inv.total/1.081) <= Math.max(2, inv.total*0.01);
    if(okNow) continue;
    const r = reparseInvoice(inv); if(!r || r.total==null) continue;
    const sumNew = r.items.reduce((s,x)=>s+(num(x.preis)||0),0);
    if(Math.abs(sumNew - r.total/1.081) > Math.max(2, r.total*0.01)) continue; // neue Lesung passt auch nicht -> lassen
    inv.items = r.items; inv.total = r.total;
    try{ await saveInvoice(inv); }catch(e){}
  }
}
function itemAssigned(inv, it){
  if(it.category !== "Sonstiges") return true;
  const sub = getSubFor(inv.lieferant);
  return !!(sub && findTarif(sub, inv, it).tarif);
}
function invoiceNeedsReview(inv){
  if(!inv.lieferant) return true;
  if(!inv.items || inv.items.length===0) return true;
  if(inv.items.some(it=>it.menge===null || it.menge===undefined)) return true;
  if(inv.items.some(it=>!itemAssigned(inv, it))) return true;
  return false;
}

function notifyIfNeedsReview(inv){
  if(!invoiceNeedsReview(inv)) return;
  if(typeof Notification === "undefined" || Notification.permission !== "granted") return;
  try{
    new Notification("⚠ Rechnung benötigt Prüfung", {
      body: `${inv.filename || "Rechnung"} — ${inv.lieferant || "Lieferant unbekannt"}: Scan unvollständig, bitte korrigieren.`,
      tag: inv.id,
    });
  }catch(e){}
}

function projectOverPill(p){
  const n = countOverBudget(p);
  if(!n) return `<span class="pill ok">im Soll</span>`;
  const act = DB.invoices.filter(i=>i.projectId===p.id && isActiveInvoice(i));
  const allApproved = act.length && act.every(i=>i.pruefung && i.pruefung.status==="ok");
  return allApproved
    ? `<span class="pill warnok" title="Mengen über der AB, aber alle Rechnungen wurden bewusst freigegeben">✓ ${n} über Soll · freigegeben</span>`
    : `<span class="pill danger">⚠ ${n} über Soll</span>`;
}
function countOverBudget(p){
  return projectControlRows(p).filter(r => r.soll && r.ist.menge > 0 && r.ist.menge > Math.max(0, r.soll.menge) * (1 + getSettings().mengenTolProzent/100) + 1e-9).length;
}

function aggregateByCategory(invoices){
  const agg = {};
  invoices.forEach(inv=>{
    (inv.items||[]).forEach(it=>{
      if(!agg[it.category]) agg[it.category] = { menge:0, einheit: it.einheit, chf:0 };
      if(it.menge) agg[it.category].menge += it.menge;
      if(it.einheit) agg[it.category].einheit = it.einheit;
      if(it.preis) agg[it.category].chf += it.preis;
    });
  });
  return agg;
}

const expandedABs = new Set();
const projTabFor = {}; // pro Auftrag gewaehlter Tab: overview | invoices | ab | edit
const selectedHaus = {};

// Pauschalen (Installation, Anfahrt, Parking, Entsorgung) gehoeren zur Hauptleistung (z.B. Ausflockung)
const NEBEN_CATS = new Set(["Anfahrt", "Entsorgung"]);
const NEBEN_RE = /install|anfahrt|pausch|parking|fahrt|einricht|entsorg/i;
const MAIN_EXCL = new Set(["Anfahrt", "Entsorgung", "Sonstiges", "Regie", "Material"]);
function abNebenFold(p, haus){
  const res = { to:{}, from:{} };
  (p.abs||[]).filter(ab => haus===undefined || ab.haus===haus).forEach(ab=>{
    const pos = ab.positionen || [];
    pos.filter(x => NEBEN_CATS.has(x.category)).forEach(n=>{
      let target = pos.filter(x => x.gruppe===n.gruppe && x.category && !MAIN_EXCL.has(x.category)).sort((a,b)=>(+b.betrag||0)-(+a.betrag||0))[0];
      if(!target){
        const t = (n.beschreibung + " " + n.artikel).toLowerCase();
        const kc = /ausflock/.test(t) ? "Ausflockung" : /beplank/.test(t) ? "Beplankung" : null;
        if(kc && pos.some(x=>x.category===kc)) target = { category: kc };
      }
      if(!target) return;
      const to = res.to[target.category] || (res.to[target.category] = { erloes:0, count:0 });
      to.erloes += +n.betrag || 0; to.count += +n.menge || 0;
      const fr = res.from[n.category] || (res.from[n.category] = { menge:0, erloes:0 });
      fr.menge += +n.menge || 0; fr.erloes += +n.betrag || 0;
    });
  });
  return res;
}
function invoiceMainCat(inv){
  let best = null, bestChf = -1;
  (inv.items||[]).forEach(it=>{ if(MAIN_EXCL.has(it.category)) return; const c = num(it.preis)||0; if(c > bestChf){ best = it.category; bestChf = c; } });
  return best;
}
function isNebenItem(inv, it){
  if(NEBEN_CATS.has(it.category)) return true;
  return it.category==="Sonstiges" && NEBEN_RE.test(String(it.label||"")) && itemAssigned(inv, it);
}
function subNebenTarif(sub){
  const all = (sub && sub.tarife || []).filter(t => num(t.preis)!=null);
  return all.find(t => NEBEN_CATS.has(t.category) && NEBEN_RE.test((t.bezeichnung||"") + " " + (t.keywords||"")))
      || all.find(t => NEBEN_CATS.has(t.category))
      || all.find(t => t.category==="Sonstiges" && NEBEN_RE.test(t.bezeichnung||"")) || null;
}

function projectControlRows(p, haus){
  const invs = DB.invoices.filter(i=>i.projectId===p.id && isActiveInvoice(i) && (haus===undefined || i.haus===haus));
  const ab = abSoll(p, haus);
  const fold = abNebenFold(p, haus);
  const cats = new Set(Object.keys(ab));
  if(haus===undefined) Object.keys(p.soll||{}).forEach(k=>{ if(p.soll[k] && num(p.soll[k].menge)!=null) cats.add(k); });
  const ist = {};
  invs.forEach(inv=>{ const mainCat = invoiceMainCat(inv); (inv.items||[]).forEach(it=>{
    if(it.category==="Sonstiges" && !itemAssigned(inv, it)) return;
    // Pauschale auf derselben Rechnung -> zur Hauptleistung zaehlen (nur CHF, nicht die Menge)
    if(mainCat && isNebenItem(inv, it)){
      const m = ist[mainCat] || (ist[mainCat] = { menge:0, chf:0, subs:{} });
      if(num(it.preis)!=null){ m.chf += +it.preis; m.nebenChf = (m.nebenChf||0) + +it.preis; }
      return;
    }
    const o = ist[it.category] || (ist[it.category] = { menge:0, chf:0, subs:{} });
    if(num(it.menge)!=null) o.menge += +it.menge;
    if(num(it.preis)!=null) o.chf += +it.preis;
    const s = inv.lieferant || "?"; o.subs[s] = (o.subs[s]||0) + 1;
  }); });
  Object.keys(ist).forEach(k=>cats.add(k));
  if(!ist.Sonstiges) cats.delete("Sonstiges");
  const order = (DB.categories||DEFAULT_CATEGORIES).map(c=>c.key);
  return Array.from(cats).sort((a,b)=>order.indexOf(a)-order.indexOf(b)).map(cat=>{
    let soll = getSoll(p, cat, haus);
    const i = ist[cat] || { menge:0, chf:0, subs:{} };
    // AB-Pauschalen, die einer Hauptleistung zugeschlagen wurden, nicht nochmals als eigene Zeile fuehren
    let erloesAdj = 0;
    if(fold.from[cat] && soll && soll.quelle !== "manuell"){
      const rest = roundNum(soll.menge - fold.from[cat].menge);
      erloesAdj = -fold.from[cat].erloes;
      soll = rest > 0 ? { ...soll, menge: rest } : null;
      if(!soll && !i.menge && !i.chf) return null;
    }
    const mainSubName = (Object.entries(i.subs).sort((a,b)=>b[1]-a[1])[0]||[])[0] || null;
    const sub = mainSubName ? getSubFor(mainSubName) : null;
    let budget = null;
    if(soll && sub){
      const today = { datum: "" };
      if(soll.quelle!=="manuell"){
        let sum = 0, ok = true;
        (ab[cat] ? ab[cat].positionen : []).forEach(pos=>{
          const r = findTarif(sub, today, { category:cat, label: pos.material || pos.beschreibung || pos.artikel, einheit: pos.einheit });
          if(r.tarif) sum += (+pos.menge||0) * +r.tarif.preis; else ok = false;
        });
        budget = ok ? sum : null;
        // Pauschalen der AB (z.B. Installation/Anfahrt Ausflockung) ins Budget der Hauptleistung
        if(budget!=null && fold.to[cat] && fold.to[cat].count){ const nt = subNebenTarif(sub); if(nt) budget += fold.to[cat].count * +nt.preis; }
      } else {
        const r = findTarif(sub, today, { category:cat, label:"", einheit:catUnit(cat) });
        if(r.tarif) budget = soll.menge * +r.tarif.preis;
      }
    }
    const baseErl = ab[cat] ? ab[cat].erloes + erloesAdj : null;
    const erloes = baseErl!=null || fold.to[cat] ? (baseErl||0) + (fold.to[cat] ? fold.to[cat].erloes : 0) : null;
    return { cat, soll, ist:i, erloes, nebenErloes: fold.to[cat] ? fold.to[cat].erloes : 0, materials: ab[cat] ? ab[cat].materials : [], budget, mainSubName };
  }).filter(Boolean);
}

              <td>${invoiceNeedsReview(inv) ? `<span class="pill warn">⚠ Scan prüfen</span> ` : ""}${(inv.items||[]).map(it=>`<span class="tag">${escapeHtml(it.category)}: ${it.menge??"?"} ${escapeHtml(it.einheit||"")}</span>`).join(" ")}</td>
              <td class="num">${inv.total!=null?formatCHF(+inv.total):"—"}</td>
              <td>${findingsPill(inv)}</td>
              <td style="white-space:nowrap;">
                <button class="small" data-edit="${inv.id}">${expandedInvoiceId===inv.id?"Schliessen":"Prüfen / Bearbeiten"}</button>
                <button class="small" data-shareinv="${inv.id}" title="Teilen">📤</button>
                <button class="small danger" data-del="${inv.id}" ${canDeleteInvoice(inv)?"":"disabled title='Nur eigene Rechnungen innerhalb von 5 Stunden, sonst Admin' "}>Löschen</button>
              </td>
            </tr>
            <tr class="editRow" data-editrow="${inv.id}" style="display:${expandedInvoiceId===inv.id?'table-row':'none'};">
              <td colspan="8"><div id="editPanel-${inv.id}"></div></td>
            </tr>
          `).join("")}
        </tbody>
      </table></div>
      ` : `<div class="empty">Noch keine Rechnungen für diesen Auftrag.</div>`}
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", ()=>{ goBack("projects"); });
  // Tabs: nur den gewaehlten Bereich zeigen
  mainEl.querySelectorAll("[data-sec]").forEach(el=>{ el.style.display = el.dataset.sec===ptab ? "" : "none"; });
  mainEl.querySelectorAll("[data-ptabp]").forEach(b=>b.addEventListener("click", ()=>{ projTabFor[p.id] = b.dataset.ptabp; renderProjectDetail(projectId); }));
  document.getElementById("shareProjBtn").addEventListener("click", ()=> openShareDialog({ type:"project", id:p.id, label:p.name }, myTodos.length ? myTodos.map(t=>t.share||t.text).join("\n") : ""));
  const tdSlot = document.getElementById("todoSlot");
  if(tdSlot) wireTodos(tdSlot, myTodos, ()=>render());
  document.getElementById("addHausBtn").addEventListener("click", ()=>{
    const h = askNewHaus(); if(!h) return;
    p.haeuser = Array.from(new Set([...(p.haeuser||[]), h]));
    saveProject(p); renderProjectDetail(projectId);
  });
  mainEl.querySelectorAll("[data-htab]").forEach(b=>b.addEventListener("click", ()=>{ selectedHaus[p.id] = b.dataset.htab; renderProjectDetail(projectId); }));
  mainEl.querySelectorAll("[data-abhaus]").forEach(sel=>sel.addEventListener("change", async ()=>{
    const ab = (p.abs||[]).find(a=>a.nr===sel.dataset.abhaus); if(!ab) return;
    let h = sel.value;
    if(h==="__new"){ h = askNewHaus(); if(!h){ renderProjectDetail(projectId); return; } }
    ab.haus = h;
    if(h) p.haeuser = Array.from(new Set([...(p.haeuser||[]), h]));
    await saveProject(p);
    toast(h ? `AB ${ab.nr} gilt jetzt für ${h}.` : `AB ${ab.nr} gilt für das ganze Objekt.`);
    renderProjectDetail(projectId);
  }));
  mainEl.querySelectorAll("[data-invhaus]").forEach(sel=>sel.addEventListener("change", async ()=>{
    const inv = DB.invoices.find(i=>i.id===sel.dataset.invhaus); if(!inv) return;
    let h = sel.value;
    if(h==="__new"){ h = askNewHaus(); if(!h){ renderProjectDetail(projectId); return; } }
    inv.haus = h;
    await saveInvoice(inv);
    renderProjectDetail(projectId);
  }));
  mainEl.querySelectorAll("[data-shareinv]").forEach(b=>b.addEventListener("click", ()=>{
    const inv = DB.invoices.find(i=>i.id===b.dataset.shareinv); if(!inv) return;
    openShareDialog({ type:"invoice", id:inv.id, label: invoiceLinkLabel(inv) }, "Bitte prüfen.");
  }));
  document.getElementById("editProjName").addEventListener("change", (e)=>{ p.name = e.target.value; saveProject(p); });
  document.getElementById("editProjAddress").addEventListener("change", (e)=>{ p.address = e.target.value; saveProject(p); });
  document.getElementById("editProjAuftragsnr").addEventListener("change", (e)=>{ p.auftragsnummer = e.target.value; saveProject(p); });

  document.getElementById("mergeBtn").addEventListener("click", async ()=>{
    if(!hasPerm('deleteAuftraege')){ toast("Keine Berechtigung zum Zusammenführen/Löschen von Aufträgen."); return; }
    const targetId = document.getElementById("mergeSelect").value;
    if(!targetId){ toast("Bitte zuerst einen Auftrag zum Zusammenführen wählen."); return; }
    const target = DB.projects.find(x=>x.id===targetId);
    if(!target) return;
    if(!confirm(`Alle Rechnungen${abs.length?" und ABs":""} von "${p.name}" zu "${target.name}" verschieben und "${p.name}" löschen?\n\nUnterscheiden sich Haus/Hausnummer, wird das automatisch als Haus übernommen.`)) return;
    await mergeProjects(p, target);
    toast("Aufträge zusammengeführt.");
    currentProjectId = target.id;
    render();
  });

  document.getElementById("deleteProjBtn").addEventListener("click", async ()=>{
    if(!hasPerm('deleteAuftraege')){ toast("Keine Berechtigung zum Löschen von Aufträgen."); return; }
    if(!confirm(`Auftrag "${p.name}" wirklich löschen? Dabei werden auch alle ${invs.length} zugehörigen Rechnungen gelöscht.`)) return;
    for(const inv of invs) await deleteInvoiceDoc(inv.id);
    await deleteProjectDoc(p.id);
    toast("Auftrag gelöscht.");
    goBack("projects");
  });

  // --- AB hochladen / verwalten ---
  const doABUpload = async (file)=>{
    try{
      const ab = await readABFile(file);
      if(!ab) return;
      const score = projectAddrScore(ab.baustelle, p);
      if(ab.baustelle && score < 1 && !confirm(`Die AB-Baustelle „${ab.baustelle}“ passt nicht zu diesem Auftrag („${p.name}“). Trotzdem hier zuordnen?`)) return;
      const elsewhere = DB.projects.find(x=>x.id!==p.id && (x.abs||[]).some(a=>a.nr===ab.nr));
      if(elsewhere){
        if(!confirm(`Diese AB (${ab.nr}) ist bereits beim Auftrag „${elsewhere.name}“ hinterlegt. Dorthin verschieben?`)) return;
        await detachAB(elsewhere.id, ab.nr);
      }
      await attachAB(p.id, ab);
      toast(`AB ${ab.nr} eingelesen: ${ab.positionen.length} Positionen.`);
      renderProjectDetail(projectId);
    }catch(err){ console.error(err); toast("Fehler beim Lesen der AB: " + (err.message||err)); }
  };
  const doABUploadMany = async (files)=>{ await addABsToProject(p, files); renderProjectDetail(projectId); };
  document.getElementById("abUploadBtn").addEventListener("click", ()=> pickPdfFiles(doABUploadMany));
  const poa = document.getElementById("projOhneAB");
  if(poa) poa.addEventListener("click", async ()=>{
    p.ohneAB = !p.ohneAB;
    await saveProject(p);
    toast(p.ohneAB ? "Objekt ohne AB – keine AB-Meldungen mehr." : "Markierung entfernt.");
    renderProjectDetail(projectId);
  });
  const abDrop = document.getElementById("abDrop");
  if(abDrop){
    abDrop.addEventListener("click", ()=> pickPdfFiles(doABUploadMany));
    abDrop.addEventListener("dragover", e=>{ e.preventDefault(); abDrop.classList.add("hover"); });
    abDrop.addEventListener("dragleave", ()=> abDrop.classList.remove("hover"));
    abDrop.addEventListener("drop", e=>{ e.preventDefault(); abDrop.classList.remove("hover"); const fs = Array.from(e.dataTransfer.files||[]).filter(f=>/pdf$/i.test(f.name)); if(fs.length) doABUploadMany(fs); });
  }
  mainEl.querySelectorAll("[data-abtoggle]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const k = p.id + "|" + btn.dataset.abtoggle;
      if(expandedABs.has(k)) expandedABs.delete(k); else expandedABs.add(k);
      renderProjectDetail(projectId);
    });
  });
  mainEl.querySelectorAll("[data-abdel]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if(!confirm(`AB ${btn.dataset.abdel} von diesem Auftrag entfernen?`)) return;
      await detachAB(p.id, btn.dataset.abdel);
      renderProjectDetail(projectId);
    });
  });
  mainEl.querySelectorAll("[data-abpos]").forEach(sel=>{
    const [nr, posNr] = sel.dataset.abpos.split("|");
    const ab = (p.abs||[]).find(a=>a.nr===nr);
    const pos = ab && (ab.positionen||[]).find(x=>x.pos===posNr);
    if(!pos) return;
    sel.value = pos.category || "";
    sel.addEventListener("change", async ()=>{
      pos.category = sel.value;
      pos.categoryManual = true;
      pos.material = pos.category==="Beplankung" ? (normMaterial(pos.artikel+" "+pos.beschreibung) || null) : null;
      await saveProject(p);
      renderProjectDetail(projectId);
    });
  });

  // --- Soll manuell ---
  const setManualSoll = (cat)=>{
    const cur = p.soll && p.soll[cat] && num(p.soll[cat].menge)!=null ? p.soll[cat].menge : "";
    const a = abSoll(p)[cat];
    const v = prompt(`Soll für „${catLabel(cat)}“ in ${catUnit(cat)} manuell setzen.${a?`\nLaut AB: ${fmtQty(a.menge)} ${catUnit(cat)}.`:""}\nLeer lassen = ${a?"AB-Wert verwenden":"kein Soll"}.`, cur);
    if(v===null) return;
    if(!p.soll) p.soll = {};
    const val = v.trim()==="" ? null : parseSwissNumber(v);
    p.soll[cat] = { menge: val, einheit: catUnit(cat) };
    saveProject(p);
    renderProjectDetail(projectId);
  };
  mainEl.querySelectorAll("[data-openunassigned]").forEach(a=> a.addEventListener("click", (e)=>{ e.preventDefault(); expandedInvoiceId = a.dataset.openunassigned; projTabFor[p.id] = "invoices"; renderProjectDetail(projectId); const el = document.getElementById("editPanel-"+expandedInvoiceId); if(el) el.scrollIntoView({behavior:"smooth", block:"center"}); }));
  mainEl.querySelectorAll("[data-sollset]").forEach(btn=> btn.addEventListener("click", ()=> setManualSoll(btn.dataset.sollset)));
  const addSoll = document.getElementById("addSollCat");
  addSoll.addEventListener("change", ()=>{ if(addSoll.value) setManualSoll(addSoll.value); addSoll.value = ""; });

  // --- Rechnungen ---
  mainEl.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const inv = DB.invoices.find(i=>i.id===btn.dataset.del);
      if(!inv || !canDeleteInvoice(inv)){ toast("Keine Berechtigung zum Löschen."); return; }
      if(!confirm("Diese Rechnung wirklich löschen?")) return;
      await deleteInvoiceDoc(btn.dataset.del);
      renderProjectDetail(projectId);
    });
  });
  mainEl.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      expandedInvoiceId = (expandedInvoiceId === btn.dataset.edit) ? null : btn.dataset.edit;
      projTabFor[p.id] = "invoices";
      renderProjectDetail(projectId);
    });
  });
  if(expandedInvoiceId){
    const panel = document.getElementById(`editPanel-${expandedInvoiceId}`);
    if(panel) renderInvoiceEditPanel(panel, expandedInvoiceId);
  }
}

function renderInvoiceEditPanel(panel, invoiceId){
  const getInv = ()=> DB.invoices.find(i=>i.id===invoiceId);
  const inv = getInv();
  if(!inv) return;
  panel.innerHTML = `
    <div style="background:var(--surface);border-radius:8px;padding:16px;margin:6px 0;">
      <div class="row">
        <label class="field"><span>Lieferant</span><input type="text" data-ef="lieferant" value="${escapeAttr(inv.lieferant||"")}"></label>
        <label class="field"><span>Rechnungsnr.</span><input type="text" data-ef="rechnungsnr" value="${escapeAttr(inv.rechnungsnr||"")}"></label>
        <label class="field"><span>Datum</span><input type="text" data-ef="datum" value="${escapeAttr(inv.datum||"")}"></label>
        <label class="field"><span>Betrag CHF (Rechnungstotal)</span><input type="number" step="any" data-ef="total" value="${inv.total!=null?inv.total:""}"></label>
        <label class="field"><span>Haus</span><input type="text" data-ef="haus" value="${escapeAttr(inv.haus||"")}" placeholder="z.B. 1, A"></label>
        <label class="field"><span>Bezahlt am</span><input type="date" data-ef="bezahltAm" value="${escapeAttr(inv.bezahltAm||"")}"></label>
      </div>
      ${inv.objekt ? `<div class="muted" style="font-size:12px;margin:-4px 0 8px 0;">Objekt laut Rechnung: ${escapeHtml(inv.objekt)}</div>` : ""}
      <div class="section-title">Positionen</div>
      <div class="itemsSlot"></div>
      <div class="pruefSlot" style="margin-top:14px;"></div>
      ${inv.rawText ? `<div style="margin-top:10px;"><button class="small" data-reparse title="Liest Positionen und Betrag mit der aktuellen Erkennung neu aus dem gespeicherten Rechnungstext">↻ Positionen &amp; Betrag neu auslesen</button></div>` : ""}
      ${auditHtml(inv)}
      ${inv.rawText ? `<details style="margin-top:10px;"><summary class="muted" style="cursor:pointer;font-size:12px;">Rohtext der Rechnung anzeigen</summary><textarea class="raw" readonly style="width:100%;margin-top:6px;">${escapeHtml(inv.rawText)}</textarea></details>` : ""}
    </div>
  `;
  const pruefSlot = panel.querySelector(".pruefSlot");
  const rp = panel.querySelector("[data-reparse]");
  if(rp) rp.addEventListener("click", async ()=>{
    const i = getInv(); if(!i) return;
    const r = reparseInvoice(i);
    if(!r){ toast("Nichts Neues erkannt."); return; }
    const sumOld = (i.items||[]).reduce((s,x)=>s+(num(x.preis)||0),0), sumNew = r.items.reduce((s,x)=>s+(num(x.preis)||0),0);
    if(!confirm(`Neu ausgelesen:\n\nPositionen: CHF ${fmt(sumOld)} → CHF ${fmt(sumNew)}\nRechnungsbetrag: ${i.total!=null?"CHF "+fmt(i.total):"–"} → ${r.total!=null?"CHF "+fmt(r.total):"–"}\n\nÜbernehmen?`)) return;
    i.items = r.items; if(r.total!=null) i.total = r.total;
    await saveInvoice(i);
    toast("Neu ausgelesen und gespeichert.");
    renderInvoiceEditPanel(panel, invoiceId);
  });
  const itemsSlot = panel.querySelector(".itemsSlot");
  const refresh = ()=> renderPruefPanel(pruefSlot, getInv);
  panel.querySelectorAll("[data-ef]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const i = getInv(); if(!i) return;
      const f = inp.dataset.ef;
      i[f] = (f==="total") ? (inp.value===""?null:parseFloat(inp.value)) : inp.value;
    });
    inp.addEventListener("change", ()=>{
      const i = getInv(); if(!i) return;
      if(inp.dataset.ef==="haus"){ i.haus = normHaus(inp.value); inp.value = i.haus; }
      saveInvoice(i);
      if(inp.dataset.ef==="rechnungsnr") learnRechnungsnr(i);
      if(inp.dataset.ef==="lieferant") renderItemsTable(itemsSlot, getInv, refresh);
      refresh();
    });
  });
  renderItemsTable(itemsSlot, getInv, refresh);
  refresh();
}

let invFilter = "alle";
function renderInvoices(){
  if(!DB.invoices.length){
    mainEl.innerHTML = `<h1>Alle Rechnungen</h1><div class="empty">Noch keine Rechnungen erfasst.</div>`;
    return;
  }
  const keyOf = {}; DB.invoices.forEach(i => keyOf[i.id] = invStatusKey(i));
  const dnum = s => { const d = parseDateCH(s); return d ? d.getTime() : 0; };
  const cnt = k => DB.invoices.filter(i=>keyOf[i.id]===k).length;
  const sorted = DB.invoices.slice()
    .filter(i => invFilter==="alle" || keyOf[i.id]===invFilter)
    .sort((a,b)=> (INV_STATUS_ORDER[keyOf[a.id]] - INV_STATUS_ORDER[keyOf[b.id]]) || (dnum(b.datum) - dnum(a.datum)));
  const chip = (k, label, cls) => `<button class="tab ${invFilter===k?"active":""}" data-invf="${k}">${label} <span class="${cls||"muted"}" style="margin-left:4px;">${k==="alle" ? DB.invoices.length : cnt(k)}</span></button>`;
  mainEl.innerHTML = `
    <h1>Alle Rechnungen</h1>
    <p class="subtitle">${DB.invoices.length} Rechnung(en) über alle Aufträge. Auffällige Rechnungen stehen zuoberst.</p>
    <div class="tabs">
      ${chip("alle","Alle")}
      ${chip("fehler","✗ Fehler – noch offen")}
      ${chip("ok_abw","⚠ Freigegeben mit Abweichung")}
      ${chip("beanstandet","Beanstandet")}
      ${chip("offen","Offen")}
      ${chip("ok","✓ Freigegeben ohne Abweichung")}
    </div>
    <div id="searchSlot"></div>
    <div class="card">
      <table>
        <thead><tr><th>Datum</th><th>Lieferant</th><th>Auftrag</th><th>Rechnungsnr.</th><th>Mengen</th><th>Prüfung</th><th>Zuletzt geändert</th><th></th></tr></thead>
        <tbody id="invTableBody">
          ${sorted.map(inv=>{
            const p = DB.projects.find(x=>x.id===inv.projectId);
            const search = invSearchText(inv);
            return `<tr data-search="${escapeAttr(search)}" class="${invoiceNeedsReview(inv)?'needs-review':''}">
              <td style="cursor:pointer;" data-goto="${inv.projectId}">${escapeHtml(inv.datum||"—")}</td>
              <td style="cursor:pointer;" data-goto="${inv.projectId}">${escapeHtml(inv.lieferant||"—")}</td>
              <td style="cursor:pointer;" data-goto="${inv.projectId}">${p?escapeHtml(p.name):'<span class="muted">gelöschter Auftrag</span>'}${inv.haus?` <span class="hchip ok">${escapeHtml(inv.haus)}</span>`:""}</td>
              <td style="cursor:pointer;" data-goto="${inv.projectId}">${escapeHtml(inv.rechnungsnr||"—")}</td>
              <td style="cursor:pointer;" data-goto="${inv.projectId}">${invoiceNeedsReview(inv) ? `<span class="pill warn">⚠ Prüfen</span> ` : ""}${inv.items.map(it=>`<span class="tag">${escapeHtml(it.category)}: ${it.menge??"?"} ${escapeHtml(it.einheit||"")}</span>`).join(" ")}</td>
              <td style="cursor:pointer;" data-goto="${inv.projectId}" data-openinv="${inv.id}">${findingsPill(inv)}</td>
              <td style="font-size:11.5px;" class="muted" title="${escapeAttr((inv.verlauf||[]).slice(-1).map(e=>e.was).join(""))}">${inv.geaendertAm ? `${escapeHtml(inv.geaendertName || nameFromEmail(inv.geaendertVon))}<br>${escapeHtml(String(inv.geaendertAm).replace(/,\s*/, " "))}` : "–"}</td>
              <td style="white-space:nowrap;"><button class="small" data-shareinvl="${inv.id}" title="Teilen">📤</button> <button class="small danger" data-delinv="${inv.id}" ${canDeleteInvoice(inv)?"":"disabled title='Nur eigene Rechnungen innerhalb von 5 Stunden, sonst Admin'"}>Löschen</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  `;
  mainEl.querySelectorAll("[data-invf]").forEach(b=>b.addEventListener("click", ()=>{ invFilter = b.dataset.invf; renderInvoices(); }));
  addSearchBox(document.getElementById("searchSlot"), "Rechnungen suchen…", (q)=>{
    document.querySelectorAll("#invTableBody tr").forEach(el=>{
      el.style.display = el.dataset.search.includes(q) ? "" : "none";
    });
  });
  mainEl.querySelectorAll("[data-goto]").forEach(cell=>{
    cell.addEventListener("click", ()=>{
      if(cell.dataset.openinv) expandedInvoiceId = cell.dataset.openinv;
      navigateTo("projectDetail", { projectId: cell.dataset.goto });
    });
  });
  mainEl.querySelectorAll("[data-shareinvl]").forEach(b=>b.addEventListener("click", (e)=>{
    e.stopPropagation();
    const inv = DB.invoices.find(i=>i.id===b.dataset.shareinvl); if(!inv) return;
    openShareDialog({ type:"invoice", id:inv.id, label: invoiceLinkLabel(inv) }, "Bitte prüfen.");
  }));
  mainEl.querySelectorAll("[data-delinv]").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      const inv = DB.invoices.find(i=>i.id===btn.dataset.delinv);
      if(!inv || !canDeleteInvoice(inv)){ toast("Keine Berechtigung zum Löschen."); return; }
      if(!confirm("Diese Rechnung wirklich löschen?")) return;
      await deleteInvoiceDoc(inv.id);
      toast("Rechnung gelöscht.");
      renderInvoices();
    });
  });
}

    mainEl.innerHTML = `<h1>Benutzerverwaltung</h1><div class="empty">Nur für Admins zugänglich.</div>`;

      <table>
        <thead><tr><th>E-Mail</th><th>Status</th><th>Rolle</th><th>Aufträge löschen</th><th>Subunternehmer löschen</th><th>Beliebige Rechnung löschen</th><th>Preise bearbeiten</th><th title="Erscheinen im Stempel bei Mat.preis">Initialen</th><th title="Wird in Briefen, E-Mails und Nachrichten verwendet">Name</th></tr></thead>

                  <option value="mitarbeiter" ${u.role!=="admin"?"selected":""}>Mitarbeiter</option>
                  <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>
                </select>
              </td>
              <td><input type="checkbox" data-perm="deleteAuftraege" ${u.permissions?.deleteAuftraege?"checked":""} ${u.role==="admin"?"disabled":""}></td>
              <td><input type="checkbox" data-perm="deleteSubunternehmer" ${u.permissions?.deleteSubunternehmer?"checked":""} ${u.role==="admin"?"disabled":""}></td>
              <td><input type="checkbox" data-perm="deleteAnyRechnung" ${u.permissions?.deleteAnyRechnung?"checked":""} ${u.role==="admin"?"disabled":""}></td>
              <td><input type="checkbox" data-perm="editPreise" ${u.permissions?.editPreise?"checked":""} ${u.role==="admin"?"disabled":""}></td>
              <td><input type="text" data-initialen="${u.id}" value="${escapeAttr(u.initialen||"")}" placeholder="${escapeAttr(defaultInitials(u.email))}" maxlength="5" style="width:70px;text-transform:uppercase;"></td>
              <td><input type="text" data-anzeigename="${u.id}" value="${escapeAttr(u.anzeigename||"")}" placeholder="z.B. Ajdin Slijepcevic" style="width:180px;"></td>
            </tr>
          `).join("")}

const STOPWORDS = new Set(["und","der","die","das","von","für","fur","mit","inkl","exkl","gem","gemäss","gemass","pro","per","auf","bei","nach","total","chf","stk","std","bau","zum","zur","des","dem","den","ein","eine","als","wie","sowie","oder","bis","aus","dto","pos","menge","preis"]);
const EXKL_GENERIC = new Set(["montage","einbau","geberit","lieferung","material","arbeiten","inklusive","exklusive","pauschal","offerte","dieser","sind","nicht","enthalten","lieferumfang","werden","können","konnen"]);

function slugify(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,80) || ("sub-" + Date.now().toString(36));
}
function catDef(key){ return (DB.categories||DEFAULT_CATEGORIES).find(c=>c.key===key) || null; }
function catLabel(key){ const c = catDef(key); return c ? c.label : (key||"—"); }
function catUnit(key){ const c = catDef(key); return c ? c.unit : ""; }
function unitKey(u){
  const t = String(u||"").toLowerCase().replace(/[.\s]/g,"");
  if(t==="m2"||t==="m²") return "m2";
  if(t==="m3"||t==="m³") return "m3";
  if(t==="st"||t==="stk"||t==="stück"||t==="stuck"||t==="psch"||t==="le"||t==="pauschal") return "stk";
  if(t==="h"||t==="std"||t==="stunden") return "h";
  if(t==="app"||t==="apparat"||t==="apparate") return "app";
  return t;
}
function num(v){ if(v===null||v===undefined||v==="") return null; const n = +v; return isNaN(n) ? null : n; }
function fmt(n){ return n==null || isNaN(n) ? "—" : formatCHF(+n); }
function fmtQty(n){ return n==null || isNaN(n) ? "—" : (Math.round(n*100)/100).toLocaleString("de-CH"); }
function shortText(s, n){ s = String(s||"").trim(); return s.length>(n||45) ? s.slice(0,(n||45)-1)+"…" : s; }
// Positionstext ohne angehaengte Mengen/Preise (fuer Meldungen)
function displayLabel(s){
  let t = String(s||"").trim();
  t = t.replace(/^\s*\d{1,3}[.)]?\s+(\d{4,}\s+)?/, "");                         // Pos.-Nr. / Artikel-Nr. vorne
  t = t.replace(/\s*-?[\d']+(?:[.,]\d+)?\s*(?:m2|m²|m3|m³|stk\.?|st\.?|std\.?|stunden|h|app\.?|le|psch\.?|pauschal)(?=\s|$)/i, " "); // Menge + Einheit
  t = t.replace(/(\s+-?[\d']+[.,]\d{2})+\s*(chf)?\s*$/i, "");                  // Preise am Ende
  t = t.replace(/\s{2,}/g, " ").trim();
  return shortText(t || String(s||"").trim(), 55);
}

function getSubFor(name){
  if(!name) return null;
  const n = String(name).toLowerCase().trim();
  const c = String(name).toLowerCase().replace(/[^a-z0-9äöü]/g,"");
  return (DB.subs||[]).find(s => (s.name||"").toLowerCase().trim()===n || (s.aliases||[]).some(a=>String(a).toLowerCase().trim()===n))
      || (c.length >= 5 ? (DB.subs||[]).find(s => [s.name, ...(s.aliases||[])].some(a => String(a||"").toLowerCase().replace(/[^a-z0-9äöü]/g,"") === c)) : null)
      || null;
}

// Vom Benutzer gepflegte Firmennamen/Aliase im Rechnungskopf suchen (hat Vorrang vor der automatischen Erkennung)
function compactName(s){ return String(s||"").toLowerCase().replace(/\b(gmbh|ag|sa|sàrl|klg)\b/g,"").replace(/[^a-z0-9äöü]/g,""); }
function matchSubInText(text, currentName){
  const cur = compactName(currentName);
  const all = compactName(text);
  const head = compactName(String(text||"").split("\n").slice(0,30).join(" "));
  const termsOf = s => [s.name, ...(s.aliases||[])].map(compactName).filter(t=>t.length>=4);
  for(const s of (DB.subs||[])) if(termsOf(s).some(t => cur && (cur===t || cur.includes(t)))) return s;
  for(const s of (DB.subs||[])) if(termsOf(s).some(t => head.includes(t))) return s;
  for(const s of (DB.subs||[])) if(termsOf(s).some(t => t.length>=8 && all.includes(t))) return s; // z.B. im QR-Zahlteil
  return null;
}

function normMaterial(s){
  if(!s) return null;
  const t = String(s).toLowerCase();
  if(/aqua\s*-?pan/.test(t)) return "Aquapanel";
  const m = t.match(/(\d)\s*[x×]\s*(\d{1,2}(?:[.,]\d)?)\s*(?:mm)?(?!\d)/);
  if(m) return `${m[1]}x${m[2].replace(",",".")}mm`;
  return null;
}

function labelTokens(s){
  return String(s||"").toLowerCase().replace(/[^a-zäöüß0-9 ]/g," ").split(/\s+/)
    .filter(w => w.length>2 && !/^\d/.test(w) && !STOPWORDS.has(w));
}
function jaccard(a, b){
  if(!a.length || !b.length) return 0;
  const A = new Set(a), B = new Set(b);
  let inter = 0; A.forEach(x=>{ if(B.has(x)) inter++; });
  return inter / (A.size + B.size - inter);
}
function median(arr){ const s = arr.slice().sort((a,b)=>a-b); const m = Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }

// Einheitspreis einer Rechnungsposition (explizit gelesen oder Betrag / Menge)
function itemEP(it){
  if(num(it.ep)!=null) return +it.ep;
  if(num(it.preis)!=null && num(it.menge)) return +it.preis / +it.menge;
  return null;
}

function parseDateCH(s){
  const m = String(s||"").match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
  if(!m) return null;
  let y = +m[3]; if(y<100) y += 2000;
  return new Date(y, +m[2]-1, +m[1]);
}

// Unbekannte Rechnungszeile ueber Bezeichnung/Suchbegriffe der Preisliste einer Leistung zuordnen
function classifyBySubTarif(sub, label, onlyPriced){
  const lab = String(label||"").toLowerCase();
  const lt = labelTokens(label);
  let best = null, bestScore = 0, tie = false;
  (sub.tarife||[]).forEach(t=>{
    if(!t.category) return;
    if(onlyPriced && num(t.preis)==null) return;
    let s = 0;
    String(t.keywords||"").split(",").map(k=>k.trim().toLowerCase()).filter(k=>k.length>=3).forEach(k=>{ if(lab.includes(k)) s += 2; });
    // Bezeichnung: gleiches Wort oder Wortanfang ("installation" passt zu "installationspauschale")
    labelTokens(t.bezeichnung).forEach(x=>{
      if(lt.includes(x)) s += x.length >= 6 ? 2 : 1;
      else if(x.length >= 6 && lt.some(y => y.startsWith(x) || (y.length >= 6 && x.startsWith(y)))) s += 2;
    });
    if(s > bestScore){ best = t; bestScore = s; tie = false; }
    else if(s === bestScore && s > 0 && best && best.id !== t.id && (best.category !== t.category || +best.preis !== +t.preis)) tie = true;
  });
  return bestScore >= 2 && !tie ? best : null;
}

// Passenden Tarif (Preis) des Subunternehmers fuer eine Rechnungsposition finden
function findTarif(sub, inv, it){
  if(!sub) return { tarif:null, reason:"kein Subunternehmer hinterlegt" };
  const all = (sub.tarife||[]).filter(t => num(t.preis)!=null);
  if(it.tarifId){
    const t = all.find(x=>x.id===it.tarifId);
    if(t) return { tarif:t, manual:true };
  }
  const d = parseDateCH(inv && inv.datum) || new Date();
  let cands = all.filter(t => t.category===it.category);
  if(!cands.length || it.category==="Sonstiges"){
    const byLabel = classifyBySubTarif(sub, it.label, true);
    if(byLabel) return { tarif: byLabel, viaLabel: true };
    if(it.category==="Sonstiges") return { tarif:null, reason:"keine passende Zeile in der Preisliste" };
    return { tarif:null, reason:`kein Preis für „${catLabel(it.category)}“ hinterlegt` };
  }
  // nur zum Rechnungsdatum gueltige Preise; je Bezeichnung die neuste gueltige Version
  const valid = cands.filter(t => !t.gueltigAb || new Date(t.gueltigAb) <= d);
  if(valid.length) cands = valid;
  const latest = {};
  cands.forEach(t=>{
    const k = [t.category, (t.bezeichnung||"").toLowerCase(), (t.material||"").toLowerCase()].join("|");
    if(!latest[k] || String(t.gueltigAb||"") > String(latest[k].gueltigAb||"")) latest[k] = t;
  });
  cands = Object.values(latest);

  const mat = it.category==="Beplankung" ? normMaterial(it.label) : null;
  if(mat){
    const withMat = cands.filter(t => normMaterial(t.material||t.bezeichnung)===mat);
    if(withMat.length) cands = withMat;
    else if(cands.some(t => t.material)) return { tarif:null, reason:`kein Preis für Beplankung ${mat} hinterlegt` };
  }
  if(cands.length===1) return { tarif:cands[0] };

  const lab = String(it.label||"").toLowerCase();
  const lt = labelTokens(it.label);
  const scored = cands.map(t=>{
    let s = 0;
    String(t.keywords||"").split(",").map(k=>k.trim().toLowerCase()).filter(Boolean).forEach(k=>{ if(lab.includes(k)) s += 2; });
    s += labelTokens(t.bezeichnung).filter(x=>lt.includes(x)).length;
    if(t.einheit && it.einheit && unitKey(t.einheit)!==unitKey(it.einheit)) s -= 1;
    return { t, s };
  }).sort((a,b)=>b.s-a.s);
  if(scored[0].s > scored[1].s) return { tarif:scored[0].t };
  const top = scored.filter(x=>x.s===scored[0].s);
  const ep = itemEP(it);
  if(ep!=null){
    const hit = top.find(x=>Math.abs(+x.t.preis - ep) <= 0.01);
    if(hit) return { tarif:hit.t };
  }
  if(top.every(x=>+x.t.preis === +top[0].t.preis)) return { tarif:top[0].t };
  return { tarif:null, ambiguous: top.map(x=>x.t), reason:"mehrere Preise möglich – bitte Tarif in der Position wählen" };
}

const AB_PARSER_VERSION = 3;
// Bereits gespeicherte ABs mit dem aktuellen Leser neu auswerten (Rohtext ist gespeichert -> kein erneuter Upload noetig)
let abMigrationDone = false;
let supplierFixDone = false;
let houseFixDone = false;
async function fillMissingHouses(){

  for(const p of DB.projects){
    if(!DB.invoices.some(i=>i.projectId===p.id && !i.haus)) continue;

  }
}
async function normalizeSupplierNames(){
  if(supplierFixDone || !(DB.subs||[]).length) return;
  supplierFixDone = true;
  for(const inv of DB.invoices){
    if(getSubFor(inv.lieferant)) continue;
    const s = matchSubInText("", inv.lieferant);
    if(s && s.name !== inv.lieferant){ inv.lieferant = s.name; try{ await window.fb.setDocMerge("invoices", inv.id, { lieferant: s.name }); }catch(e){} }
  }
}
async function migrateABs(){
  if(abMigrationDone) return;
  abMigrationDone = true;
  for(const p of DB.projects){
    let changed = false;
    const abs = (p.abs||[]).map(old=>{
      if(!old.rawText || (old.parserVersion||0) >= AB_PARSER_VERSION) return old;
      const ab = parseABText(old.rawText);
      ab.rawText = old.rawText; ab.filename = old.filename || ""; ab.importedAt = old.importedAt || ""; ab.importedBy = old.importedBy || "";
      ab.parserVersion = AB_PARSER_VERSION;
      if(!ab.haus) ab.haus = hausFromText(String(old.filename||"").replace(/_+/g," "));
      if(old.haus) ab.haus = old.haus; // manuelle Haus-Zuordnung behalten
      ab.positionen.forEach(np=>{
        const op = (old.positionen||[]).find(o=>o.pos===np.pos && o.artikel===np.artikel);
        if(op && op.categoryManual){ np.category = op.category; np.categoryManual = true; }
      });
      changed = true;
      return ab;
    });
    if(changed){
      p.abs = abs;
      const hs = abs.map(a=>a.haus).filter(Boolean);
      if(hs.length) p.haeuser = Array.from(new Set([...(p.haeuser||[]), ...hs]));
      try{ await saveProject(p); }catch(err){ console.warn("AB-Aktualisierung fehlgeschlagen", err); }
    }
  }
}

function isABText(text){
  return /Auftragsbest[äa]tigung\s+\d{5,}\s*\/\s*A-\d+/i.test(text) && /pe[\s-]?fabrikation/i.test(text);
}
function normalizeABUnit(u){
  const t = String(u||"").toUpperCase();
  if(t==="ST"||t==="STK") return "Stk";
  if(t==="M2") return "m²";
  if(t==="M3") return "m³";
  if(t==="H"||t==="STD") return "h";
  if(t==="M"||t==="LM") return "m";
  if(t==="PA"||t==="PAU"||t==="PSCH") return "Psch";
  return u;
}
function suggestABCategory(pos){
  const t = (pos.artikel + " " + pos.beschreibung).toLowerCase();
  const art = String(pos.artikel||"").toLowerCase();
  if(/anfahrt|parking/.test(t)) return "Anfahrt";
  if(/entsorgung|abfall/.test(t)) return "Entsorgung";
  if(pos.einheit==="m²" || /beplank/.test(t)) return "Beplankung";
  if(pos.einheit==="m³" || /ausflock/.test(t)) return "Ausflockung";
  if(/silent\s*-?panel/.test(t)) return "SilentPanel";
  if(/duofix/.test(t)) return "Duofix";
  if(/^twm\b/.test(art) || (/montage/.test(t) && /trennwand/.test(t))) return "TW";
  if(/^vwm\b/.test(art) || (/montage/.test(t) && /vorwand/.test(t))) return "VW";
  if(/verbinden/.test(t) && /(schweiss|press|anschliess)/.test(t)) return "Verbinden";
  if(pos.einheit==="h" && /regie/.test(t)) return "Regie";
  return ""; // nicht Sub-relevant (z.B. Vorfabrikation / Material PE)
}

function parseABText(text){
  text = normalizeDigits(text);
  const lines = String(text||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const ab = { nr:"", anr:"", baustelle:"", kunde:"", kontakt:"", bestelldatum:"", offertdatum:"", einheiten:null,
               inkl:[], exkl:[], positionen:[], auftragswert:null, totalInklMwst:null };
  let m = text.match(/Auftragsbest[äa]tigung\s+(\d{5,})\s*\/\s*(A-\d+)/i);
  if(m){ ab.nr = m[1]; ab.anr = m[2]; }
  m = text.match(/Baustelle\s*:\s*([^\n]+)/i);
  if(m) ab.baustelle = m[1].trim();
  m = text.match(/^Fax[\s\d]+?\s([A-ZÄÖÜ][^\n]+)$/m);
  if(m) ab.kunde = m[1].trim();
  else {
    const i = lines.findIndex(l=>/^Fax\s/i.test(l));
    if(i>-1 && lines[i+1] && !/Auftragsbest/i.test(lines[i+1])) ab.kunde = lines[i+1];
  }
  m = text.match(/Ihr Kontakt\s*:\s*(.+?)(?:\s+Kunden-Nr|\n|$)/i); if(m) ab.kontakt = m[1].trim();
  m = text.match(/Bestellung vom\s*:\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i); if(m) ab.bestelldatum = m[1];
  m = text.match(/Offert-Datum\s*:\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i); if(m) ab.offertdatum = m[1];
  m = text.match(/f[üu]r\s+(\d+)\s+Einheiten/i); if(m) ab.einheiten = +m[1];
  m = text.match(/Bestell-Nr\s*:\s*(.+?)(?:\s+Versandart|\n|$)/i); ab.bestellnr = m ? m[1].trim() : "";
  m = ab.bestellnr.match(/\bLos\s*(\d+)/i) || text.match(/\bLos\s+(\d+)\b/i); ab.los = m ? m[1] : "";
  const hausLine = lines.slice(0, 40).find(l => /^(haus|gebäude|block|trakt)\s+[0-9a-z]{1,4}$/i.test(l));
  ab.haus = hausFromText(ab.baustelle) || hausFromText(ab.bestellnr) || hausFromText(hausLine || "");
  m = text.match(/exkl\.?\s*MwSt\s+([\d']+\.\d{2})/i); if(m) ab.auftragswert = parseSwissNumber(m[1]);
  m = text.match(/Gesamtbetrag\s+inkl\.?\s*MwSt\s+([\d']+\.\d{2})/i); if(m) ab.totalInklMwst = parseSwissNumber(m[1]);

  // Inkl./Exkl.-Vermerke (auch "... | exkl. ..." innerhalb einer Zeile) und "nicht enthalten"-Saetze
  lines.forEach((line, idx)=>{
    if(/^(inkl|exkl)\.?\s/i.test(line)){
      line.split(/\s*\|\s*|\s+I\s+(?=exkl)|\s+(?=exkl\.)/i).map(s=>s.trim()).filter(Boolean).forEach(part=>{
        part = part.replace(/\s+[I|]\s*$/, "").trim();
        if(/^exkl/i.test(part)) ab.exkl.push(part);
        else if(/^inkl/i.test(part)) ab.inkl.push(part);
      });
    } else if(/nicht\s+(im\s+lieferumfang\s+)?enthalten/i.test(line)){
      let sentence = /^sind\s+nicht/i.test(line) && lines[idx-1] ? (lines[idx-1] + " " + line) : line;
      sentence = sentence.split(/\s*,\s*Sie\s/i)[0].trim();
      ab.exkl.push(sentence);
    }
  });
  ab.inkl = Array.from(new Set(ab.inkl));
  ab.exkl = Array.from(new Set(ab.exkl));

  // Positionen: "003 Element 16.000 ST 810.93/1 12'974.90" + Beschreibungszeilen
  const posRe = /^(\d{3})\s+(.+?)\s+(-?[\d']+\.\d{1,3})\s+(ST|STK|M2|M3|M|LM|H|STD|PA|PAU|PSCH|KG|L)\s+(-?[\d']+\.\d{2})\/(\d+)\s+(-?[\d']+\.\d{2})$/i;
  // Pauschal-ABs: Position nur mit Menge, Preis steht in der Gruppensumme ("027 AUSFS 83.000 M3")
  const posRe2 = /^(\d{3})\s+(.+?)\s+(-?[\d']+\.\d{1,3})\s+(ST|STK|M2|M3|M|LM|H|STD|PA|PAU|PSCH|KG|L)$/i;
  const blocks = []; let blockStart = 0;
  const noise = [/^PE Fabrikations AG$/i, /^Feldmoosstrasse/i, /^www\./i, /^Tel\.\s/i, /^Fax\s/i, /^Auftragsbest[äa]tigung\s+\d+/i, /^Mwst-Nr/i, /^-$/];
  let started = false, group = "", cur = null;
  for(const line of lines){
    if(/^Pos\s+Artikel/i.test(line)){ started = true; cur = null; continue; }
    if(!started) continue;
    if(/^Übertrag/i.test(line)){ cur = null; continue; }
    if(noise.some(r=>r.test(line))) continue;
    if(/^Summe von/i.test(line)){
      const sm = line.match(/(-?[\d']+\.\d{2})\s*$/);
      blocks.push({ from: blockStart, to: ab.positionen.length, sum: sm ? parseSwissNumber(sm[1]) : null });
      blockStart = ab.positionen.length;
      cur = null; continue;
    }
    if(/^-\s*[A-ZÄÖÜ][A-ZÄÖÜ\s\/]*-?$/.test(line)){ cur = null; continue; } // Zwischentitel wie "-TRENNWAND-"
    if(/^(Porto\/Verpackung|Gesamtbetrag|Zahlungskonditionen|Es freut uns)/i.test(line)){ cur = null; started = false; continue; }
    const pm = line.match(posRe);
    if(pm){
      const per = +pm[6] || 1;
      cur = { pos: pm[1], artikel: pm[2].trim(), menge: parseSwissNumber(pm[3]), einheit: normalizeABUnit(pm[4]),
              ep: roundNum(parseSwissNumber(pm[5]) / per), betrag: parseSwissNumber(pm[7]), rabatt: null,
              gruppe: group, beschreibung: [] };
      ab.positionen.push(cur);
      continue;
    }
    const pm2 = line.match(posRe2);
    if(pm2){
      cur = { pos: pm2[1], artikel: pm2[2].trim(), menge: parseSwissNumber(pm2[3]), einheit: normalizeABUnit(pm2[4]),
              ep: null, betrag: null, rabatt: null, gruppe: group, beschreibung: [] };
      ab.positionen.push(cur);
      continue;
    }
    if(cur){
      if(/^\(-?\d+\.\d{2}\)$/.test(line)) continue; // reine Rundungszeile
      let d = line;
      const rm = d.match(/\s(\d{1,2}(?:\.\d{1,2})?)\s*%\s*\(-?[\d'.]+\)\s*$/);
      if(rm){ cur.rabatt = parseFloat(rm[1]); d = d.slice(0, rm.index); }
      d = d.replace(/(\s*\(-?\d+\.\d{2}\))+\s*$/, "").trim();
      if(d) cur.beschreibung.push(d);
      continue;
    }
    if(!/^(inkl|exkl)\.?\s/i.test(line)) group = line; // Gruppentitel (z.B. "Montage GIS auf Bau")
  }
  ab.positionen = ab.positionen.map(p=>{
    const beschreibung = p.beschreibung.join("\n");
    const out = { ...p, beschreibung };
    out.category = suggestABCategory(out);
    out.categoryManual = false;
    out.material = out.category==="Beplankung" ? (normMaterial(out.artikel + " " + beschreibung) || null) : null;
    const lf = beschreibung.match(/Leitfadenzeit[^\n]*?(\d+(?:[.,]\d+)?)\s*h\b/i);
    out.leitfadenzeitH = lf ? parseSwissNumber(lf[1]) : null;
    if(out.menge===null) out.menge = 0;
    if(out.ep===null || isNaN(out.ep)) out.ep = null;
    out.betragAnteilig = false;
    return out;
  });
  // Gruppensumme auf Positionen ohne eigenen Preis verteilen (fuer Erloes/Marge)
  blocks.forEach(b=>{
    if(b.sum==null) return;
    const ps = ab.positionen.slice(b.from, b.to);
    const unpriced = ps.filter(p=>p.betrag===null);
    if(!unpriced.length) return;
    const rest = b.sum - ps.filter(p=>p.betrag!==null).reduce((s,p)=>s+p.betrag,0);
    let targets = unpriced.filter(p=>p.category && !["Anfahrt","Entsorgung"].includes(p.category));
    if(!targets.length) targets = unpriced;
    const sameUnit = targets.every(t=>t.einheit===targets[0].einheit);
    const tot = sameUnit ? targets.reduce((s,t)=>s+(t.menge||0),0) : targets.length;
    targets.forEach(t=>{
      t.betrag = roundNum(rest * (sameUnit && tot ? (t.menge||0)/tot : 1/targets.length));
      t.betragAnteilig = true;
      if(t.menge) t.ep = roundNum(t.betrag / t.menge);
    });
  });
  ab.positionen.forEach(p=>{ if(p.betrag===null) p.betrag = 0; });
  return ab;
}

// Soll-Werte aus den ABs eines Auftrags (Summe pro Kategorie); haus = nur ABs dieses Hauses
function abSoll(p, haus){
  const out = {};
  (p && p.abs || []).filter(ab => haus===undefined || ab.haus===haus).forEach(ab => (ab.positionen||[]).forEach(pos=>{
    if(!pos.category) return;
    const o = out[pos.category] || (out[pos.category] = { menge:0, erloes:0, einheit:pos.einheit, materials:[], positionen:[] });
    o.menge += +pos.menge || 0;
    o.erloes += +pos.betrag || 0;
    if(pos.material && !o.materials.includes(pos.material)) o.materials.push(pos.material);
    o.positionen.push(pos);
  }));
  return out;
}
function getSoll(p, cat, haus){
  if(haus===undefined){
    const man = p && p.soll && p.soll[cat];
    if(man && num(man.menge)!=null) return { menge:+man.menge, quelle:"manuell" };
  }
  const a = abSoll(p, haus)[cat];
  if(a) return { menge: roundNum(a.menge), quelle: haus ? "AB "+haus : "AB" };
  return null;
}
function abMaterials(p, haus){ return (abSoll(p, haus).Beplankung || {}).materials || []; }

function exklTerms(line){
  let head = String(line||"").replace(/^exkl\.?\s*/i,"");
  head = head.split(/:|\sfür\s|\sfur\s|\(|\ssind\s/i)[0];
  return labelTokens(head).filter(w => w.length>=6 && !EXKL_GENERIC.has(w));
}
function exklHit(label, exklLines){
  const compact = String(label||"").toLowerCase().replace(/[^a-zäöüß0-9]/g,"");
  if(!compact) return null;
  for(const line of exklLines){
    const terms = exklTerms(line);
    if(!terms.length) continue;
    if(terms.every(t => compact.includes(t.slice(0, Math.min(t.length, 8))))) return line;
  }
  return null;
}

/* ============================= AUTOMATISCHE RECHNUNGSPRUEFUNG ============================= */

function isActiveInvoice(inv){ return !(inv.pruefung && inv.pruefung.status==="beanstandet"); }
function projName(id){ const p = DB.projects.find(x=>x.id===id); return p ? p.name : "gelöschter Auftrag"; }

// Gleiche Leistung desselben Subs auf anderen Objekten vergleichen -> Ausreisser finden
function outlierFor(inv, it){
  const S = getSettings();
  // Gibt es einen vereinbarten Preis, ist der massgebend – kein Vergleich mit (evtl. falsch gelesenen) anderen Rechnungen
  const subX = getSubFor(inv.lieferant);
  if(subX && findTarif(subX, inv, it).tarif) return null;
  if(num(it.preis)==null || +it.preis<=0) return null;
  const toks = labelTokens(it.label);
  if(!toks.length) return null;
  const myVal = itemEP(it) ?? +it.preis;
  const lief = String(inv.lieferant||"").toLowerCase();
  const refs = [];
  DB.invoices.forEach(o=>{
    if(o.id===inv.id || o.projectId===inv.projectId || !(o.pruefung && o.pruefung.status==="ok")) return;
    if(String(o.lieferant||"").toLowerCase()!==lief) return;
    (o.items||[]).forEach(x=>{
      if(x.category!==it.category || num(x.preis)==null || +x.preis<=0) return;
      if(unitKey(x.einheit)!==unitKey(it.einheit)) return;
      if(jaccard(toks, labelTokens(x.label)) < 0.5) return;
      if(x.ep!=null && num(x.menge) && Math.abs(x.menge * x.ep - x.preis) > Math.max(1, x.preis * 0.01)) return; // unstimmig gelesen
      refs.push({ inv:o, it:x, val: itemEP(x) ?? +x.preis });
    });
  });
  if(refs.length < 2) return null;
  const med = median(refs.map(r=>r.val));
  const diffTotal = (myVal - med) * (num(it.menge) && itemEP(it)!=null ? +it.menge : 1);
  if(myVal > med * S.ausreisserFaktor && diffTotal >= S.ausreisserMinCHF){
    const ex = refs.slice().sort((a,b)=>a.val-b.val)[0];
    return { med, n: refs.length, ex };
  }
  return null;
}

function checkInvoice(inv){
  const S = getSettings();
  const f = [];
  const p = DB.projects.find(x=>x.id===inv.projectId);
  const sub = getSubFor(inv.lieferant);
  const items = inv.items || [];

  // --- Doppelte Rechnung ---
  const sameLief = o => String(o.lieferant||"").toLowerCase()===String(inv.lieferant||"").toLowerCase();
  const sameTotal = o => num(o.total)!=null && num(inv.total)!=null && Math.abs(+o.total - +inv.total) < 0.01;
  if(inv.rechnungsnr && String(inv.rechnungsnr).replace(/\D/g,"").length >= 3){
    const nr = String(inv.rechnungsnr).trim().toLowerCase();
    const same = DB.invoices.filter(o => o.id!==inv.id && sameLief(o) && String(o.rechnungsnr||"").trim().toLowerCase()===nr);
    const realDup = same.find(o => sameTotal(o) || (o.projectId===inv.projectId && (!o.datum || !inv.datum || o.datum===inv.datum)));
    if(realDup){
      f.push({ level:"danger", text:`Doppelte Rechnung? Rechnungsnr. ${inv.rechnungsnr} von ${inv.lieferant} ist bereits erfasst (${realDup.datum||"ohne Datum"}, ${projName(realDup.projectId)}${num(realDup.total)!=null?", CHF "+fmt(realDup.total):""}).` });
    } else if(same.length){
      f.push({ level:"warn", text:`Rechnungsnr. ${inv.rechnungsnr} kommt auch bei einer anderen Rechnung vor (${projName(same[0].projectId)}) – Objekt/Betrag sind aber verschieden. Wahrscheinlich wurde die Nummer falsch gelesen, bitte Rechnungsnr. kontrollieren.` });
    }
  }
  if(num(inv.total)!=null && inv.datum){
    const dup2 = DB.invoices.find(o => o.id!==inv.id && sameLief(o) && o.datum===inv.datum && sameTotal(o)
      && String(o.rechnungsnr||"").trim().toLowerCase()!==String(inv.rechnungsnr||"").trim().toLowerCase());
    if(dup2) f.push({ level:"warn", text:`Gleicher Betrag (CHF ${fmt(inv.total)}) und gleiches Datum wie Rechnung ${dup2.rechnungsnr||"ohne Nr."} – evtl. doppelt?` });
  }

  // --- Stammdaten vorhanden? ---
  const hasPrices = sub && (sub.tarife||[]).some(t=>num(t.preis)!=null);
  if(!hasPrices) f.push({ level:"info", text:`Für „${inv.lieferant||"unbekannter Lieferant"}“ sind keine Preise hinterlegt (⚙️ Einstellungen → Subunternehmer & Preise) – Preisprüfung nicht möglich.` });

  const allAbs = (p && p.abs) || [];
  const houses = p ? projectHouses(p) : [];
  const invHaus = inv.haus || "";
  let scopeHaus; // undefined = ganzes Objekt
  const ohneAB = invOhneAB(inv);
  (inv.duplikatVersuche||[]).forEach(d => f.push({ level:"info", text:`Diese Rechnung wurde am ${d.am} erneut zugestellt (${d.datei||"Datei"}) – nicht doppelt gespeichert.` }));
  if(ohneAB) f.push({ level:"ok", text:`Keine AB vorhanden – bestätigt${inv.ohneAB && inv.ohneABvon ? ` von ${inv.ohneABvon}` : (!inv.ohneAB ? " (für das ganze Objekt)" : "")}. Preise werden trotzdem geprüft.` });
  if(p && !ohneAB && (houses.length > 1 || allAbs.some(a=>a.haus))){
    if(!invHaus){
      f.push({ level:"warn", text:`Objekt hat mehrere Häuser (${houses.join(", ")}) – diese Rechnung ist keinem Haus zugeordnet. Bitte Haus wählen, sonst ist keine Kontrolle pro Haus möglich.` });
    } else if(allAbs.some(a=>a.haus===invHaus)){
      scopeHaus = invHaus;
    } else if(allAbs.length && !allAbs.some(a=>!a.haus)){
      f.push({ level:"danger", text:`Für ${invHaus} ist keine AB hinterlegt – Mengen und Leistungen dieses Hauses können nicht geprüft werden.` });
    }
  }
  const abs = scopeHaus ? allAbs.filter(a=>a.haus===scopeHaus) : allAbs;
  const exklLines = abs.flatMap(a => a.exkl || []);
  const mats = abMaterials(p, scopeHaus);

  items.forEach(it=>{
    const name = `„${displayLabel(it.label) || catLabel(it.category)}“`;
    const ep = itemEP(it);
    if(!itemAssigned(inv, it)){
      f.push({ level:"warn", itemId:it.id, text:`${name}: keiner Leistung zugeordnet – Kategorie wählen, eine Zeile unter „Vereinbarter Preis“ wählen oder Position löschen.` });
    }

    // --- Preis gegen vereinbarten Tarif ---
    if(hasPrices){
      const r = findTarif(sub, inv, it);
      if(r.tarif){
        const tp = +r.tarif.preis;
        if(ep==null){
          f.push({ level:"warn", itemId:it.id, text:`${name}: kein Betrag/Einheitspreis erfasst – vereinbart wären CHF ${fmt(tp)} / ${r.tarif.einheit||""}.` });
        } else {
          const tol = Math.max(S.tolPreisCHF, tp * S.tolPreisProzent / 100);
          const diff = ep - tp;
          if(it.ep==null && num(it.menge) && +it.menge>1 && Math.abs(+it.preis - tp) <= tol){
            f.push({ level:"warn", itemId:it.id, text:`${name}: Der erfasste Betrag CHF ${fmt(it.preis)} entspricht dem Einheitspreis – wurde der Positionsbetrag richtig gelesen?` });
          } else if(diff > tol){
            const mehr = num(it.menge) ? diff * +it.menge : diff;
            f.push({ level:"danger", itemId:it.id, text:`${name}: Einheitspreis CHF ${fmt(ep)} statt vereinbart CHF ${fmt(tp)} (${r.tarif.bezeichnung}) → zu viel verrechnet: CHF ${fmt(mehr)}.` });
          } else if(-diff > tol){
            f.push({ level:"info", itemId:it.id, text:`${name}: Einheitspreis CHF ${fmt(ep)} liegt unter dem vereinbarten Preis CHF ${fmt(tp)}.` });
          } else {
            f.push({ level:"ok", itemId:it.id, text:`${name}: Preis CHF ${fmt(ep)} = vereinbart (${r.tarif.bezeichnung}).` });
          }
        }
      } else if(it.category!=="Sonstiges"){
        f.push({ level:"warn", itemId:it.id, text:`${name}: ${r.reason || "kein passender Preis gefunden"}.` });
      }
    }

    // --- Material gegen AB ---
    if(it.category==="Beplankung" && mats.length){
      const m = normMaterial(it.label);
      if(m && !mats.includes(m)) f.push({ level:"danger", itemId:it.id, text:`${name}: verrechnet ${m}, laut AB ist ${mats.join(" / ")} vorgesehen.` });
    }

    // --- Leistung laut AB ausgeschlossen? ---
    const ex = exklLines.length ? exklHit(it.label, exklLines) : null;
    if(ex) f.push({ level:"warn", itemId:it.id, text:`${name}: laut AB nicht im Auftrag („${shortText(ex,70)}“) → ablehnen oder als Nachtrag an den Kunden weiterverrechnen.` });

    // --- Regie ---
    if(it.category==="Regie" && num(it.menge)) f.push({ level:"info", itemId:it.id, text:`${name}: ${fmtQty(it.menge)} h Regie – visierten Regierapport prüfen.` });

    // --- Vergleich mit anderen Objekten ---
    const o = outlierFor(inv, it);
    if(o) f.push({ level:"warn", itemId:it.id, text:`${name}: auffällig teuer – CHF ${fmt(ep ?? it.preis)}, auf ${o.n} anderen Objekt(en) im Mittel CHF ${fmt(o.med)} (z.B. ${projName(o.ex.inv.projectId)}: CHF ${fmt(o.ex.val)}).` });
  });

  // --- Vollstaendigkeit: Summe der Positionen = Rechnungsbetrag ohne MwSt? ---
  const posSum = items.reduce((s,x)=>s+(num(x.preis)||0), 0);
  if(num(inv.total)!=null && posSum > 0){
    const netto = +inv.total / 1.081;
    if(Math.abs(posSum - netto) > Math.max(2, netto * 0.01) && Math.abs(posSum - +inv.total) > Math.max(2, +inv.total * 0.01)){
      f.push({ level:"warn", text:`Positionen ergeben CHF ${fmt(posSum)}, die Rechnung aber ca. CHF ${fmt(netto)} netto – vermutlich wurde eine Position nicht erkannt. Bitte „+ Position hinzufügen“.` });
    }
  }

  // --- Mengen kumuliert gegen Soll (AB) ---
  if(p){
    const projInvs = DB.invoices.filter(o => o.projectId===p.id && (o.id===inv.id || isActiveInvoice(o)) && (!scopeHaus || o.haus===scopeHaus));
    const hTxt = scopeHaus ? ` (${scopeHaus})` : "";
    if(!projInvs.some(o=>o.id===inv.id)) projInvs.push(inv);
    const cats = Array.from(new Set(items.map(it=>it.category).filter(Boolean)));
    cats.forEach(cat=>{
      const ist = projInvs.reduce((s,o)=> s + (o.items||[]).filter(x=>x.category===cat).reduce((a,x)=>a+(num(x.menge)||0),0), 0);
      const soll = getSoll(p, cat, scopeHaus);
      const u = catUnit(cat);
      if(!soll){
        if(abs.length && !ohneAB && !["Sonstiges","Regie"].includes(cat)){
          const kws = [catLabel(cat).toLowerCase(), ...((catDef(cat)||{}).keywords||[])].map(k=>k.trim()).filter(k=>k.length>=4);
          const inklLine = abs.flatMap(a=>a.inkl||[]).find(l => kws.some(k => l.toLowerCase().includes(k)));
          if(inklLine) f.push({ level:"warn", text:`${catLabel(cat)}${hTxt}: laut AB inklusive („${shortText(inklLine,60)}“), aber ohne Menge in der AB – Soll im Auftrag manuell setzen (✎), damit die Menge geprüft wird.` });
          else f.push({ level:"warn", text:`${catLabel(cat)}${hTxt}: in der AB nicht enthalten (kein Soll) – Nachtrag oder falsche Zuordnung?` });
        }
      } else if(ist > 0 && ist > Math.max(0, soll.menge) * (1 + S.mengenTolProzent/100) + 1e-9){
        const unsicher = !scopeHaus && houses.length > 1 && !allAbs.some(a=>a.haus);
        if(unsicher){
          f.push({ level:"warn", text:`${catLabel(cat)}: alle Häuser zusammen ${fmtQty(ist)} ${u} verrechnet, AB ${fmtQty(soll.menge)} ${u}. Gilt die AB nur für ein Haus? → im Auftrag unter „AB & Häuser“ bei der AB „Gilt für“ das Haus wählen.` });
        } else f.push({ level:"danger", text:`${catLabel(cat)}${hTxt}: kumuliert ${fmtQty(ist)} ${u} verrechnet, Soll (${soll.quelle}) ${fmtQty(soll.menge)} ${u} → ${fmtQty(ist - soll.menge)} ${u} zu viel.` });
      } else {
        f.push({ level:"ok", text:`${catLabel(cat)}${hTxt}: kumuliert ${fmtQty(ist)} von ${fmtQty(soll.menge)} ${u} (${soll.quelle}).` });
      }
    });
    if(!abs.length && !ohneAB) f.push({ level:"danger", code:"ab", text:"AB fehlt – bitte die Auftragsbestätigung hochladen oder „Keine AB vorhanden“ bestätigen." });
  }
  return f;
}

const FD_ICON = { danger:"✗", warn:"⚠", info:"ℹ", ok:"✓" };
function findingsHtml(f){
  if(!f.length) return `<div class="muted" style="font-size:12.5px;">Keine Prüfpunkte.</div>`;
  const order = { danger:0, warn:1, info:2, ok:3 };
  const sorted = f.slice().sort((a,b)=>order[a.level]-order[b.level]);
  const rest = sorted.filter(x=>x.level!=="ok"), oks = sorted.filter(x=>x.level==="ok");
  const li = x => `<li class="fd ${x.level}"><span class="fdi">${FD_ICON[x.level]}</span><span>${escapeHtml(x.text)}</span></li>`;
  return `${rest.length ? `<ul class="findings">${rest.map(li).join("")}</ul>` : `<div class="fd ok" style="font-size:12.5px;">✓ Keine Abweichungen gefunden.</div>`}
    ${oks.length ? `<details class="okdetails"><summary>✓ ${oks.length} Punkt(e) in Ordnung</summary><ul class="findings">${oks.map(li).join("")}</ul></details>` : ""}`;
}
// Gesamtstatus einer Rechnung fuer Listen/Filter
function invStatusKey(inv){
  const st = inv.pruefung && inv.pruefung.status;
  if(st === "beanstandet") return "beanstandet";
  const dev = checkInvoice(inv).some(x=>x.level==="danger");
  if(st === "ok") return dev ? "ok_abw" : "ok";
  return dev ? "fehler" : "offen";
}
const INV_STATUS_ORDER = { fehler:0, ok_abw:1, beanstandet:2, offen:3, ok:4 };
function findingsPill(inv){
  const st = inv.pruefung && inv.pruefung.status;
  if(st==="ok"){
    const dev = checkInvoice(inv).filter(x=>x.level==="danger");
    if(dev.length) return `<span class="pill warnok" title="${escapeAttr("Bewusst freigegeben trotz:\n" + dev.map(x=>"– " + x.text).join("\n"))}">✓ freigegeben · mit Abweichung</span>`;
    return `<span class="pill ok">✓ freigegeben</span>`;
  }
  if(st==="beanstandet") return `<span class="pill danger">✗ beanstandet</span>`;
  const f = checkInvoice(inv);
  const d = f.filter(x=>x.level==="danger").length, w = f.filter(x=>x.level==="warn").length;
  if(d) return `<span class="pill danger">✗ ${d} Fehler${w?` · ${w} ⚠`:""}</span>`;
  if(w) return `<span class="pill warn">⚠ ${w} Hinweis(e)</span>`;
  return `<span class="pill neutral">✓ ok – offen</span>`;
}

function beanstandungText(inv){
  const f = checkInvoice(inv).filter(x=>x.level==="danger" || x.level==="warn");
  const p = DB.projects.find(x=>x.id===inv.projectId);
  return [

/* ============================= AB IMPORT & ZUORDNUNG ============================= */

const ADDR_GENERIC = new Set(["haus","häuser","block","etappe","neubau","umbau","sanierung","überbauung","uberbauung","mfh","efh","objekt","wohnung","wohnungen","baustelle","areal","parzelle","gebäude","gebaude","trakt","stockwerk","haupt"]);
const STREET_RE = /(strasse|str|weg|gasse|platz|rain|ring|allee|halde|matt|matte|hof|quai|promenade|steig|stich|graben|berg|acker|feld|wiese|park)$/;
function addrTokens(s){
  return String(s||"").toLowerCase().replace(/[,.\-\/()"'„“]/g," ").split(/\s+/)
    .filter(w => w.length>3 && !/^\d/.test(w) && !ADDR_GENERIC.has(w));
}
function houseNo(s, street){
  const m = String(s||"").toLowerCase().match(new RegExp(street.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "[\\s,]*(\\d{1,3}[a-z]?)\\b"));
  return m ? m[1] : null;
}
// 0 = anderes Objekt, 1 = unsicher, >=2 = gleiches Objekt
function deumlaut(t){ return String(t).replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ae/g,"a").replace(/oe/g,"o").replace(/ue/g,"u"); }
// genau ein abweichender Buchstabe, und zwar ein Vokal (typischer OCR-Fehler: ü -> i/u). "Kirch" vs "Birch" zaehlt NICHT.
function editDist1(a, b){
  if(a === b) return true;
  if(a.length !== b.length) return false;
  let diff = 0;
  for(let i=0;i<a.length;i++){
    if(a[i] === b[i]) continue;
    if(++diff > 1) return false;
    if(!/[aeiouy]/.test(a[i]) || !/[aeiouy]/.test(b[i])) return false;
  }
  return true;
}
function tokEq(x, y){
  if(x === y) return true;
  const a = deumlaut(x), b = deumlaut(y);
  if(a === b) return true;
  return a.length >= 7 && b.length >= 7 && editDist1(a, b);
}
function scoreAddress(a, b){
  const ta = addrTokens(a), tb = addrTokens(b);
  if(!ta.length || !tb.length) return 0;
  const overlap = ta.filter(t=>tb.some(u=>tokEq(t,u)));
  const sa = ta.find(t=>STREET_RE.test(t)), sb = tb.find(t=>STREET_RE.test(t));
  if(sa && sb){
    if(!tokEq(sa, sb)) return 0;                  // verschiedene Strassen = verschiedene Objekte
    const na = houseNo(a, sa), nb = houseNo(b, sb);
    if(na && nb && na !== nb) return 1;           // gleiche Strasse, andere Hausnummer -> unsicher
    return 2 + (overlap.length - 1) * 0.5 + (na && nb ? 0.5 : 0);
  }
  if(sa || sb) return overlap.length >= 2 ? 1 : 0; // nur eine Seite hat eine Strasse -> hoechstens unsicher
  return overlap.length >= 2 ? 2 : (overlap.length === 1 ? 1 : 0); // Projektnamen wie "Parco Lago"
}
function projectAddrScore(addr, p){
  return Math.max(scoreAddress(addr, p.address), scoreAddress(addr, p.name), ...((p.abs||[]).map(a=>scoreAddress(addr, a.baustelle))), 0);
}
function bestProjectForAddress(addr){
  let best = null, bestScore = 0;
  DB.projects.forEach(p=>{ const s = projectAddrScore(addr, p); if(s>bestScore){ best = p; bestScore = s; } });
  return { project: best, score: bestScore };
}

async function attachAB(projectId, ab){
  const p = DB.projects.find(x=>x.id===projectId);
  if(!p) throw new Error("Auftrag nicht gefunden.");
  const old = (p.abs||[]).find(a=>a.nr===ab.nr);
  if(old){ // manuelle Kategorie-Zuordnungen einer frueheren Version uebernehmen
    ab.positionen.forEach(np=>{
      const op = (old.positionen||[]).find(o=>o.pos===np.pos && o.artikel===np.artikel);
      if(op && op.categoryManual){ np.category = op.category; np.categoryManual = true; }
    });
  }
  p.abs = (p.abs||[]).filter(a=>a.nr!==ab.nr).concat([ab]);
  if(!p.address && ab.baustelle) p.address = ab.baustelle;
  if(!p.auftragsnummer && ab.anr) p.auftragsnummer = ab.anr;
  await saveProject(p);
}
async function detachAB(projectId, nr){
  const p = DB.projects.find(x=>x.id===projectId);
  if(!p) return;
  p.abs = (p.abs||[]).filter(a=>a.nr!==nr);
  await saveProject(p);
}
async function autoAssignAB(ab){
  const sameNr = DB.projects.find(p=>(p.abs||[]).some(a=>a.nr && a.nr===ab.nr));
  if(sameNr){ await attachAB(sameNr.id, ab); return { projectId: sameNr.id, how:"revision" }; }
  const { project, score } = bestProjectForAddress(ab.baustelle);
  if(project && score >= 1){ await attachAB(project.id, ab); return { projectId: project.id, how: score>=2 ? "auto" : "unsicher" }; }
  const id = await createProject({ name: stripHaus(ab.baustelle) || `AB ${ab.nr}`, address: stripHaus(ab.baustelle || ""), auftragsnummer: ab.anr || "", soll: {}, abs: [ab], haeuser: ab.haus ? [ab.haus] : [] });
  return { projectId: id, how:"neu" };
}
function abFromPages(pages, filename){
  const fullText = pages.map(p=>p.text).join("\n");
  const ab = parseABText(fullText);
  ab.filename = filename || "";
  ab.importedAt = new Date().toLocaleString("de-CH");
  ab.importedBy = currentUser ? currentUser.email : "";
  ab.rawText = fullText.slice(0, 60000);
  ab.parserVersion = AB_PARSER_VERSION;
  if(!ab.haus) ab.haus = hausFromText(String(filename||"").replace(/[_]+/g," "));
  return ab;
}

function abSummaryHtml(ab){
  const tmp = { abs:[ab] };

  const keys = Object.keys(s);

}

function pickABFile(onFile){
  const fi = document.createElement("input");

async function readABFile(file){
  toast(`„${file.name}“ wird gelesen…`);
  const pages = await extractPagesFromPDF(file);
  const fullText = pages.map(p=>p.text).join("\n");
  if(!isABText(fullText) && !confirm("Das Dokument sieht nicht wie eine PE-Auftragsbestätigung aus. Trotzdem versuchen?")) return null;
  const ab = abFromPages(pages, file.name);
  if(!ab.positionen.length){ alert("In diesem Dokument konnten keine AB-Positionen gelesen werden."); return null; }

}

/* ============================= HAEUSER (mehrere Haeuser pro Objekt) ============================= */

function normHaus(s){
  s = String(s||"").trim();
  if(!s) return "";
  const m = s.match(/^(haus|gebäude|gebaude|geb\.?|block|trakt|nr\.?)\s*([a-z0-9]{1,4})$/i);
  if(m){
    const k = m[1].toLowerCase();
    const kind = k.startsWith("nr") ? "Nr." : k.startsWith("geb") ? "Gebäude" : k[0].toUpperCase() + k.slice(1);
    return `${kind} ${m[2].toUpperCase()}`;
  }
  if(/^[a-z0-9]{1,3}$/i.test(s)) return "Haus " + s.toUpperCase();
  return s;
}
function hausFromText(s){
  const m = String(s||"").match(/\b(Haus|Gebäude|Geb\.|Block|Trakt)\s*([a-z]?[0-9]{1,3}[a-z]?|[a-z])\b/i);
  return m ? normHaus(m[1] + " " + m[2]) : "";
}
function stripHaus(s){
  const t = String(s||"").replace(/[,\s]*\b(Haus|Gebäude|Geb\.|Block|Trakt)(\s*([a-z]?[0-9]{1,3}[a-z]?|[a-z]))?(\s+(Süd|Nord|Ost|West|Mitte))?\s*$/i, "").replace(/[,\s]+$/,"").trim();
  return t || String(s||"").trim();
}
function hausSort(a, b){ return String(a).localeCompare(String(b), "de", { numeric:true }); }
function projectHouses(p){
  if(!p) return [];
  const set = new Set();
  (p.haeuser||[]).forEach(h=>{ if(h) set.add(h); });
  (p.abs||[]).forEach(a=>{ if(a.haus) set.add(a.haus); });
  DB.invoices.forEach(i=>{ if(i.projectId===p.id && i.haus) set.add(i.haus); });
  return Array.from(set).sort(hausSort);
}
// "Keine AB vorhanden" bestaetigt: pro Rechnung oder fuer das ganze Objekt
function invOhneAB(inv){
  if(!inv) return false;
  if(inv.ohneAB) return true;
  const p = DB.projects.find(x=>x.id===inv.projectId);
  return !!(p && p.ohneAB);
}
// Auftrags-/AB-Nummer auf der Rechnung (FUBS: "Auf-Nr. 202517989", "AUFTRAGSNR. 202417612")
function auftragsNrFromText(text){
  const m = String(text||"").match(/Auf(?:trags?)?\s*-?\s*n(?:r|ummer)\.?\s*[:.]?\s*([0-9]{6,12})/i);
  return m ? m[1] : "";
}
// Haus einer Rechnung bestimmen – in dieser Reihenfolge:
// 1) unsere AB-Nummer auf der Rechnung -> Haus dieser AB   2) "Objekt: … Haus W7"
// 3) ein bereits bekanntes Haus des Objekts kommt im Text vor (W7, S1, Haus 32 …)
// 4) "Haus X" irgendwo auf der Rechnung   5) Ausmassblatt: Bereichs-Titel ("W7", "Haus 32 Süd")
function detectInvoiceHaus(info, projectId){
  const text = String(info.rawText || "");
  const p = DB.projects.find(x=>x.id===projectId);
  const anr = String(info.auftragsnummer || auftragsNrFromText(text) || "").replace(/[^0-9A-Za-z]/g,"");
  if(p && anr){
    const ab = (p.abs||[]).find(a => a.haus && (a.nr === anr || String(a.anr||"").replace(/[^0-9A-Za-z]/g,"") === anr));
    if(ab) return ab.haus;
  }
  const fromObj = hausFromText(info.objekt);
  if(fromObj) return fromObj;
  if(p){
    for(const h of projectHouses(p)){
      const id = h.replace(/^(Haus|Gebäude|Block|Trakt|Nr\.)\s*/i, "");
      if(/[a-z]/i.test(id) && new RegExp("(^|[^A-Za-z0-9])" + id.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "([^A-Za-z0-9]|$)").test(text)) return h;
      if(new RegExp("\\bHaus\\s*" + id + "\\b", "i").test(text)) return h;
    }
  }
  const anyHaus = hausFromText(text.replace(/hauserstrasse|hausmatt\w*|hausen\b/gi, ""));
  if(anyHaus) return anyHaus;
  const lines = text.split("\n").map(l=>l.trim());
  const bi = lines.findIndex(l => /^bereich\b/i.test(l) || /l[aä]nge\s+breite/i.test(l));
  if(bi > -1){
    for(const l of lines.slice(bi+1, bi+5)){
      const m = l.match(/^(?:Haus\s+)?([A-Z]{1,2}\s?\d{1,3}[a-z]?)(?:\s+(?:Süd|Nord|Ost|West|Mitte))?$/);
      if(m) return normHaus("Haus " + m[1].replace(/\s/g,""));
    }
  }
  return "";
}
// Nach dem Hinterlegen von ABs: Haeuser zwischen Rechnungen und ABs gegenseitig ergaenzen
async function syncHousesWithABs(p){
  if(!p) return;
  let projChanged = false;
  const invs = DB.invoices.filter(i=>i.projectId===p.id);
  for(const ab of (p.abs||[])){
    if(ab.haus) continue;
    // AB ohne Haus: Rechnungen mit dieser AB-Nummer verraten das Haus
    const hs = Array.from(new Set(invs.filter(i => i.haus && String(i.auftragsnummer || auftragsNrFromText(i.rawText)).replace(/\D/g,"") === ab.nr).map(i=>i.haus)));
    if(hs.length === 1){ ab.haus = hs[0]; projChanged = true; }
  }
  if(projChanged){
    p.haeuser = Array.from(new Set([...(p.haeuser||[]), ...(p.abs||[]).map(a=>a.haus).filter(Boolean)]));
    await saveProject(p);
  }
  for(const inv of invs){
    if(inv.haus) continue;
    const h = detectInvoiceHaus(inv, p.id);
    if(h){ inv.haus = h; await window.fb.setDocMerge("invoices", inv.id, { haus: h }); }
  }
}
// AB(s) einem bestimmten Objekt hinzufuegen; fehlt das Haus, wird gefragt
async function addABsToProject(p0, files){
  const pid = p0.id;
  const cur = () => DB.projects.find(x=>x.id===pid) || p0;  // immer den aktuellen Stand verwenden
  let ok = 0; const bad = [];
  for(const file of files){
    const p = cur();
    try{
      const ab = await readABFile(file);
      if(!ab){ bad.push(file.name); continue; }
      if(ab.baustelle && projectAddrScore(ab.baustelle, p) < 1 && !confirm(`Die AB-Baustelle „${ab.baustelle}“ (${file.name}) passt nicht zu „${p.name}“. Trotzdem hier zuordnen?`)) { bad.push(file.name); continue; }
      const elsewhere = DB.projects.find(x=>x.id!==p.id && (x.abs||[]).some(a=>a.nr===ab.nr));
      if(elsewhere){ if(!confirm(`AB ${ab.nr} ist bereits bei „${elsewhere.name}“ hinterlegt. Hierher verschieben?`)){ bad.push(file.name); continue; } await detachAB(elsewhere.id, ab.nr); }
      const known = projectHouses(p);
      if(!ab.haus && (files.length > 1 || known.length || (p.abs||[]).length)){
        const v = prompt(`Für welches Haus gilt die AB ${ab.nr}${ab.los ? " (Los " + ab.los + ")" : ""}?\nBaustelle: ${ab.baustelle || "?"}\n${known.length ? "Bekannte Häuser: " + known.join(", ") + "\n" : ""}Leer lassen = gilt für das ganze Objekt.`, "");
        if(v && v.trim()) ab.haus = normHaus(v);
      }
      if(ab.haus){ const c = cur(); c.haeuser = Array.from(new Set([...(c.haeuser||[]), ab.haus])); }
      await attachAB(pid, ab);
      ok++;
    }catch(err){ console.error(err); bad.push(file.name); }
  }
  await syncHousesWithABs(cur());
  toast(`${ok} AB(s) bei „${cur().name}“ hinterlegt${bad.length ? ` · nicht übernommen: ${bad.join(", ")}` : ""}.`);
  return ok;
}

function houseNeedsAB(p, h){
  const abs = p.abs || [];
  return !abs.some(a=>a.haus===h) && !abs.some(a=>!a.haus);
}
function hausOptionsHtml(p, current){
  const hs = projectHouses(p);
  if(current && !hs.includes(current)) hs.push(current);
  return `<option value="">— kein Haus —</option>${hs.map(h=>`<option value="${escapeAttr(h)}" ${h===current?"selected":""}>${escapeHtml(h)}</option>`).join("")}<option value="__new">+ neues Haus…</option>`;
}
function askNewHaus(){
  const v = prompt("Bezeichnung des Hauses (z.B. 1, 2, A, B, Haus C, Nr. 12):");
  return v && v.trim() ? normHaus(v) : null;
}

/* ============================= AUFGABEN / MITTEILUNGEN ============================= */

function computeProjectTodos(){
  const t = [];
  DB.projects.forEach(p=>{
    const invs = DB.invoices.filter(i=>i.projectId===p.id);
    const abs = p.abs || [];
    const houses = projectHouses(p);
    // nur Rechnungen, die noch bearbeitet werden (nicht gedruckt, nicht "ohne AB" bestaetigt)
    const relevant = invs.filter(i=>!invOhneAB(i) && !i.gedrucktAm);
    if(p.ohneAB || !relevant.length){
      // "Keine AB vorhanden" bestaetigt -> keine Meldungen zu AB/Haeusern
    } else if(!abs.length){
      t.push({ kind:"ab", projectId:p.id, text:`AB fehlt – ${p.name}`, hint:"Ohne AB keine Mengen- und Leistungskontrolle.", share:`Bitte für das Objekt „${p.name}“ die Auftragsbestätigung (AB) im Tool hochladen.` });
    } else {
      houses.filter(h=>houseNeedsAB(p, h) && (!invs.some(i=>i.haus===h) || relevant.some(i=>i.haus===h))).forEach(h=>{
        t.push({ kind:"ab", projectId:p.id, text:`AB fehlt für ${h} – ${p.name}`, hint:"Für dieses Haus ist keine eigene AB hinterlegt.", share:`Bitte für „${p.name}“, ${h}, die Auftragsbestätigung (AB) im Tool hochladen.` });
      });
    }
    if(abs.filter(a=>!a.haus).length >= 2 && (houses.length || abs.some(a=>a.haus) || abs.filter(a=>!a.haus).length >= 2)){
      t.push({ kind:"ab", projectId:p.id, text:`${abs.filter(a=>!a.haus).length} ABs ohne Haus – ${p.name}`, hint:"Mehrere ABs gelten fürs ganze Objekt – dann werden die Mengen zusammengezählt. Bitte bei jeder AB „Gilt für“ das Haus wählen.", share:`Bitte bei „${p.name}“ jeder AB das richtige Haus zuordnen.` });
    }
    if(!p.ohneAB && (houses.length > 1 || abs.some(a=>a.haus))){
      const n = relevant.filter(i=>!i.haus).length;
      if(n) t.push({ kind:"haus", projectId:p.id, text:`${n} Rechnung(en) ohne Haus – ${p.name}`, hint:`Objekt hat ${houses.length} Häuser (${houses.join(", ")}). Jede Rechnung muss einem Haus zugeordnet sein.`, share:`Bitte bei „${p.name}“ die Rechnungen den richtigen Häusern zuordnen.` });
    }
  });
  // moegliche Doppel-Auftraege (gleiche Strasse)
  for(let i=0;i<DB.projects.length;i++){
    for(let j=i+1;j<DB.projects.length;j++){
      const a = DB.projects[i], b = DB.projects[j];
      if((a.notDup||[]).includes(b.id) || (b.notDup||[]).includes(a.id)) continue;
      const active = x => DB.invoices.some(i=>i.projectId===x.id && !i.gedrucktAm) || (x.abs||[]).length;
      if(!active(a) || !active(b)) continue; // leere Objekte nicht melden
      const s = Math.max(scoreAddress(a.address||a.name, b.address||b.name), scoreAddress(a.name, b.name));
      if(s >= 1) t.push({ kind:"dup", projectId:a.id, otherId:b.id, text:`Gleiches Objekt? „${a.name}“ und „${b.name}“`, hint:"Gleiche Strasse – falls es dasselbe Objekt ist (evtl. andere Häuser): zusammenführen, dann gilt eine AB für alle Subunternehmer.", share:`Bitte prüfen, ob „${a.name}“ und „${b.name}“ dasselbe Objekt sind, und ggf. zusammenführen.` });
    }
  }
  return t;
}
function invoiceTodo(inv){
  if(invoiceNeedsReview(inv)) return "Scan unvollständig / Positionen nicht zugeordnet";
  const st = inv.pruefung && inv.pruefung.status;
  if(st && st!=="offen") return null;
  const d = checkInvoice(inv).filter(x=>x.level==="danger").length;
  return d ? `${d} Fehler in der Prüfung` : null;
}
function computeInvoiceTodos(){
  return DB.invoices.map(inv=>({ inv, why: invoiceTodo(inv) })).filter(x=>x.why);
}
