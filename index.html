<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PE Rechnungskontrolle</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword,
    createUserWithEmailAndPassword, signOut, setPersistence, browserLocalPersistence
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc,
    onSnapshot, getDoc, getDocs, serverTimestamp, query, where
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBQe-d5khPWpymt7YrRzVNgQehJbUCqFFg",
    authDomain: "rechnungendatenbank.firebaseapp.com",
    projectId: "rechnungendatenbank",
    storageBucket: "rechnungendatenbank.firebasestorage.app",
    messagingSenderId: "542268178127",
    appId: "1:542268178127:web:f139163b5053c66cf581ba"
  };

  const fbApp = initializeApp(firebaseConfig);
  const auth = getAuth(fbApp);
  const dbFs = getFirestore(fbApp);
  setPersistence(auth, browserLocalPersistence).catch(e => console.warn("Persistence-Fehler:", e));

  // Bruecke zum bestehenden (nicht-modularen) App-Code: einfache, promise-basierte Helfer.
  window.fb = {
    onAuthChange: (cb) => onAuthStateChanged(auth, cb),
    login: (email, pw) => signInWithEmailAndPassword(auth, email, pw),
    signup: (email, pw) => createUserWithEmailAndPassword(auth, email, pw),
    logout: () => signOut(auth),
    serverTimestamp: () => serverTimestamp(),

    getUserDoc: async (uid) => {
      const snap = await getDoc(doc(dbFs, "users", uid));
      return snap.exists() ? snap.data() : null;
    },
    watchUserDoc: (uid, cb, onErr) => onSnapshot(doc(dbFs, "users", uid), cb, onErr),
    watchCollection: (name, cb, onErr) => onSnapshot(collection(dbFs, name), cb, onErr),
    watchQuery: (name, field, value, cb, onErr) => onSnapshot(query(collection(dbFs, name), where(field, "==", value)), cb, onErr),
    queryDocs: (name, field, value) => getDocs(query(collection(dbFs, name), where(field, "==", value))),

    setDoc: (col, id, data) => setDoc(doc(dbFs, col, id), data),
    setDocMerge: (col, id, data) => setDoc(doc(dbFs, col, id), data, { merge: true }),
    updateDoc: (col, id, data) => updateDoc(doc(dbFs, col, id), data),
    deleteDoc: (col, id) => deleteDoc(doc(dbFs, col, id)),
    addDoc: async (col, data) => {
      const ref = await addDoc(collection(dbFs, col), data);
      return ref.id;
    },
  };
  window.dispatchEvent(new CustomEvent("fb-ready"));
</script>
<style>
  :root{
    --bg:#ffffff;
    --surface:#f6f7f9;
    --surface-2:#eef0f3;
    --border:#dfe3e8;
    --text:#181b20;
    --text-dim:#6b7280;
    --accent:#1e3a5f;
    --accent-light:#eaf0f7;
    --ok:#1e824c;
    --ok-bg:#e9f6ef;
    --warn:#b3471a;
    --warn-bg:#fdece3;
    --danger:#b3261e;
    --danger-bg:#fbeceb;
    --radius:8px;
    --shadow:0 1px 2px rgba(20,20,30,0.06), 0 1px 1px rgba(20,20,30,0.04);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--accent);color:#fff;
    display:flex;flex-direction:column;padding:20px 0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .navsec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;padding:14px 20px 4px 20px;font-weight:600;}
  .navbtn .step{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.18);font-size:11px;font-weight:700;flex:0 0 20px;}
  .navbtn.active .step{background:#fff;color:var(--accent);}
  .sidebar .brand{
    padding:0 20px 20px 20px;font-weight:700;font-size:15px;letter-spacing:0.02em;
    border-bottom:1px solid rgba(255,255,255,0.15);margin-bottom:12px;
  }
  .sidebar .brand small{display:block;font-weight:400;opacity:0.65;font-size:11px;margin-top:2px;}
  .navbtn{
    background:none;border:none;color:rgba(255,255,255,0.75);text-align:left;
    padding:11px 20px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:10px;
    border-left:3px solid transparent;transition:background .12s;
  }
  .navbtn:hover{background:rgba(255,255,255,0.08);}
  .navbtn.active{background:rgba(255,255,255,0.12);color:#fff;border-left-color:#fff;font-weight:600;}
  .navbtn .badge{margin-left:auto;background:rgba(255,255,255,0.18);border-radius:10px;padding:1px 7px;font-size:11px;}
  .main{flex:1;min-width:0;padding:24px 32px 40px 32px;max-width:1700px;}
  h1{font-size:20px;margin:0 0 4px 0;letter-spacing:-0.01em;}
  h2{font-size:16px;margin:0 0 14px 0;}
  .subtitle{color:var(--text-dim);font-size:13px;margin:0 0 24px 0;}
  .card{
    background:#fff;border:1px solid var(--border);border-radius:var(--radius);
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .drop{
    border:2px dashed var(--border);border-radius:var(--radius);padding:36px 20px;
    text-align:center;color:var(--text-dim);cursor:pointer;transition:.15s;background:var(--surface);
  }
  .drop.hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent);}
  .drop b{color:var(--text);}
  input[type=file]{display:none;}
  button{
    font-family:inherit;font-size:13px;cursor:pointer;border-radius:6px;border:1px solid var(--border);
    background:#fff;padding:8px 14px;color:var(--text);font-weight:500;transition:.12s;
  }
  button:hover{background:var(--surface);}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:hover{background:#16304d;}
  button.danger{color:var(--danger);}
  button.small{padding:4px 9px;font-size:12px;}
  button:disabled{opacity:0.45;cursor:not-allowed;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;
    background:#fff;color:var(--text);width:100%;
  }
  label.field{display:block;margin-bottom:12px;}
  label.field span{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);
    padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600;
  }
  td{padding:9px 10px;border-bottom:1px solid var(--surface-2);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface);}
  .row{display:flex;gap:14px;}
  .row > *{flex:1;min-width:0;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);}
  .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .pill.danger{background:var(--danger-bg);color:var(--danger);}
  .pill.neutral{background:var(--surface-2);color:var(--text-dim);}
  .empty{
    text-align:center;padding:50px 20px;color:var(--text-dim);
  }
  .proj-list-item{
    display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:10px;cursor:pointer;background:#fff;transition:.12s;
  }
  .proj-list-item:hover{border-color:var(--accent);box-shadow:var(--shadow);}
  .proj-list-item .pname{font-weight:600;font-size:14px;}
  .proj-list-item .paddr{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
  .proj-list-item .pmeta{margin-left:auto;text-align:right;}
  .barwrap{background:var(--surface-2);border-radius:5px;height:7px;overflow:hidden;margin-top:5px;}
  .bar{height:100%;border-radius:5px;background:var(--accent);transition:width .2s;}
  .bar.over{background:var(--danger);}
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .catbox{border:1px solid var(--border);border-radius:8px;padding:13px 14px;background:var(--surface);}
  .catbox .ck{font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;}
  .catbox .cv{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .backlink{background:none;border:none;color:var(--accent);font-weight:600;padding:0;margin-bottom:14px;font-size:13px;cursor:pointer;}
  .backlink:hover{text-decoration:underline;background:none;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--text);color:#fff;padding:11px 18px;
    border-radius:8px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,0.2);z-index:999;
    animation:fadein .15s ease-out;
  }
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .itemrow select{min-width:150px;}
  .flag{color:var(--danger);font-weight:700;}
  .muted{color:var(--text-dim);}
  .tag{font-size:11px;background:var(--surface-2);border-radius:4px;padding:2px 6px;color:var(--text-dim);}
  textarea.raw{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;height:160px;color:var(--text-dim);}
  .section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);margin:20px 0 10px 0;}
  .close-x{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
  .close-x:hover{color:var(--danger);background:none;}
  tr.needs-review td{background:var(--warn-bg);}
  .srcbadge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:4px;}
  .srcbadge.ocr{background:#fdf2e3;color:#8a5a12;}
  .srcbadge.text{background:#e6f2ea;color:#1e824c;}
  .progresswrap{background:var(--surface-2);border-radius:5px;height:6px;overflow:hidden;margin-top:8px;}
  .progressbar{height:100%;background:var(--accent);transition:width .15s;}
  .tablewrap{overflow-x:auto;max-width:100%;}
  table.itemtable td, table.ctltable td{padding:6px 6px;}
  table.itemtable input, table.itemtable select{padding:5px 6px;font-size:12.5px;}
  table.ctltable th, table.ctltable td{white-space:nowrap;}
  table.ctltable td:first-child{white-space:normal;min-width:150px;}
  tr.overrow td{background:var(--danger-bg);}
  tr.sumrow td{border-top:2px solid var(--border);background:var(--surface);}
  tr.dimrow td{opacity:.6;}
  tr.noprice td{background:#fffaf0;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
  .kpi .kl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);font-weight:600;}
  .kpi .kv{font-size:18px;font-weight:700;margin-top:4px;}
  .abbox{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-top:12px;background:#fff;}
  .abhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  ul.abl{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55;}
  .pruefbox{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;}
  .pruefhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  ul.findings{list-style:none;margin:0;padding:0;}
  .fd{display:flex;gap:8px;padding:6px 8px;border-radius:6px;font-size:13px;line-height:1.4;margin-bottom:4px;}
  .fd .fdi{font-weight:700;flex:0 0 14px;text-align:center;}
  .fd.danger{background:var(--danger-bg);color:var(--danger);}
  .fd.warn{background:var(--warn-bg);color:var(--warn);}
  .fd.info{background:var(--accent-light);color:var(--accent);}
  .fd.ok{color:var(--ok);}
  details.okdetails summary{cursor:pointer;font-size:12.5px;color:var(--ok);margin-top:6px;}
  button.st-ok{background:var(--ok);border-color:var(--ok);color:#fff;}
  button.st-bad{background:var(--danger);border-color:var(--danger);color:#fff;}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:22px;}
  .stepcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:.12s;position:relative;}
  .stepcard:hover{border-color:var(--accent);transform:translateY(-1px);}
  .stepcard .sn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;}
  .stepcard .big{font-size:30px;font-weight:700;line-height:1;}
  .stepcard .lbl{font-weight:700;font-size:15px;}
  .stepcard .desc{color:var(--text-dim);font-size:12.5px;line-height:1.45;}
  .stepcard.attn{border-color:#f3c7c4;background:#fffaf9;}
  .stepcard.attn .big{color:var(--danger);}
  .stepcard .go{margin-top:auto;font-weight:600;color:var(--accent);font-size:13px;}
  .phead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:6px 0 4px 0;}
  .phead h1{font-size:22px;}
  .ptabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 18px 0;flex-wrap:wrap;}
  .ptabs .tab{font-size:14px;padding:10px 16px;}
  .ptabs .tab .tdot{display:inline-block;margin:0 0 0 6px;}
  details.help{font-size:12.5px;color:var(--text-dim);margin:8px 0 0 0;}
  details.help summary{cursor:pointer;color:var(--accent);font-weight:600;}
  .audit{font-size:12px;color:var(--text-dim);margin-top:12px;padding:8px 10px;background:var(--surface);border-radius:6px;line-height:1.5;}
  .audit details summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:4px;}
  .audit ul{margin:6px 0 0 0;padding-left:18px;}
  .pill.warnok{background:#fff3dc;color:#9a5b00;border:1px solid #f5d79a;}
  tr.overok td{background:#fff8e8;}
  .nbadge{margin-left:auto;display:none;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#e5302a;color:#fff;font-size:11.5px;font-weight:700;line-height:1;box-shadow:0 0 0 2px rgba(255,255,255,.15);}
  .tab .nbadge{margin-left:6px;}
  .tdot{width:10px;height:10px;border-radius:50%;background:#e5302a;flex:0 0 10px;margin-top:4px;}
  .todolist{display:flex;flex-direction:column;gap:8px;}
  .todo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid #f3c7c4;background:#fff7f6;border-radius:8px;font-size:13px;}
  .todobanner{border:1px solid #f3c7c4;background:#fff7f6;border-radius:var(--radius);padding:14px 16px;margin-bottom:18px;}
  .todobanner h2{display:flex;align-items:center;gap:8px;color:var(--danger);}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap;}
  .tab{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;font-weight:600;color:var(--text-dim);display:inline-flex;align-items:center;}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab:hover{background:var(--surface);}
  .msg{border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:10px;background:#fff;}
  .msg.unread{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
  .msg.done{opacity:.6;}
  .msghead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .msgtext{margin:6px 0;white-space:pre-wrap;font-size:13.5px;}
  .msglink{background:var(--accent-light);border-color:var(--accent-light);color:var(--accent);font-weight:600;text-align:left;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal{background:#fff;border-radius:10px;padding:22px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  .sharelink{background:var(--surface);border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:14px;}
  a.btnlink{display:inline-block;padding:8px 14px;border-radius:6px;border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13px;font-weight:500;}
  a.btnlink.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .hchip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;margin:2px 4px 0 0;}
  .hchip.ok{background:var(--ok-bg);color:var(--ok);}
  .hchip.bad{background:var(--danger-bg);color:var(--danger);}
  .projdot{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#e5302a;color:#fff;font-size:11px;font-weight:700;padding:0 6px;margin-right:6px;vertical-align:middle;}
  table select.hsel{padding:4px 6px;font-size:12px;min-width:100px;}
  #printRoot{position:fixed;inset:0;background:#e9ebef;z-index:2000;overflow:auto;}
  .ptoolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--border);padding:10px 18px;}
  #ppPages{padding:20px 0 60px 0;margin-left:290px;}
  .pindex{position:fixed;top:58px;left:0;bottom:0;width:270px;overflow:auto;background:#fff;border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:4px;z-index:1;}
  .pindex a{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;font-size:12.5px;line-height:1.3;}
  .pindex a:hover{background:var(--surface);}
  .pindex .ptxt{flex:1;}
  .pnum{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:0 5px;}
  .pst{font-weight:700;}
  .pst.ok{color:var(--ok);} .pst.bad{color:var(--danger);}
  .pinvhead{width:min(820px,94vw);margin:8px auto 10px auto;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;scroll-margin-top:70px;}
  .ploading{display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  @media (max-width:1100px){ #ppPages{margin-left:0;} .pindex{display:none;} }
  .ppage{position:relative;width:min(820px,94vw);aspect-ratio:210/297;margin:0 auto 22px auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);overflow:hidden;}
  .ppage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .pstamp{position:absolute;cursor:grab;touch-action:none;outline:1px dashed rgba(30,90,200,.55);outline-offset:4px;}
  .pstamp:active{cursor:grabbing;}
  @media print{
    @page{size:A4;margin:0;}
    body.printing > *:not(#printRoot){display:none !important;}
    body.printing #printRoot{position:static;background:#fff;overflow:visible;}
    body.printing .noprint{display:none !important;}
    body.printing #ppPages{padding:0;margin:0;}
    body.printing .ppage{width:210mm;height:297mm;aspect-ratio:auto;margin:0;box-shadow:none;page-break-after:always;break-after:page;}
    body.printing .ppage:last-child{page-break-after:auto;break-after:auto;}
    body.printing .pstamp{outline:none;}
  }
  @media (max-width:800px){ .app{flex-direction:column;} .sidebar{width:100%;height:auto;position:static;} .main{padding:18px;} .row{flex-wrap:wrap;} }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">PE Rechnungskontrolle<small>Subunternehmer-Abgleich</small></div>
    <button class="navbtn active" data-view="home">🏠 Übersicht</button>
    <div class="navsec">Arbeitsablauf</div>
    <button class="navbtn" data-view="upload"><span class="step">1</span> Hochladen</button>
    <button class="navbtn" data-view="check"><span class="step">2</span> Prüfen <span class="nbadge" id="checkBadge"></span></button>

function uid(prefix){ return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function isAdmin(){ return !!(currentProfile && currentProfile.role === "admin"); }
function hasPerm(key){ return isAdmin() || !!(currentProfile && currentProfile.permissions && currentProfile.permissions[key]); }
function isApproved(){ return isAdmin() || !!(currentProfile && currentProfile.approved === true && currentUser && String(currentUser.email||"").toLowerCase().endsWith("@pe-fabrikation.ch")); }

function toDateSafe(v){
  if(!v) return null;
  if(v instanceof Date) return v;
  if(typeof v.toDate === "function") return v.toDate();
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function canDeleteInvoice(inv){
  if(!currentUser) return false;
  if(isAdmin() || hasPerm("deleteAnyRechnung")) return true;
  if(inv.createdBy !== currentUser.uid) return false;
  const created = toDateSafe(inv.createdAt);
  if(!created) return false;
  return (Date.now() - created.getTime()) < 5 * 60 * 60 * 1000;
}

function showDbError(context, err){
  console.error(context, err);
  const banner = document.createElement("div");
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:var(--danger);color:#fff;padding:10px 20px;font-size:13px;z-index:9999;text-align:center;";
  banner.textContent = `⚠ Datenbankfehler (${context}): ${err.code || err.message || err}. Meist bedeutet das: die Firestore-Regeln wurden noch nicht veröffentlicht, oder du bist nicht als Nutzer in "users/{uid}" eingetragen.`;
  document.body.prepend(banner);
}

    rememberShadow("subunternehmer", snap);

  if(unsubMsgOut) unsubMsgOut();

    DB.msgsIn = snap.docs.map(d=>({ id: d.id, ...d.data() }));

    if(seenMsgIds){
      DB.msgsIn.filter(m=>!m.read && !seenMsgIds.has(m.id)).forEach(m=>{
        toast(`💬 Neue Nachricht von ${nameFromEmail(m.fromEmail)}`);
        if(typeof Notification!=="undefined" && Notification.permission==="granted"){
          try{ new Notification("💬 " + nameFromEmail(m.fromEmail), { body: (m.text||"") + (m.link ? "\n" + m.link.label : ""), tag: m.id }); }catch(e){}
        }

async function deleteProjectDoc(id){ await window.fb.deleteDoc("projects", id); }
async function deleteInvoiceDoc(id){
  const inv = DB.invoices.find(i=>i.id===id);
  await window.fb.deleteDoc("invoices", id);
  if(inv && (inv.bildSeiten||0) > 0) deleteInvoiceImages(id);
  if(inv && inv.pdfId) releasePdfIfUnused(inv.pdfId, id);
  DB.invoices = DB.invoices.filter(i=>i.id!==id);
  if(inv) await removeProjectIfEmpty(inv.projectId);
}
// Objekt ohne Rechnungen und ohne AB ist nutzlos (z.B. durch falsch gelesene Rechnung entstanden) -> weg damit
async function removeProjectIfEmpty(projectId){
  const p = DB.projects.find(x=>x.id===projectId);
  if(!p || (p.abs||[]).length) return;
  if(DB.invoices.some(i=>i.projectId===projectId)) return;
  try{ await deleteProjectDoc(projectId); DB.projects = DB.projects.filter(x=>x.id!==projectId); }
  catch(e){ /* keine Berechtigung -> Objekt bleibt, erzeugt aber keine Meldungen mehr */ }
}
let emptyCleanupDone = false;
async function cleanupEmptyProjects(){
  if(emptyCleanupDone || !dataLoaded.projects || !dataLoaded.invoices) return;
  emptyCleanupDone = true;
  if(!hasPerm("deleteAuftraege")) return;
  const now = Date.now();
  for(const p of DB.projects.slice()){
    const created = toDateSafe(p.createdAt);
    if(created && now - created.getTime() < 10*60*1000) continue; // gerade erst angelegt (Upload laeuft evtl. noch)
    await removeProjectIfEmpty(p.id);
  }
}

      </form>
    </div>
  `;
  document.getElementById("authToggle").addEventListener("click", ()=> renderAuthScreen(isSignup ? "login" : "signup"));
  document.getElementById("authForm").addEventListener("submit", async (evt)=>{
    evt.preventDefault();
    const email = document.getElementById("authEmail").value.trim();
    const pw = document.getElementById("authPw").value;
    const errEl = document.getElementById("authError");
    errEl.textContent = "";
    if(!email || !pw){ errEl.textContent = "Bitte E-Mail und Passwort eingeben."; return; }
    if(isSignup && !email.toLowerCase().endsWith("@pe-fabrikation.ch")){ errEl.textContent = "Registrierung nur mit der Geschäftsadresse @pe-fabrikation.ch möglich."; return; }
    try{
      if(isSignup){
        const cred = await window.fb.signup(email, pw);

          email, role: "mitarbeiter", approved: false, permissions: { ...DEFAULT_PERMISSIONS }, createdAt: window.fb.serverTimestamp(),
        });

function translateAuthError(e){
  const c = e.code || "";
  if(c.includes("wrong-password") || c.includes("invalid-credential")) return "E-Mail oder Passwort falsch.";
  if(c.includes("user-not-found")) return "Kein Konto mit dieser E-Mail gefunden.";
  if(c.includes("email-already-in-use")) return "Diese E-Mail ist bereits registriert.";
  if(c.includes("weak-password")) return "Passwort zu kurz (mind. 6 Zeichen).";
  if(c.includes("invalid-email")) return "Ungültige E-Mail-Adresse.";
  return "Fehler: " + (e.message || c);
}

/* ============================= AENDERUNGSVERLAUF (wer hat wann was geaendert) ============================= */
const AUDIT_COLS = new Set(["invoices", "projects", "subunternehmer", "einstellungen"]);
const AUDIT_IGNORE = new Set(["geaendertVon","geaendertAm","geaendertName","verlauf","updatedAt","updatedBy","createdAt","createdBy","createdByEmail","rawText","id"]);
const FIELD_LABELS = {
  lieferant:"Lieferant", rechnungsnr:"Rechnungsnr.", datum:"Datum", total:"Betrag", objekt:"Objekt", haus:"Haus", items:"Positionen",
  projectId:"Auftrag", pruefung:"Prüfung/Freigabe", ohneAB:"„Keine AB“", ohneABvon:"„Keine AB“", bezahltAm:"Bezahlt am", eingangsdatum:"Stempeldatum",
  stempelPos:"Stempelposition", gedrucktAm:"Gedruckt", gedrucktVon:"Gedruckt", pdfId:"Original-PDF", pdfPages:"Original-PDF", duplikatVersuche:"Doppelrechnung",
  auftragsnummer:"Auftragsnr.", filename:"Datei", bildSeiten:"Original",
  name:"Name", address:"Adresse", abs:"AB", soll:"Soll-Mengen", haeuser:"Häuser", notDup:"Duplikat-Markierung",
  tarife:"Preise", aliases:"Aliase", kontakt:"Kontakt", email:"E-Mail", notizen:"Notizen", rnrMuster:"Rechnungsnr.-Erkennung",
  tolPreisProzent:"Toleranz", tolPreisCHF:"Toleranz", mengenTolProzent:"Toleranz", ausreisserFaktor:"Ausreisser", ausreisserMinCHF:"Ausreisser",
};
const shadows = { invoices:{}, projects:{}, subunternehmer:{}, einstellungen:{} };
function rememberShadow(col, snap){
  const m = {};
  snap.docs.forEach(d => { try{ m[d.id] = JSON.parse(JSON.stringify(d.data())); }catch(e){ m[d.id] = {}; } });
  shadows[col] = m;
}
function auditStamp(){
  return new Date().toLocaleString("de-CH", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
}
function auditData(col, id, data, fullWrite){
  if(!AUDIT_COLS.has(col) || !currentUser || !data || typeof data !== "object") return data;
  const prev = (shadows[col] || {})[id] || {};
  const norm = v => JSON.stringify(v === undefined ? null : v);
  const changed = Object.keys(data).filter(k => !AUDIT_IGNORE.has(k) && norm(data[k]) !== norm(prev[k]));
  if(!changed.length){
    if(!fullWrite) return data;
    return { ...data, verlauf: prev.verlauf || [], geaendertVon: prev.geaendertVon || "", geaendertName: prev.geaendertName || "", geaendertAm: prev.geaendertAm || "" };
  }
  const am = auditStamp();
  const was = Array.from(new Set(changed.map(k => FIELD_LABELS[k] || k))).slice(0, 8).join(", ");
  const entry = { am, von: currentUser.email, name: nameFromEmail(currentUser.email), was };
  let verlauf = (prev.verlauf || []).slice();
  const last = verlauf[verlauf.length - 1];
  // mehrere Aenderungen derselben Person in der gleichen Minute zusammenfassen
  if(last && last.von === entry.von && last.am === entry.am) verlauf[verlauf.length - 1] = { ...last, was: Array.from(new Set((last.was + ", " + was).split(", "))).join(", ") };
  else verlauf.push(entry);
  verlauf = verlauf.slice(-40);
  const out = { ...data, geaendertVon: currentUser.email, geaendertName: entry.name, geaendertAm: am, verlauf };
  shadows[col][id] = { ...prev, ...data, verlauf, geaendertVon: out.geaendertVon, geaendertAm: am };
  return out;
}
let auditInstalled = false;
function installAuditTrail(){
  if(auditInstalled || !window.fb) return;
  auditInstalled = true;
  const fb = window.fb;
  const oSet = fb.setDoc, oMerge = fb.setDocMerge, oUpd = fb.updateDoc, oAdd = fb.addDoc;
  fb.setDoc = (col, id, data) => oSet(col, id, auditData(col, id, data, true));
  fb.setDocMerge = (col, id, data) => oMerge(col, id, auditData(col, id, data, false));
  fb.updateDoc = (col, id, data) => oUpd(col, id, auditData(col, id, data, false));
  fb.addDoc = (col, data) => {
    if(AUDIT_COLS.has(col) && currentUser && data && typeof data === "object"){
      const am = auditStamp();
      data = { ...data, geaendertVon: currentUser.email, geaendertName: nameFromEmail(currentUser.email), geaendertAm: am,
               verlauf: [{ am, von: currentUser.email, name: nameFromEmail(currentUser.email), was: "erstellt" }] };
    }
    return oAdd(col, data);
  };
}
// Anzeige: "Zuletzt geändert von … am … um … Uhr" + aufklappbarer Verlauf
function auditHtml(obj, label){
  if(!obj) return "";
  const v = (obj.verlauf || []).slice().reverse();
  const fmtAm = am => String(am||"").replace(/,\s*(\d{1,2}:\d{2})$/, " um $1 Uhr");
  const who = e => `${escapeHtml(e.name || nameFromEmail(e.von))} <span class="muted">(${escapeHtml(e.von||"")})</span>`;
  const created = obj.createdByEmail ? `Erfasst von ${escapeHtml(nameFromEmail(obj.createdByEmail))} <span class="muted">(${escapeHtml(obj.createdByEmail)})</span>${toDateSafe(obj.createdAt) ? ` am ${toDateSafe(obj.createdAt).toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"numeric"})} um ${toDateSafe(obj.createdAt).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})} Uhr` : ""}` : "";
  if(!v.length && !created) return `<div class="audit muted">Noch keine Änderungen protokolliert.</div>`;
  return `<div class="audit">
    ${v.length ? `🕓 ${label||"Zuletzt geändert"}: ${who(v[0])} am ${escapeHtml(fmtAm(v[0].am))} – <i>${escapeHtml(v[0].was||"")}</i>` : ""}
    ${created ? `<div>${created}</div>` : ""}
    ${v.length > 1 ? `<details><summary>Ganzer Verlauf (${v.length})</summary><ul>${v.map(e=>`<li><b>${escapeHtml(fmtAm(e.am))}</b> – ${who(e)}: ${escapeHtml(e.was||"")}</li>`).join("")}</ul></details>` : ""}
  </div>`;
}

function initAuth(){
  installAuditTrail();
  window.fb.onAuthChange((user)=>{
    if(!user){
      currentUser = null; currentProfile = null;
      stopDataListeners();
      renderAuthScreen("login");
      return;
    }
    currentUser = { uid: user.uid, email: user.email };
    const authRoot = document.getElementById("authRoot");
    if(authRoot) authRoot.remove();

    if(unsubProfile) unsubProfile();
    unsubProfile = window.fb.watchUserDoc(user.uid, (snap)=>{
      currentProfile = snap.exists() ? snap.data() : null;
      if(!snap.exists()) console.warn("Kein users/"+user.uid+"-Dokument gefunden.");

      if(!isApproved()){
        document.querySelector(".app").style.display = "none";
        stopDataListeners();
        renderPendingScreen();
        return;
      }

      document.querySelector(".app").style.display = "";
      const pendingRoot = document.getElementById("pendingRoot");
      if(pendingRoot) pendingRoot.remove();
      updateSidebarForUser();
      if(!unsubUsers){
        unsubUsers = window.fb.watchCollection("users", (usnap)=>{
          allUsers = usnap.docs.map(d=>({ id: d.id, ...d.data() }));
          updateBadges();
          updateSidebarForUser();
          if(currentView==="admin") render();
        }, (err)=> showDbError("users (Firestore-Regeln aktualisieren)", err));
      }
      startDataListeners();
      render();
    }, (err)=> showDbError("users/"+user.uid, err));
  });
}

/* ============================= PDF -> TEXT (hybrid: Text-Layer oder OCR) ============================= */

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const OCR_SCALE = 2.8; // ~200 dpi: genauso zuverlaessig fuer Rechnungen, aber ca. 2x schneller als 288 dpi
let ocrWorkerPromise = null;
// Anzahl typischer OCR-Fehler in Zahlen (Buchstaben mitten in Zahlen, "6',53L.20", "0.2s", "2O24")
function ocrGarbageScore(text){
  let score = 0;
  for(let t of String(text||"").split(/\s+/)){
    t = t.replace(/^[(*"„]+|[)*"“%:;]+$/g, "");
    const digits = (t.match(/\d/g)||[]).length;
    if(digits < 2) continue;
    if(/\d['’`][,.]\d/.test(t) || /\d[,.]{2}\d/.test(t)){ score++; continue; }        // 6',531.20 · 1,.52 · 1..70
    // Zahl, in der Buchstaben/Zeichen stecken, die OCR mit Ziffern verwechselt (L/l/I/!→1, O/o→0, S/s→5, g→9)
    if(/^[\d'’.,!|LlIOoSsg-]+$/.test(t) && /[LlIOoSsg!|]/.test(t)) score++;          // 0.2s · L'662.90 · 2025L9240 · 07.!0.2026
  }
  return score;
}
// Mehrere OCR-"Arbeiter" parallel (je nach Prozessor 2-3) -> mehrere Seiten/Rechnungen gleichzeitig
let ocrSchedulerPromise = null;
function getOcrScheduler(){
  if(!ocrSchedulerPromise){
    ocrSchedulerPromise = (async ()=>{
      const n = Math.max(1, Math.min(3, ((typeof navigator!=="undefined" && navigator.hardwareConcurrency) || 4) - 1));
      const sch = Tesseract.createScheduler();
      const workers = await Promise.all(Array.from({ length: n }, ()=> Tesseract.createWorker("deu", 1, { logger: () => {} })));
      workers.forEach(w => sch.addWorker(w));
      return sch;
    })();
  }
  return ocrSchedulerPromise;
}
async function renderPageCanvas(page, scale, crop){
  const vp = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = Math.ceil(vp.width); canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  if(!crop) return canvas;
  const y0 = Math.floor(canvas.height * crop[0]), h = Math.ceil(canvas.height * (crop[1] - crop[0]));
  const c2 = document.createElement("canvas");
  c2.width = canvas.width; c2.height = h;
  c2.getContext("2d").drawImage(canvas, 0, y0, canvas.width, h, 0, 0, canvas.width, h);
  return c2;
}
async function ocrCanvasLines(canvas){
  const sch = await getOcrScheduler();
  const { data } = await sch.addJob("recognize", canvas, {}, { tsv: true });
  const tol = 3.6 * OCR_SCALE;
  const tsvWords = data.tsv ? parseTsvWords(data.tsv) : [];
  if(tsvWords.length) return reconstructLines(tsvWords, tol);
  if(data.words && data.words.length) return reconstructLines(data.words.map(w => ({ str: w.text, x: w.bbox.x0, y: (w.bbox.y0 + w.bbox.y1)/2, width: w.bbox.x1 - w.bbox.x0 })), tol);
  return (data.text || "").split("\n").map(l=>l.trim()).filter(Boolean);
}
// Gescannte Seite? (ganzseitiges Bild, z.B. 2480x3508 = A4 mit 300 dpi)
async function isScannedPage(page){
  try{
    const ops = await page.getOperatorList();
    const IMG = new Set([pdfjsLib.OPS.paintImageXObject, pdfjsLib.OPS.paintJpegXObject, pdfjsLib.OPS.paintInlineImageXObject].filter(x=>x!==undefined));
    return ops.fnArray.some((fn, k) => IMG.has(fn) && (+((ops.argsArray[k]||[])[1])||0) >= 1200 && (+((ops.argsArray[k]||[])[2])||0) >= 1200);
  }catch(e){ return false; }
}
function getOcrWorker(){
  if(!ocrWorkerPromise){
    ocrWorkerPromise = Tesseract.createWorker("deu", 1, { logger: () => {} });
  }
  return ocrWorkerPromise;
}

// Reihen aus Wortpositionen rekonstruieren (funktioniert fuer PDF-Textlayer UND OCR-Woerter gleichermassen)
// points: [{str, x, y, width}]  y aufsteigend = von oben nach unten
function reconstructLines(points, tol){
  const pts = points.filter(p => p.str && p.str.trim().length > 0);
  pts.sort((a,b) => a.y - b.y || a.x - b.x);
  const rows = [];
  pts.forEach(p => {
    let row = rows.find(l => Math.abs(l.y - p.y) < tol);
    if(!row){ row = { y: p.y, items: [] }; rows.push(row); }
    row.items.push(p);
  });
  rows.sort((a,b) => a.y - b.y);

  const lines = rows.map(row => {
    row.items.sort((a,b) => a.x - b.x);
    return row.items.map(i=>i.str).join(" ").replace(/\s+/g," ").trim();
  });
  return lines.filter(l => l.length > 0);
}

function parseTsvWords(tsv){
  // Tesseract-TSV: level 5 = einzelnes Wort. Spalten: level,page,block,par,line,word,left,top,width,height,conf,text
  const out = [];
  const rows = tsv.split("\n");
  for(let i=1;i<rows.length;i++){
    const cols = rows[i].split("\t");
    if(cols.length < 12) continue;
    if(cols[0] !== "5") continue;
    const left = parseFloat(cols[6]), top = parseFloat(cols[7]), width = parseFloat(cols[8]), height = parseFloat(cols[9]);
    const text = cols[11];
    if(!text || !text.trim()) continue;
    out.push({ str: text, x: left, y: top + height/2, width });
  }
  return out;
}

async function extractPagesFromPDF(file, onProgress){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const pages = [];
  const jobs = [];
  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const totalChars = content.items.reduce((s,it) => s + (it.str||"").length, 0);
    let textLines = null;
    if(totalChars > 15){
      const pts = content.items.map(it => ({ str: it.str, x: it.transform[4], y: -it.transform[5], width: it.width || 0 }));
      textLines = reconstructLines(pts, 3);
    }
    const entry = { pageNum: i, text: textLines ? textLines.join("\n") : "", source: "text" };
    pages.push(entry);

    if(!textLines){
      // reiner Scan ohne Textebene -> ganze Seite lesen
      jobs.push(async ()=>{ entry.text = (await ocrCanvasLines(await renderPageCanvas(page, OCR_SCALE))).join("\n"); entry.source = "ocr"; });
      continue;
    }
    // Scan mit Scanner-Textebene (oft fehlerhaft: 6 statt 5, "L'797.60") oder sichtbar verstuemmelter Text
    const scanned = await isScannedPage(page);
    const garbage = ocrGarbageScore(entry.text);
    if(!scanned && garbage < 3){ if(onProgress) onProgress(i, pdf.numPages, "text"); continue; }
    const kind = classifyPage(entry.text);
    if(kind === "invoice_start" || i === 1){
      // Rechnungsseite (Nummer, Datum, Objekt, Betraege) -> selbst neu lesen
      jobs.push(async ()=>{ entry.text = (await ocrCanvasLines(await renderPageCanvas(page, OCR_SCALE))).join("\n"); entry.source = "ocr"; });
    } else if(/total\s*m\s*[3³]|total\s*fr|summe|total/i.test(entry.text) && !/zahlteil|empfangsschein/i.test(entry.text)){
      // Beilage (Ausmassblatt): nur den unteren Teil mit den Totalen neu lesen -> sehr schnell
      jobs.push(async ()=>{
        const strip = await ocrCanvasLines(await renderPageCanvas(page, OCR_SCALE, [0.72, 1.0]));
        const keep = entry.text.split("\n").filter(l => !/total\s*m\s*[3³]|total\s*fr|totalm/i.test(l));
        entry.text = keep.concat(strip).join("\n");
        entry.source = "ocr";
      });
    }
    // Zahlteil / leere Seiten: Textebene genuegt
  }
  if(jobs.length){
    if(onProgress) onProgress(0, jobs.length, "ocr-start");
    let done = 0;
    await Promise.all(jobs.map(j => j().then(()=>{ done++; if(onProgress) onProgress(done, jobs.length, "ocr-done"); })));
  }
  return pages;
}

/* ============================= SEITEN -> EINZELNE RECHNUNGEN TRENNEN ============================= */

function classifyPage(text){
  const t = text.toLowerCase();
  // Nur die eigentliche Ausmassblatt-Beilage erkennen (Titel "Ausmassblatt Nr." bzw. Mess-Tabellenkopf),
  // nicht eine Rechnung, die lediglich "gem. Ausmassblatt" als Positionstext erwähnt.
  if(/ausmassblatt\s*nr/.test(t)) return "attachment";
  if(/abmessung\s*in\s*m/.test(t) && /l[aä]nge/.test(t) && /breite/.test(t)) return "attachment";
  if(/zahlteil|empfangsschein/.test(t)) return "attachment";
  if(/kunde\s*:\s*bauvorhaben\s*:/.test(t) || /total\s+ausflockungen?/.test(t) && !/rechnung/.test(t)) return "attachment"; // Ausmass-Formular
  if(text.replace(/\s/g,"").length < 80) return "attachment"; // fast leere Seite / reiner QR-Beleg
  // Mehrseitige Rechnungen: eine Folgeseite ohne jeden neuen Rechnungs-/Objekt-Hinweis ist
  // vermutlich die Fortsetzung der Positionstabelle der vorherigen Seite, keine neue Rechnung.
  const hasInvoiceMarker = /rechnung|auftragsnr|objekt\s*:|\badresse\b|baustelle/i.test(t);
  if(!hasInvoiceMarker) return "attachment";
  return "invoice_start";
}

function splitPagesIntoInvoices(pages){
  const groups = [];
  let current = null;
  pages.forEach(p => {
    const type = classifyPage(p.text);
    if(type === "invoice_start" && current && current.onlyAttach){
      // fuehrende Beilage-Seiten (z.B. Ausmass vor der Rechnung) gehoeren zur folgenden Rechnung
      current.pages.push(p.pageNum);
      current.allText = p.text + "\n" + current.allText;
      current.sources.push(p.source);
      current.onlyAttach = false;
    } else if(type === "invoice_start" || !current){
      current = { pages: [p.pageNum], allText: p.text, sources: [p.source], onlyAttach: type !== "invoice_start" };
      groups.push(current);
    } else {
      current.pages.push(p.pageNum);
      current.allText += "\n" + p.text;
      current.sources.push(p.source);
    }
  });
  return groups;
}

/* ============================= RECHNUNGSTEXT PARSEN ============================= */

// Tausender-Trennzeichen vereinheitlichen: 3’682.80 / 3`682.80 / 3 682.80 -> 3'682.80
function normalizeDigits(text){
  return String(text||"")
    .replace(/(\d)[’‘`´ʼ′](?=\d{3}\b)/g, "$1'")
    .replace(/(\d)[\u00A0\u202F\u2009](?=\d{3}\b)/g, "$1'");
}
function parseInvoiceText(text){
  text = normalizeDigits(text);
  const rawLines = text.split("\n").map(l=>l.trim()).filter(l=>l.length>0);
  const lower = text.toLowerCase();

  const result = { lieferant:"", rechnungsnr:"", datum:"", objekt:"", auftragsnummer:"", total:null, items:[] };

  // --- Lieferant ---
  // Zeilen, die den Empfaenger (uns selbst) beschreiben, duerfen nie als Lieferant durchgehen.
  const isOwnCompanyLine = l => l.includes("pe fabrikation") || l.includes("fabrikations ag") || l.includes("slijepcevic") || l.includes("feldmoosstrasse");
  // E-Mail-Kopfzeilen, Adresszeilen o.ae. sehen nie wie ein Firmenname aus -- fuer den
  // Blindflug-Fallback (letzte Zeile ohne besseren Treffer) explizit ausschliessen.
  const looksLikeNoise = l => /^(von|from|an|to|betreff|subject|cc|bcc|gesendet|datum|date)\s*:/i.test(l)
    || l.includes("@") || /<[^>]+>/.test(l) || !/[a-zäöü]{2,}/i.test(l);
  // 1) Schweizer QR-Rechnung: "Konto / Zahlbar an" nennt den Rechnungssteller eindeutig
  result.lieferant = creditorFromQR(rawLines, isOwnCompanyLine);
  // 2) Firmenname mit Rechtsform (GmbH, AG, SA …) im Kopf der Rechnung
  if(!result.lieferant){
    for(const line of rawLines.slice(0,20)){
      const n = companyNameIn(line, isOwnCompanyLine);
      if(n){ result.lieferant = n; break; }
    }
  }
  if(!result.lieferant){
    for(const s of KNOWN_SUPPLIERS){
      if(lower.includes(s.hint)){ result.lieferant = s.name; break; }
    }
  }
  // 3) Webseite / E-Mail-Domain des Absenders (www.trendisol.ch -> Trendisol)
  if(!result.lieferant){
    const dm = text.match(/(?:www\.|@)([a-z0-9äöü\-]{3,})\.(?:ch|com|de|li|at|swiss)\b/i);
    if(dm && !/pe-fabrikation/i.test(dm[1])) result.lieferant = dm[1].charAt(0).toUpperCase() + dm[1].slice(1);
  }
  if(!result.lieferant){
    const fallbackLine = rawLines.find(l => l.trim() && !isOwnCompanyLine(l.toLowerCase()) && !looksLikeNoise(l) && !/^(\w+\s*:\s*)+$/.test(l));
    if(fallbackLine) result.lieferant = fallbackLine;
  }

  // Anzeigename vereinheitlichen, falls ein bekannter Sub erkannt wurde (auch "Azzinnari F U BS Brandschutz" -> FUBS)
  const compactLief = compactName(result.lieferant);
  for(const s of KNOWN_SUPPLIERS){
    if(compactLief.includes(compactName(s.hint))){ result.lieferant = s.name; break; }
  }
  // In den Einstellungen gepflegte Subunternehmer + Aliase haben Vorrang
  const userSub = matchSubInText(text, result.lieferant);
  if(userSub) result.lieferant = userSub.name;

  // --- Rechnungsnummer (gelerntes Muster des Subs > beschriftete Nummer > Nummer unter Kopfzeile) ---
  let m;
  result.rechnungsnr = findRechnungsnr(text, result.lieferant);

  // --- Datum ---
  m = text.match(/Datum:?\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i);
  if(!m) m = text.match(/,\s*den\s*(\d{1,2}\.\d{1,2}\.\d{2,4})/i);
  if(!m) m = text.match(/(\d{1,2}\.\d{1,2}\.\d{4})/);
  if(m) result.datum = m[1];

  // --- Objekt / Adresse ---
  // Gescannte Rechnungen haben oft eine handschriftliche Notiz-Box (FA erf./Mat.preis/Fibu) auf
  // gleicher Zeilenhoehe wie die Adresse -- das OCR fasst das faelschlicherweise zusammen.
  // Wir begrenzen die Erfassung daher auf ein Schweizer PLZ+Ort-Muster und schneiden bekannte
  // Stoerwoerter ab, statt bis zum Zeilenende zu lesen.
  m = text.match(/Objekt:?\s*[\"']?\s*([^\n]*?(?<!\d)\d{4}\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,30}(?:[ \t]+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,20})?)/i);
  if(!m) m = text.match(/Objekt:?\s*[\"']?\s*([^\n]+)/i);
  if(m) result.objekt = sanitizeObjekt(m[1]);
  // Haus-Angabe am Zeilenende ("… Reinach Haus W7") nicht verlieren
  { const objLine = (text.match(/Objekt:?\s*([^\n]+)/i)||[])[1] || "";
    const hl = hausFromText(objLine);
    if(result.objekt && hl && !hausFromText(result.objekt)) result.objekt = stripHaus(result.objekt) + " " + hl; }

  if(!result.objekt){
    m = text.match(/\d{5,}\s*\/\s*([A-ZÄÖÜ][^\n]*?(?<!\d)\d{4}\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,30}(?:[ \t]+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,20})?)/);
    if(!m) m = text.match(/\d{5,}\s*\/\s*([A-ZÄÖÜ][^\n]{5,80})/);
    if(m) result.objekt = sanitizeObjekt(m[1]);
  }
  if(!result.objekt){
    m = text.match(/ADRESSE\s+([^\n]*?(?<!\d)\d{4}\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,30}(?:[ \t]+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,20})?)/i);
    if(!m) m = text.match(/ADRESSE\s+([^\n]+)/i);
    if(m) result.objekt = sanitizeObjekt(m[1]);
  }
  if(!result.objekt){
    m = text.match(/Baustelle\s+[\d\/A-Za-z.\-]+\s*\n?\s*([^\n]*?(?<!\d)\d{4}\s+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,30}(?:[ \t]+[A-ZÄÖÜ][A-Za-zÄÖÜäöü\-\.]{1,20})?)/i);
    if(!m) m = text.match(/Baustelle\s+[\d\/A-Za-z.\-]+\s*\n?\s*([^\n]+)/i);
    if(m) result.objekt = sanitizeObjekt(m[1]);
  }
  if(!result.objekt) result.objekt = objektFromLabels(rawLines, isOwnCompanyLine, result.lieferant);
  if(!result.objekt){
    // Manche Rechnungen nennen das Objekt ganz ohne Label -- einfach als eigene Zeile direkt
    // nach der Rechnungsnummer. Als letzten Fallback: die Zeile danach nehmen, wenn sie
    // plausibel wie ein Ort/Objektname aussieht (nicht selbst eine bekannte Kopfzeile).
    const rnrLineIdx = rawLines.findIndex(l => /rechnung/i.test(l) && /\d/.test(l));
    if(rnrLineIdx > -1 && rawLines[rnrLineIdx+1]){
      const cand = rawLines[rnrLineIdx+1];
      const cl = cand.toLowerCase();
      const isLabelLine = /^(datum|zahlbar|ihr ansprechpartner|kundennummer|sehr geehrte|guten tag|mwst|auftragsnr|adresse)/i.test(cand) || isOwnCompanyLine(cl);
      if(!isLabelLine && /[A-Za-zÄÖÜäöü]{3,}/.test(cand) && cand.length < 60){
        result.objekt = sanitizeObjekt(cand);
      }
    }
  }

  // --- Auftragsnummer ---
  m = text.match(/AUFTRAGSNR\.?[:\-]?\s*([A-Za-z0-9.\-\/]+)/i);
  if(!m) m = text.match(/Auftrag(?:s)?-?Nr\.?:?\s*([A-Za-z0-9.\-\/]+)/i);
  if(!m) m = text.match(/Auf-?Nr\.?:?\s*([A-Za-z0-9.\-\/]+)/i);
  if(m) result.auftragsnummer = m[1].trim();
  if(!result.auftragsnummer){
    m = text.match(/(\d{6,})\s*\/\s*[A-ZÄÖÜ]/);
    if(m) result.auftragsnummer = m[1];
  }

  // --- Gesamtbetrag ---
  result.total = findTotal(rawLines);

  // --- Positionen ---
  const categories = DB.categories && DB.categories.length ? DB.categories : DEFAULT_CATEGORIES;
  const catBeplankung = categories.find(c=>c.key==="Beplankung");
  const catAusflockung = categories.find(c=>c.key==="Ausflockung");
  const catSonstiges = categories.find(c=>c.key==="Sonstiges");

  const sameish = (a,b) => Math.abs(a-b) <= Math.max(1, Math.abs(b)*0.01);
  rawLines.forEach(line => {
    const l = line.toLowerCase();
    if(/^(bezeichnung|pos\.|menge|einheit|preis|total$|zzgl|zwischensumme|zwischentotal|summe|mwst-?nr|iban|bic|telefon|rechnungsbetrag)/i.test(l)) return;
    // Verweis auf das Ausmassblatt selbst ueberspringen -- die Menge wird separat ueber
    // den "Total m3"-Wert des Ausmassblatts erfasst, sonst wuerde doppelt gezaehlt.
    if(l.includes("ausmassblatt")) return;

    const unitMatch = line.match(/(\d+(?:[.,]\d+)?)\s*(m2|m²|m3|m³|stk\.?|st\.?|std\.?|stunden|h|app\.?|apparate?|le|psch\.?|pauschal|pau\.?|gl|kg\.?|lt\.?|l)(?=\s|$|[,;:)])/i);
    let cat = null, menge = null, einheit = null, preis = null, ep = null;

    if(unitMatch){
      einheit = normalizeUnit(unitMatch[2]);
      menge = parseSwissNumber(unitMatch[1]);
      // Preise nur RECHTS der Mengenangabe suchen (sonst wird z.B. "107.00 m2" als Preis gelesen)
      const after = line.slice(unitMatch.index + unitMatch[0].length);
      const prices = [...after.matchAll(/(-?[\d']+[.,]\d{2})(?!\d)/g)].map(m=>parseSwissNumber(m[1])).filter(v=>v!==null);
      if((einheit==="h" || einheit==="App." || einheit==="Psch" || einheit==="kg" || einheit==="l") && !prices.length) return; // "48 h Lieferfrist" o.ae. ist keine Position
      if(prices.length) preis = prices[prices.length-1];
      if(prices.length >= 2 && menge){
        const cand = prices[prices.length-2];
        if(sameish(menge*cand, preis)) ep = cand;
        else {
          // Tausender abgeschnitten? (z.B. "3’682.80" als 682.80 gelesen) -> Menge x Einheitspreis nehmen
          const calc = roundNum(menge * cand), diff = calc - preis;
          if(diff > 0 && Math.abs(diff / 1000 - Math.round(diff / 1000)) * 1000 <= Math.max(1, calc * 0.01)){ preis = calc; ep = cand; }
        }
      }
      // Faustregel aus dem Betrieb: m² ist immer Beplankung, m³ ist immer Ausflockung
      if(einheit === "m²") cat = catBeplankung;
      else if(einheit === "m³") cat = catAusflockung;
      else if(einheit === "h") cat = categories.find(c=>c.key==="Regie") || catSonstiges;
      else if(einheit === "kg" || einheit === "l") cat = categories.find(c=>c.key==="Material") || catSonstiges;
      else if(einheit === "App.") cat = categories.find(c => !["Beplankung","Ausflockung","Sonstiges","Regie","Elemente"].includes(c.key) && c.keywords.some(kw=>l.includes(kw))) || categories.find(c=>c.key==="Duofix") || catSonstiges;
      else cat = categories.find(c => !["Beplankung","Ausflockung","Sonstiges","Regie"].includes(c.key) && c.keywords.some(kw=>l.includes(kw))) || catSonstiges;
    } else {
      for(const c of categories){
        if(c.key==="Beplankung" || c.key==="Ausflockung" || c.key==="Sonstiges") continue;
        if(c.keywords.some(kw => l.includes(kw))){ cat = c; break; }
      }
      if(!cat) return;
      const nums = [...line.matchAll(/(-?[\d']+[.,]\d{1,2})(?!\d)/g)].map(m=>parseSwissNumber(m[1])).filter(v=>v!==null);
      if(!nums.length) return;
      einheit = cat.unit;
      if(nums.length === 1){
        // Nur eine Zahl: bei Pauschalen (Anfahrt/Entsorgung) ist das der Betrag, sonst die Menge
        if(cat.key==="Anfahrt" || cat.key==="Entsorgung"){ menge = 1; preis = nums[0]; }
        else menge = nums[0];
      } else {
        menge = nums[0];
        preis = nums[nums.length-1];
        if(nums.length >= 3 && sameish(menge*nums[nums.length-2], preis)) ep = nums[nums.length-2];
      }
    }

    if(menge === null || !cat) return;
    // Nullzeilen (z.B. unbenutzte Tarifzeilen "m2 36.00 CHF 0.00 CHF") interessieren nicht
    if(preis !== null && preis === 0) return;

    result.items.push({ id: uid("it"), category: cat.key, label: line.slice(0,90), menge, einheit, preis, ep });
  });

  // Ausmassblaetter: "Total m3" aller Blaetter zusammenzaehlen (Blatt 1 + Blatt 2 …)
  const m3vals = [...text.matchAll(/Total\s*m[3³]\s*:?\s*([\d'’.,]+\d)/gi)].map(m=>parseSwissNumber(m[1])).filter(v=>v!=null && v>0);
  if(m3vals.length && !result.items.some(it=>it.category==="Ausflockung")){
    const sumM3 = roundNum(m3vals.reduce((a,b)=>a+b,0));
    result.items.push({ id: uid("it"), category: "Ausflockung", label: `Total m³ (Ausmassblatt${m3vals.length>1?` ${m3vals.length} Blätter: ${m3vals.join(" + ")}`:""})`, menge: sumM3, einheit: "m³", preis: null, ep: null });
  }

  // Nicht erkannte Zeilen: zuerst ueber die Preisliste des Subs zuordnen (Bezeichnung/Suchbegriffe),
  // was dann immer noch unbekannt ist UND keinen Betrag hat, ist kein Rechnungsposten (Adresse, Hinweis …)
  const subForItems = getSubFor(result.lieferant);
  result.items.forEach(it=>{
    if(it.category!=="Sonstiges" || !subForItems) return;
    const t = classifyBySubTarif(subForItems, it.label);
    if(t){ it.category = t.category; it.tarifId = t.id; }
  });
  result.items = result.items.filter(it => !(it.category==="Sonstiges" && (it.preis===null || it.preis===undefined)));
  result.items = result.items.filter(it => !(Number(it.menge)===0 && !it.preis)); // "Total 0.00 m3" o.ae.

  // Rechnung besteht nur aus der Ausmassblatt-Menge ohne Betrag: Betrag aus dem Rechnungstotal (inkl. 8.1% MwSt) ableiten
  if(result.items.length===1 && result.items[0].preis==null && result.total){
    const it = result.items[0];
    it.preis = roundNum(result.total / 1.081);
    it.label = (it.label + " – Betrag = Rechnungstotal ÷ 1.081").slice(0,120);
  }

  // "Höhenstrasse 22, 8954 Geroldswil Galgenen, den 03.03.2026": Ort des Briefdatums gehoert nicht zum Objekt
  if(result.objekt){
    const lw = result.objekt.split(/\s+/).pop();
    if(lw && lw.length > 2 && new RegExp(lw.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ",?\\s*den\\s+\\d").test(text)) result.objekt = result.objekt.slice(0, -lw.length).replace(/[,\s]+$/,"");
  }
  return result;
}

const LEGAL_FORM_RE = /\b(GmbH|AG|SA|Sàrl|S\.à\.r\.l\.|KLG|KG|Genossenschaft|Holding)\b/;
const COMPANY_LABEL_WORDS = new Set(["baustellen","baustellen-","lieferanschrift","/lieferanschrift","absender","rechnungsadresse","von","an","firma","konto","zahlbar","rechnung","kunde","kunden"]);
// Firmennamen aus einer Zeile herausloesen ("Baustellen- /Lieferanschrift Trendisol GmbH - Herbergstrasse 29" -> "Trendisol GmbH")
function companyNameIn(line, isOwn){
  if(!LEGAL_FORM_RE.test(line)) return "";
  const parts = String(line).split(/\s+[-–|•]\s+|\s{2,}/);
  for(const part of parts){
    const m = part.match(/((?:[A-ZÄÖÜ0-9][\wÄÖÜäöüß&.'\-]*\s+){0,3})(GmbH|AG|SA|Sàrl|S\.à\.r\.l\.|KLG|KG|Genossenschaft|Holding)\b/);
    if(!m) continue;
    let words = (m[1] || "").trim().split(/\s+/).filter(Boolean);
    while(words.length && COMPANY_LABEL_WORDS.has(words[0].toLowerCase().replace(/[:]/g,""))) words.shift();
    if(!words.length) continue;
    const name = (words.join(" ") + " " + m[2]).trim();
    if(isOwn(name.toLowerCase())) continue;
    return name;
  }
  return "";
}
function creditorFromQR(rawLines, isOwn){
  for(let i=0;i<rawLines.length;i++){
    const l = rawLines[i];
    const mm = l.match(/zahlbar\s+an\s*:?\s*(.*)$/i);
    if(!mm || /zahlbar\s+durch/i.test(l)) continue;
    const cands = [mm[1], ...rawLines.slice(i+1, i+5)];
    for(let c of cands){
      c = String(c||"").replace(/\bCH\d{2}(?:\s?\d{4}){4}\s?\d\b/g, "").replace(/zahlbar\s+an/ig,"").trim();
      if(!c || /^(CH\d|\d|referenz|konto)/i.test(c)) continue;
      if(/^(empfangsschein|zahlteil|annahmestelle|w[äa]hrung|betrag|zus[äa]tzliche|zahlbar)/i.test(c)) continue;
      if(isOwn(c.toLowerCase())) continue;
      const n = companyNameIn(c, isOwn);
      if(n) return n;
      if(/[A-Za-zÄÖÜäöü]{3,}/.test(c) && !/strasse|weg|gasse|\d{4}\s/i.test(c)) return c;
    }
  }
  return "";
}
// Objekt ueber typische Beschriftungen; Wert steht in derselben Zeile oder direkt darunter
function objektFromLabels(rawLines, isOwn, lieferant){
  const labelRe = /(Baustellen-?\s*\/?\s*Lieferanschrift|Baustellenadresse|Lieferanschrift|Lieferadresse|Bauvorhaben|Bauobjekt|Objektadresse|Ausführungsort|Arbeitsort|Projekt|Baustelle)\s*:?\s*(.*)$/i;
  const cleanVal = v => {
    let t = String(v||"");
    t = t.split(/\bPE\s*Fabrikation|\bFabrikations\s*AG|\bFeldmoosstrasse|\bSlijepcevic|\bDel\s+Cotto/i)[0];
    if(lieferant) t = t.split(new RegExp(lieferant.split(/\s+/)[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i"))[0];
    t = t.replace(/\s[-–]\s.*$/, "").trim();
    if(/^(\w+\s*:\s*)+$/.test(t) || /^(datum|kunde|material|nr)\b/i.test(t)) return "";
    if(LEGAL_FORM_RE.test(t) || isOwn(t.toLowerCase())) return "";
    return sanitizeObjekt(t);
  };
  for(let i=0;i<rawLines.length;i++){
    const m = rawLines[i].match(labelRe);
    if(!m) continue;
    const same = cleanVal(m[2]);
    if(same) return same;
    if(rawLines[i+1]){ const nx = cleanVal(rawLines[i+1]); if(nx) return nx; }
  }
  return "";
}
// Rechnungstotal: beschriftete Endbetraege (auch "Rechnungsbetrag Brutto 6'590.50"), sonst QR-Zahlteil
function findTotal(rawLines){
  const amt = /(-?\d{1,3}(?:['’ ]\d{3})*(?:[.,]\d{2})|-?\d+[.,]\d{2})(?!\d)/;
  const strong = /(rechnungsbetrag|gesamtbetrag|endbetrag|zu\s+bezahlen|zahlbetrag|total\s+(?:inkl|brutto|chf|rechnung)|betrag\s+inkl|total\s+zu\s+zahlen|brutto)/i;
  let best = null;
  rawLines.forEach((l, i)=>{
    if(!strong.test(l)) return;
    const after = l.slice(l.search(strong));
    let m = after.match(new RegExp("^[^\\d\\n]{0,40}" + amt.source));
    if(!m){
      // Betrag steht in einer der naechsten Zeilen (oft rechtsbuendig allein auf der Zeile)
      for(const nx of rawLines.slice(i+1, i+4)){
        const mm = nx.match(new RegExp("^(?:CHF\\s*)?" + amt.source + "\\s*(?:CHF|Fr\\.?)?$", "i"));
        if(mm){ m = mm; break; }
      }
    }
    if(m){ const v = parseSwissNumber(m[1]); if(v!=null && (best==null || v > best)) best = v; }
  });
  if(best!=null) return best;
  // QR-Zahlteil: "Währung Betrag" + "CHF 6590.50"
  for(let i=0;i<rawLines.length;i++){
    if(/w[äa]hrung\s+betrag/i.test(rawLines[i])){
      const m = (rawLines[i] + " " + (rawLines[i+1]||"")).match(/CHF\s+(\d[\d' ]*[.,]\d{2})/);
      if(m) return parseSwissNumber(m[1]);
    }
  }
  // Schwache Variante: "Total 1'234.50" (Betrag mit 2 Dezimalen auf derselben Zeile)
  let maxT = null;
  rawLines.forEach(l=>{ const m = l.match(new RegExp("\\bTotal\\b[^\\d\\n]{0,20}" + amt.source, "i")); if(m){ const v = parseSwissNumber(m[1]); if(v!=null && (maxT==null || v > maxT)) maxT = v; } });
  return maxT;
}

function sanitizeObjekt(s){
  if(!s) return "";
  let t = s.replace(/^["'\s]+/,"").trim();
  // Bekannte Stoerwoerter aus der Notiz-Box (FA erf. / Mat.preis / Fibu) und Absender-Stempel
  // abschneiden -- alles ab dem ersten Treffer verwerfen.
  t = t.split(/\bFA\s*erf\.?\b|\bMat\.?\s*preis\b|\bFibu\b|\bEPE\b|\bErinerung\b|\bKundennummer\b|\bAnsprechpartner\b/i)[0];
  // Angehaengtes Datum/"...den 12.03.2026" abschneiden (haeufig durch Spalten-Zusammenfuehrung)
  t = t.replace(/,?\s*(den\s+)?\d{1,2}\.\d{1,2}\.\d{2,4}.*$/i, "");
  t = t.replace(/,?\s*\bden\s*$/i, "");
  t = t.replace(/\s{2,}/g," ").replace(/[,\s]+$/,"").trim();
  // Ergebnis verwerfen, wenn es nicht wie eine echte Adresse aussieht (zu kurz oder keine
  // zusammenhaengende Buchstabenfolge -- z.B. Reste wie "SLI ,Fibu" oder blosse Ziffern).
  if(t.length < 5) return "";
  if(!/[A-Za-zÄÖÜäöü]{3,}/.test(t)) return "";
  return t;
}
function normalizeUnit(u){
  u = u.toLowerCase().replace(".","");
  if(u==="m2"||u==="m²") return "m²";
  if(u==="m3"||u==="m³") return "m³";
  if(u==="stk") return "Stk";
  if(u==="h"||u==="std"||u==="stunden") return "h";
  if(u==="app"||u==="apparat"||u==="apparate") return "App.";
  if(u==="st") return "Stk";
  if(u==="kg") return "kg";
  if(u==="lt"||u==="l") return "l";
  if(u==="le"||u==="psch"||u==="pauschal"||u==="pau"||u==="gl") return "Psch";
  return u;
}
function parseSwissNumber(s){
  if(s===undefined||s===null) return null;
  s = String(s).replace(/['’`´]/g,"").replace(/\s/g,"");
  if(/,\d{1,2}$/.test(s) && !s.includes(".")) s = s.replace(",",".");
  else s = s.replace(/,/g,"");
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

/* ============================= RECHNUNGSNUMMER ============================= */

const RNR_VAL = "([A-Z]{0,4}[-\\s]?\\d[\\dA-Z.\\-\\/]{2,})";
function rnrValid(v){
  v = String(v||"").trim();
  const digits = v.replace(/\D/g,"");
  if(digits.length < 3 || v.length > 25) return false;
  if(/^\d{1,2}\.\d{1,2}\.\d{2,4}$/.test(v)) return false;           // Datum
  if(/^CHE[-\s]?\d/i.test(v) || /^CH\d{2}/i.test(v)) return false;    // MWST / IBAN
  if(/^0\d{2}[\s\/]?\d{3}/.test(v)) return false;                      // Telefon
  return true;
}
function cleanRnr(v){ return String(v||"").trim().replace(/[.,:;]+$/,"").replace(/\s+/g,""); }
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function rnrCandidates(text, lieferant){
  const lines = String(text||"").split("\n").map(l=>l.trim()).filter(Boolean);
  const out = [];
  const excluded = new Set();
  // beschriftete Fremdnummern (Kunden-Nr., Auftrag, MWST …) nie als Rechnungsnr. nehmen
  const exRe = new RegExp("(?:Kunden|Kd|Auftrags?|Bestell|Projekt|Objekt|Referenz|Ref|Lieferschein|Offerte|MWST|UID|Konto|Tel(?:efon)?)\\s*[-.]?\\s*(?:Nr|Nummer|No)?\\.?\\s*[:#]?\\s*" + RNR_VAL, "gi");
  for(const mm of text.matchAll(exRe)) excluded.add(cleanRnr(mm[1]).toLowerCase());
  const add = (v, how)=>{ v = cleanRnr(v); if(rnrValid(v) && !excluded.has(v.toLowerCase()) && !out.some(o=>o.v===v)) out.push({ v, how }); };

  // 1) vom Benutzer gelerntes Muster dieses Subunternehmers
  const sub = getSubFor(lieferant);
  const L = sub && sub.rnrMuster;
  if(L && L.prefix){
    for(const mm of text.matchAll(new RegExp(escRe(L.prefix) + "\\s*[:#]?\\s*" + RNR_VAL, "gi"))) add(mm[1], "gelernt");
  }
  if(L && L.header){
    const norm = s => s.toLowerCase().replace(/\s+/g," ").trim();
    const i = lines.findIndex(l => norm(l) === norm(L.header));
    if(i > -1 && lines[i+1]){ const tok = lines[i+1].split(/\s+/)[L.idx||0]; if(tok) add(tok, "gelernt"); }
  }
  // 2) beschriftete Rechnungsnummer
  for(const mm of text.matchAll(new RegExp("Rechnungs?\\s*[-.]?\\s*(?:Nr|Nummer|No)\\.?\\s*[:#]?\\s*" + RNR_VAL, "gi"))) add(mm[1], "Rechnung Nr.");
  for(const mm of text.matchAll(new RegExp("\\bRechnung\\s*[:#]?\\s+" + RNR_VAL, "gi"))) add(mm[1], "Rechnung");
  for(const mm of text.matchAll(new RegExp("\\b(?:Beleg|Faktura|Invoice|Rg)\\s*[-.]?\\s*(?:Nr|Nummer|No)\\.?\\s*[:#]?\\s*" + RNR_VAL, "gi"))) add(mm[1], "Beleg");
  // 3) Nummer in der Zeile unter einer Kopfzeile "Rechnung Nr. | Datum | …"
  lines.forEach((l, i)=>{
    if(!/\brechnung(s?\s*[-.]?\s*(nr|nummer))?\b/i.test(l) || !lines[i+1]) return;
    if(new RegExp("rechnung\\S*\\s*[-.:#]?\\s*(?:nr|nummer)?\\.?\\s*[:#]?\\s*\\d","i").test(l)) return; // Nummer steht schon in derselben Zeile
    const heads = l.split(/\s{2,}|\s(?=[A-ZÄÖÜ])/);
    const raw = lines[i+1].split(/\s+/);
    const hi = heads.findIndex(h=>/rechnung/i.test(h));
    if(hi < 0) return;
    const cand = raw[hi];
    if(cand && rnrValid(cleanRnr(cand))) add(cand, "unter Kopfzeile");
  });
  return out;
}
function findRechnungsnr(text, lieferant){
  const c = rnrCandidates(text, lieferant);
  if(!c.length) return "";
  if(c[0].how === "gelernt") return c[0].v;
  // Nummer, die beim selben Sub schon auf einer ANDEREN Rechnung (anderes Objekt) vorkommt, ist meist eine Kunden-/Referenznummer
  const lief = String(lieferant||"").toLowerCase();
  const usedElsewhere = v => (DB.invoices||[]).some(o => String(o.lieferant||"").toLowerCase()===lief && String(o.rechnungsnr||"").toLowerCase()===v.toLowerCase());
  const fresh = c.find(x => !usedElsewhere(x.v));
  return (fresh || c[0]).v;
}

// Korrigiert der Benutzer eine Rechnungsnr., merkt sich das Tool, wo sie bei diesem Sub steht
async function learnRechnungsnr(inv){
  const v = cleanRnr(inv.rechnungsnr);
  const raw = String(inv.rawText||"");
  if(!v || !raw || !inv.lieferant) return;
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const i = lines.findIndex(l => l.replace(/\s+/g,"").includes(v));
  if(i < 0) return;
  const line = lines[i];
  const pos = line.search(new RegExp(v.split("").map(escRe).join("\\s*")));
  const before = pos > 0 ? line.slice(0, pos) : "";
  const pm = before.match(/([A-Za-zÄÖÜäöü][A-Za-zÄÖÜäöü.\-\s]{1,30}?)\s*[:#]?\s*$/);
  let muster;
  if(pm && /[A-Za-zÄÖÜäöü]{2,}/.test(pm[1])) muster = { prefix: pm[1].trim() };
  else if(i > 0) muster = { header: lines[i-1], idx: Math.max(0, line.split(/\s+/).findIndex(t => cleanRnr(t)===v)) };
  if(!muster) return;
  let sub = getSubFor(inv.lieferant);
  const data = sub ? cleanSubForSave(sub) : { name: inv.lieferant, aliases: [], kontakt:"", notizen:"", tarife: [] };
  data.rnrMuster = muster;
  try{
    await window.fb.setDoc("subunternehmer", sub ? sub.id : slugify(inv.lieferant), data);
    toast(`Gemerkt: Bei ${inv.lieferant} steht die Rechnungsnr. ${muster.prefix ? `nach „${muster.prefix}“` : "unter der Kopfzeile"}.`);
  }catch(err){ console.warn("Rechnungsnr.-Muster nicht gespeichert (Berechtigung „Preise bearbeiten“ nötig)", err); }
}

/* ============================= AUFTRAG MATCHING ============================= */

function buildProjectName(parsed){
  if(parsed.objekt) return parsed.objekt.trim();
  const lief = (parsed.lieferant||"").trim();
  const auf = (parsed.auftragsnummer||"").trim();
  if(lief && auf) return `${lief} – Auftrag ${auf}`;
  if(lief) return `${lief} – ${new Date().toLocaleDateString("de-CH")}`;
  return "Unbenannter Auftrag";
}

function findMatchingProject(parsed){
  if(!parsed.objekt && !parsed.auftragsnummer) return null;
  const objLower = (parsed.objekt||"").toLowerCase();
  if(parsed.auftragsnummer){
    const an = String(parsed.auftragsnummer).replace(/[^0-9A-Za-z]/g,"");
    const byNum = DB.projects.find(p => p.auftragsnummer && p.auftragsnummer === parsed.auftragsnummer);
    if(byNum) return byNum;
    // Subunternehmer schreiben oft unsere AB-Nummer als "Auftragsnr." auf die Rechnung (z.B. 202417612)
    const byAB = an.length >= 6 && DB.projects.find(p => (p.abs||[]).some(a => a.nr === an || String(a.anr||"").replace(/[^0-9A-Za-z]/g,"") === an));
    if(byAB) return byAB;
  }
  if(objLower){
    let best = null, bestScore = 0;
    for(const p of DB.projects){
      const s = projectAddrScore(parsed.objekt, p);
      if(s > bestScore){ best = p; bestScore = s; }
    }
    if(best && bestScore >= 2) return best; // nur sichere Treffer, sonst neuer Auftrag
  }
  return null;
}

}

let uploadCompact = false;
function limitConcurrency(n){
  let active = 0; const q = [];
  const next = ()=>{
    if(active >= n || !q.length) return;
    active++;
    const { fn, res, rej } = q.shift();
    Promise.resolve().then(fn).then(res, rej).finally(()=>{ active--; next(); });
  };
  return fn => new Promise((res, rej)=>{ q.push({ fn, res, rej }); next(); });
}

async function handleFiles(fileList){
  const files = Array.from(fileList).filter(f=>f.type==="application/pdf" || f.name.endsWith(".pdf"));
  if(!files.length) return;
  const statusEl = document.getElementById("uploadStatus");

  if(typeof Notification !== "undefined" && Notification.permission === "default"){
    try{ await Notification.requestPermission(); }catch(e){}
  }

  // Bei vielen Dateien: kompakte Ergebnisliste statt grosser Karten
  uploadCompact = files.length > 2;
  const startedAt = Date.now();
  const progEl = document.getElementById("uploadProgress");
  let filesDone = 0;
  const showProg = (cur)=>{
    if(!progEl) return;
    const pct = Math.round(filesDone / files.length * 100);
    progEl.innerHTML = `<div style="display:flex;justify-content:space-between;font-size:13px;"><b>${filesDone} von ${files.length} Datei(en) fertig</b><span class="muted">${cur ? escapeHtml(cur) : ""}</span></div><div class="progresswrap"><div class="progressbar" style="width:${pct}%"></div></div>`;
  };
  showProg("Lese Dateien…");
  if(uploadCompact) ensureUploadResultTable();
  // Lesen (inkl. Texterkennung) laeuft fuer bis zu 3 Dateien gleichzeitig; gespeichert wird danach der Reihe nach
  const limit = limitConcurrency(3);
  const extractions = files.map(file => limit(()=> extractPagesFromPDF(file)));
  extractions.forEach(p => p.catch(()=>{}));

  for(let fi = 0; fi < files.length; fi++){
    const file = files[fi];
    try{
      showProg(`„${file.name}“ wird gelesen…`);
      const pages = await extractions[fi];

      // PE-Auftragsbestaetigung? -> als AB einlesen und dem Auftrag zuordnen
      const fullText = pages.map(p=>p.text).join("\n");
      if(isABText(fullText)){
        const ab = abFromPages(pages, file.name);
        if(!ab.positionen.length){
          statusEl.insertAdjacentHTML("beforeend", `<span class="flag">"${escapeHtml(file.name)}": Auftragsbestätigung erkannt, aber keine Positionen lesbar.</span>`);
          continue;
        }
        const res = await autoAssignAB(ab);
        await syncHousesWithABs(DB.projects.find(x=>x.id===res.projectId));
        statusEl.insertAdjacentHTML("beforeend", `<div class="muted">"${escapeHtml(file.name)}": Auftragsbestätigung <b>${escapeHtml(ab.nr)}</b> erkannt (${ab.positionen.length} Positionen) und gespeichert.</div>`);
        appendABCard(ab, res);
        continue;
      }

      const allGroups = splitPagesIntoInvoices(pages);
      // Dokumente ohne Rechnung (leeres Ausmass-Formular, reine Beilage ohne Betraege) nicht als Rechnung speichern
      const groups = allGroups.filter(g => {
        if(!g.onlyAttach) return true;
        const pr = parseInvoiceText(g.allText);
        return /rechnung|faktura|invoice/i.test(g.allText) && (pr.total || pr.items.some(i=>i.preis));
      });
      const skipped = allGroups.length - groups.length;
      if(!uploadCompact || skipped) statusEl.insertAdjacentHTML("beforeend", `<div class="muted">"${escapeHtml(file.name)}": <b>${groups.length}</b> Rechnung(en) erkannt, getrennt und automatisch gespeichert.${skipped ? ` <span class="flag">${skipped} Dokument(e) ohne Rechnung (z.B. Ausmass-Formular ohne Beträge) wurden nicht als Rechnung gespeichert.</span>` : ""}</div>`);

      let pdfPromise = null;
      const getPdfId = () => pdfPromise || (pdfPromise = storePdfFile(file));
      let dupInfo = [];
      for(const g of groups){
        const parsed = parseInvoiceText(g.allText);
        const existing = findExistingInvoice(parsed);
        if(existing){
          if((!hasOriginal(existing) || invoiceUnreliable(existing)) && !existing.gedrucktAm){
            const pid = await getPdfId();
            if(pid) await attachPdfToInvoice(existing, pid, g.pages);
            parsed._rawText = g.allText;
            const fixed = await refreshFromParsed(existing, parsed);
            dupInfo.push(`${existing.lieferant} ${existing.rechnungsnr||""}: war schon erfasst – Original ergänzt${fixed.length ? ` (korrigiert: ${fixed.filter(f=>f!=="rawText").join(", ")})` : ""}`);
          } else {
            // echte Doppelrechnung: Versuch beim Original vermerken und Bestaetigung fuer den Sub anbieten
            const versuch = { am: new Date().toLocaleString("de-CH"), datei: file.name || "", von: currentUser ? currentUser.email : "" };
            existing.duplikatVersuche = [...(existing.duplikatVersuche||[]), versuch];
            try{ await window.fb.setDocMerge("invoices", existing.id, { duplikatVersuche: existing.duplikatVersuche }); }catch(e){}
            appendDuplicateCard(existing, file.name);
          }
          continue;
        }
        parsed._filename = file.name;
        parsed._pages = g.pages;
        parsed._rawText = g.allText;
        parsed._ocrUsed = g.sources.includes("ocr");
        parsed._getPdfId = getPdfId;
        await appendReviewCard(parsed);
      }
      if(dupInfo.length) statusEl.insertAdjacentHTML("beforeend", `<div class="flag" style="margin-top:4px;">${dupInfo.map(escapeHtml).join("<br>")}</div>`);
    }catch(err){
      console.error(err);
      statusEl.insertAdjacentHTML("beforeend", `<div class="flag">Fehler beim Lesen von "${escapeHtml(file.name)}": ${escapeHtml(err.message||"unbekannt")}</div>`);
    }finally{
      filesDone++;
      showProg(filesDone < files.length ? `„${(files[filesDone]||{}).name||""}“ wird gelesen…` : "");
    }
  }
  const secs = Math.round((Date.now() - startedAt) / 1000);
  if(progEl) progEl.innerHTML = `<div class="fd ok" style="font-size:13px;">✓ ${files.length} Datei(en) in ${secs} s verarbeitet. Weiter mit <a href="#" id="goCheck"><b>② Prüfen</b></a>.</div>`;
  const gc = document.getElementById("goCheck");
  if(gc) gc.addEventListener("click", e=>{ e.preventDefault(); navStack = []; currentView = "check"; render(); });
  updateBadges();
}

function mengeSummary(invs){

const lastSearch = {};
function addSearchBox(container, placeholder, onFilter){
  const box = document.createElement("div");
  box.style.marginBottom = "14px";
  box.innerHTML = `<input type="search" placeholder="🔍 ${escapeAttr(placeholder)}" style="max-width:420px;">`;
  container.appendChild(box);
  const input = box.querySelector("input");
  // Mehrere Woerter = alle muessen vorkommen ("froh altendorf 7060")
  const apply = ()=>{
    const q = input.value.trim().toLowerCase();
    lastSearch[placeholder] = q;
    const words = q.split(/\s+/).filter(Boolean);
    // eigene Filterung ueber data-search aller Elemente im Hauptbereich
    const items = mainEl.querySelectorAll("[data-search]");
    if(items.length){
      items.forEach(el=>{ const t = el.dataset.search || ""; el.style.display = words.every(w=>t.includes(w) || t.replace(/'/g,"").includes(w.replace(/'/g,""))) ? "" : "none"; });
    } else onFilter(q);
  };
  input.addEventListener("input", apply);
  if(lastSearch[placeholder]){ input.value = lastSearch[placeholder]; setTimeout(apply, 0); }
  return input;
}
