function wireTodos(container, todos, rerender){
  container.querySelectorAll("[data-todoopen]").forEach(b=>b.addEventListener("click", ()=>{
    const t = todos[+b.dataset.todoopen];
    projTabFor[t.projectId] = t.kind==="ab" ? "ab" : t.kind==="haus" ? "invoices" : "overview";
    navigateTo("projectDetail", { projectId: t.projectId });
  }));
  container.querySelectorAll("[data-todoshare]").forEach(b=>b.addEventListener("click", ()=>{
    const t = todos[+b.dataset.todoshare];
    const p = DB.projects.find(x=>x.id===t.projectId);
    openShareDialog({ type:"project", id:t.projectId, label: p ? p.name : t.text }, t.share || "");
  }));
  container.querySelectorAll("[data-todonodup]").forEach(b=>b.addEventListener("click", async ()=>{
    const t = todos[+b.dataset.todonodup];
    const a = DB.projects.find(x=>x.id===t.projectId);
    if(!a) return;
    a.notDup = Array.from(new Set([...(a.notDup||[]), t.otherId]));
    await saveProject(a);
    toast("Als verschiedene Objekte markiert.");
    rerender();
  }));
  container.querySelectorAll("[data-todomerge]").forEach(b=>b.addEventListener("click", async ()=>{
    const t = todos[+b.dataset.todomerge];
    const a = DB.projects.find(x=>x.id===t.projectId), c = DB.projects.find(x=>x.id===t.otherId);
    if(!a || !c) return;
    if(!hasPerm("deleteAuftraege")){ toast("Keine Berechtigung zum Zusammenführen."); return; }
    // Ziel = Auftrag mit AB bzw. mit mehr Rechnungen
    const score = x => ((x.abs||[]).length ? 1000 : 0) + DB.invoices.filter(i=>i.projectId===x.id).length;
    const [target, src] = score(a) >= score(c) ? [a, c] : [c, a];
    if(!confirm(`„${src.name}“ in „${target.name}“ zusammenführen?\n\nRechnungen und ABs werden verschoben. Unterscheiden sich Hausnummer/Haus, wird das automatisch als Haus übernommen.`)) return;
    await mergeProjects(src, target);
    toast("Zusammengeführt.");
    rerender();
  }));
}

async function mergeProjects(src, target){
  const hint = (p, other)=>{
    let h = hausFromText(p.address) || hausFromText(p.name);
    if(!h){
      const st = addrTokens(p.address||p.name).find(t=>STREET_RE.test(t));
      if(st){
        const na = houseNo(p.address||p.name, st), nb = houseNo(other.address||other.name, st);
        if(na && na!==nb) h = "Nr. " + na;
      }
    }
    return h;
  };
  const srcHaus = hint(src, target), tgtHaus = hint(target, src);
  for(const inv of DB.invoices.filter(i=>i.projectId===src.id)){
    inv.projectId = target.id;
    if(!inv.haus && srcHaus) inv.haus = srcHaus;
    await saveInvoice(inv);
  }
  if(srcHaus && tgtHaus){
    for(const inv of DB.invoices.filter(i=>i.projectId===target.id && !i.haus && i.projectId!==src.id)){
      inv.haus = tgtHaus; await saveInvoice(inv);
    }
    target.abs = (target.abs||[]).map(a=> a.haus ? a : { ...a, haus: tgtHaus });
  }
  const srcAbs = (src.abs||[]).map(a=> a.haus || !srcHaus ? a : { ...a, haus: srcHaus });
  const nrs = new Set(srcAbs.map(a=>a.nr));
  target.abs = (target.abs||[]).filter(a=>!nrs.has(a.nr)).concat(srcAbs);
  target.haeuser = Array.from(new Set([...(target.haeuser||[]), ...(src.haeuser||[]), srcHaus, tgtHaus].filter(Boolean)));
  if(srcHaus || tgtHaus){ target.name = stripHaus(target.name); target.address = stripHaus(target.address||""); }
  await saveProject(target);
  await deleteProjectDoc(src.id);
}

const FIRMEN_DOMAIN = "@pe-fabrikation.ch";
function isFirmenMail(e){ return String(e||"").toLowerCase().trim().endsWith(FIRMEN_DOMAIN); }
function nameFromEmail(e){
  const em = String(e||"").toLowerCase();
  const u = (allUsers||[]).find(x => String(x.email||"").toLowerCase() === em);
  if(u && u.anzeigename) return u.anzeigename;
  if(currentUser && String(currentUser.email||"").toLowerCase() === em && currentProfile && currentProfile.anzeigename) return currentProfile.anzeigename;
  const local = String(e||"").split("@")[0];
  return local.split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(" ") || e;

// Direktlink aus der E-Mail (#open=invoice:ID&msg=ID)
let pendingDeepLink = null;
let dataLoaded = { projects:false, invoices:false };
function readDeepLink(){
  const h = location.hash || "";
  const m = h.match(/open=([a-z]+):([^&]+)/i);
  if(m){
    const mm = h.match(/msg=([^&]+)/);
    pendingDeepLink = { type: m[1], id: decodeURIComponent(m[2]), msg: mm ? mm[1] : null };
  }
}
readDeepLink();
window.addEventListener("hashchange", ()=>{ readDeepLink(); tryDeepLink(); });
function tryDeepLink(){
  if(!pendingDeepLink || !currentUser || !isApproved()) return;
  if(!dataLoaded.projects || !dataLoaded.invoices) return;
  const l = pendingDeepLink;
  pendingDeepLink = null;
  history.replaceState(null, "", location.pathname + location.search);
  if(l.msg) markMsgRead(l.msg);
  if(!openLink(l)) toast("Der geteilte Eintrag existiert nicht mehr.");
}

  const sent = (DB.msgsOut||[]).filter(mq).slice().sort((a,b)=>(toDateSafe(b.createdAt)||new Date())-(toDateSafe(a.createdAt)||new Date()));

  const msgRow = (m, out)=>`

      <div class="msghead">

  body.querySelectorAll("[data-msgdone]").forEach(b=>b.addEventListener("click", async ()=>{

  body.querySelectorAll("[data-msgreply]").forEach(b=>b.addEventListener("click", ()=>{

const STAMP_MONTHS = ["JAN.","FEB.","MÄRZ","APR.","MAI","JUNI","JULI","AUG.","SEPT.","OKT.","NOV.","DEZ."];
const STAMP_DEFAULT_POS = { x: 58.5, y: 83.5 }; // in % der Seite (Position wie beim Handstempel: unten rechts)
const STAMP_WIDTH_PCT = 32;                      // Breite des Stempels in % der Seitenbreite

function stampDateText(d){
  if(!d) d = new Date();
  return `${String(d.getDate()).padStart(2,"0")}. ${STAMP_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function eingangsDatum(inv){
  if(inv.eingangsdatum){ const d = new Date(inv.eingangsdatum + "T12:00:00"); if(!isNaN(d)) return d; }
  return toDateSafe(inv.createdAt) || new Date();
}
function isoDate(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

// Nachbildung des EPE-Eingangsstempels (Text + Datum, darunter Tabelle FA erf. / Mat.preis / Fibu)
// Datum wie beim Gummistempel schmal setzen: Breite immer ca. 103 Einheiten
function stampScaleX(d){
  const t = stampDateText(d);
  const w = [...t].reduce((s,ch)=> s + (/[0-9]/.test(ch) ? 0.556 : ch===" " ? 0.278 : ch==="." ? 0.278 : /[MÄ]/.test(ch) ? 0.833 : /[IJ]/.test(ch) ? 0.3 : 0.667), 0) * 28;
  return Math.min(1, +(103 / w).toFixed(3));
}
function defaultInitials(email){
  const parts = String(email||"").split("@")[0].split(/[._-]+/).filter(Boolean);
  if(parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (parts[0]||"").slice(0,2).toUpperCase();
}
function initialsFor(email){
  const u = (allUsers||[]).find(x => String(x.email||"").toLowerCase() === String(email||"").toLowerCase());
  if(u && u.initialen) return u.initialen;
  if(currentUser && String(currentUser.email).toLowerCase() === String(email||"").toLowerCase() && currentProfile && currentProfile.initialen) return currentProfile.initialen;
  return defaultInitials(email);
}
function shortDate(d){ return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(-2)}`; }
function freigabeVermerk(){
  return { initialen: initialsFor(currentUser && currentUser.email), freigabeDatum: shortDate(new Date()) };
}
// Text fuer die Zeile "Mat.preis": Freigabe-Datum + Initialen der Person, die freigegeben hat
function matPreisVermerk(inv){
  const p = inv.pruefung || {};
  let datum = p.freigabeDatum;
  if(!datum && p.at){ const m = String(p.at).match(/(\d{1,2})\.(\d{1,2})\.(\d{2,4})/); if(m) datum = `${m[1].padStart(2,"0")}.${m[2].padStart(2,"0")}.${m[3].slice(-2)}`; }
  if(!datum) datum = shortDate(new Date());
  // immer die AKTUELLEN Initialen aus der Benutzerverwaltung (falls dort nachträglich geändert)
  const approver = p.by || (currentUser && currentUser.email);
  const u = (allUsers||[]).find(x => String(x.email||"").toLowerCase() === String(approver||"").toLowerCase());
  const ini = (u && u.initialen) || (currentUser && approver && String(currentUser.email).toLowerCase()===String(approver).toLowerCase() && currentProfile && currentProfile.initialen) || p.initialen || initialsFor(approver);
  return `${datum} ${ini}`.trim();
}

/* ---------- Original-PDF: komprimiert, in Teile zerlegt speichern, beim Laden zusammensetzen ---------- */
const PDF_CHUNK_CHARS = 700000; // pro Firestore-Dokument (Limit 1 MB)
function bytesToB64(bytes){
  let s = "";
  for(let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  return btoa(s);
}
function b64ToBytes(b64){
  const s = atob(b64); const out = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i);
  return out;
}
async function gzipBytes(bytes, mode){
  const S = mode==="c" ? (typeof CompressionStream!=="undefined" ? new CompressionStream("gzip") : null)
                       : (typeof DecompressionStream!=="undefined" ? new DecompressionStream("gzip") : null);
  if(!S) return null;
  const stream = new Blob([bytes]).stream().pipeThrough(S);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function storePdfFile(file){
  try{
    const raw = new Uint8Array(await file.arrayBuffer());
    let bytes = raw, gzip = false;
    const gz = await gzipBytes(raw, "c");
    if(gz && gz.length < raw.length * 0.97){ bytes = gz; gzip = true; }
    const b64 = bytesToB64(bytes);
    const fileId = uid("pdf");
    const total = Math.max(1, Math.ceil(b64.length / PDF_CHUNK_CHARS));
    for(let i=0;i<total;i++){
      await window.fb.setDoc("pdfteile", `${fileId}_${String(i).padStart(4,"0")}`, {
        fileId, idx: i, total, gzip, name: file.name || "", bytes: raw.length,
        data: b64.slice(i*PDF_CHUNK_CHARS, (i+1)*PDF_CHUNK_CHARS),
        createdBy: currentUser.uid, createdAt: window.fb.serverTimestamp(),
      });
    }
    return fileId;
  }catch(err){
    console.error("PDF konnte nicht gespeichert werden", err);
    showDbError("pdfteile (Firestore-Regeln aktualisieren)", err);
    return null;
  }
}
const pdfCache = {};
async function loadPdfBytes(fileId){
  if(pdfCache[fileId]) return pdfCache[fileId];
  const snap = await window.fb.queryDocs("pdfteile", "fileId", fileId);
  const parts = snap.docs.map(d=>d.data()).sort((a,b)=>a.idx-b.idx);
  if(!parts.length || parts.length !== parts[0].total) throw new Error("Original unvollständig oder bereits gelöscht.");
  let bytes = b64ToBytes(parts.map(p=>p.data).join(""));
  if(parts[0].gzip){ const un = await gzipBytes(bytes, "d"); if(!un) throw new Error("Browser kann das Original nicht entpacken."); bytes = un; }
  pdfCache[fileId] = bytes;
  return bytes;
}
async function deletePdfFile(fileId){
  try{
    const snap = await window.fb.queryDocs("pdfteile", "fileId", fileId);
    for(const d of snap.docs) await window.fb.deleteDoc("pdfteile", d.id);
    delete pdfCache[fileId];
  }catch(err){ console.warn("PDF-Teile nicht gelöscht", err); }
}
// PDF nur löschen, wenn keine andere (noch nicht gedruckte) Rechnung dieselbe Datei braucht
async function releasePdfIfUnused(fileId, exceptInvoiceId){
  if(!fileId) return;
  const stillNeeded = DB.invoices.some(i => i.pdfId===fileId && i.id!==exceptInvoiceId && !i.gedrucktAm);
  if(!stillNeeded) await deletePdfFile(fileId);
}
async function renderPdfPages(bytes, pageNums){
  const pdf = await pdfjsLib.getDocument({ data: bytes.slice() }).promise;
  const out = [];
  const nums = (pageNums && pageNums.length ? pageNums : Array.from({length: pdf.numPages}, (_,i)=>i+1)).filter(n=>n>=1 && n<=pdf.numPages);
  for(const pn of nums){
    const page = await pdf.getPage(pn);
    const base = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: 1654 / base.width }); // ca. 200 dpi auf A4
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push(canvas.toDataURL("image/jpeg", 0.85));
  }
  return out;
}
async function loadInvoicePageImages(inv){
  if(inv.pdfId){
    const bytes = await loadPdfBytes(inv.pdfId);
    return await renderPdfPages(bytes, inv.pdfPages);
  }
  if((inv.bildSeiten||0) > 0) return (await loadInvoiceImages(inv.id)).map(x=>x.data);
  return [];
}

/* ---------- Bereits erfasste Rechnung wiedererkennen (kein Duplikat, nur Original ergänzen) ---------- */
function sameSupplier(a, b){
  if(!a || !b) return false;
  const sa = getSubFor(a) || matchSubInText("", a), sb = getSubFor(b) || matchSubInText("", b);
  if(sa && sb) return sa.id === sb.id;
  const ca = compactName(a), cb = compactName(b);
  if(ca && cb && (ca.includes(cb) || cb.includes(ca))) return true;
  const na = String(a).toLowerCase().replace(/\b(gmbh|ag|sa|sàrl)\b/g,"").trim();
  const nb = String(b).toLowerCase().replace(/\b(gmbh|ag|sa|sàrl)\b/g,"").trim();
  return na === nb || (na.split(/\s+/)[0] && na.split(/\s+/)[0] === nb.split(/\s+/)[0]);
}
// Wurde eine gespeicherte Rechnung frueher aus einer fehlerhaften Scanner-Textebene gelesen? Dann sind Nr./Betrag/Datum unzuverlaessig.
function invoiceUnreliable(i){
  return ocrGarbageScore(i.rawText||"") >= 3 || !i.datum || !(i.items||[]).length;
}
function findExistingInvoice(parsed){
  const nr = cleanRnr(parsed.rechnungsnr).toLowerCase();
  const sameSup = DB.invoices.filter(i => sameSupplier(i.lieferant, parsed.lieferant));
  // Widerspruch = sicher eine ANDERE Rechnung (anderer Betrag oder anderes Objekt)
  const contradicts = i => {
    if(!invoiceUnreliable(i) && num(i.total)!=null && parsed.total!=null && Math.abs(+i.total - +parsed.total) > 0.01) return true;
    const oi = i.objekt || (DB.projects.find(p=>p.id===i.projectId)||{}).address || "";
    if(oi && parsed.objekt && scoreAddress(stripHaus(oi), stripHaus(parsed.objekt)) === 0) return true;
    return false;
  };
  if(nr){
    const byNr = sameSup.find(i => cleanRnr(i.rechnungsnr).toLowerCase() === nr && !contradicts(i));
    if(byNr) return byNr;
  }
  if(parsed.total!=null){
    const byTotal = sameSup.filter(i => !hasOriginal(i) && num(i.total)!=null && Math.abs(+i.total - +parsed.total) < 0.01 && !contradicts(i));
    if(byTotal.length === 1) return byTotal[0];
  }
  // gleiches Objekt + gleiches Datum, alte Rechnung ohne Original (z.B. Nummer/Betrag frueher falsch gelesen)
  if(parsed.objekt && parsed.datum){
    const byObj = sameSup.filter(i => !hasOriginal(i) && i.datum===parsed.datum && !contradicts(i)
      && scoreAddress(stripHaus(i.objekt || (DB.projects.find(p=>p.id===i.projectId)||{}).address || ""), stripHaus(parsed.objekt)) >= 2);
    if(byObj.length === 1) return byObj[0];
  }
  // alte, unzuverlaessig gelesene Rechnung ohne Original am gleichen Objekt (Nummer/Betrag/Datum damals falsch gelesen)
  if(parsed.objekt){
    const byBad = sameSup.filter(i => !i.gedrucktAm && invoiceUnreliable(i)
      && scoreAddress(stripHaus(i.objekt || (DB.projects.find(p=>p.id===i.projectId)||{}).address || ""), stripHaus(parsed.objekt)) >= 2);
    if(byBad.length === 1) return byBad[0];
  }
  return null;
}
// Beim Ergaenzen des Originals frueher falsch gelesene Werte korrigieren
async function refreshFromParsed(inv, parsed){
  const upd = {};
  if(invoiceUnreliable(inv)){
    // frueher falsch gelesen -> mit der neuen, sauberen Lesung ueberschreiben
    if(parsed.rechnungsnr) upd.rechnungsnr = parsed.rechnungsnr;
    if(parsed.datum) upd.datum = parsed.datum;
    if(parsed.total!=null) upd.total = parsed.total;
    if(parsed.auftragsnummer) upd.auftragsnummer = parsed.auftragsnummer;
    if(parsed.items && parsed.items.length && !(inv.items||[]).length) upd.items = parsed.items.map(it=>({ id: it.id||uid("it"), category: it.category, label: it.label, menge: it.menge, einheit: it.einheit, preis: it.preis, ep: it.ep!==undefined ? it.ep : null }));
    if(parsed._rawText) upd.rawText = String(parsed._rawText).slice(0, 30000);
    if(Object.keys(upd).length){ Object.assign(inv, upd); await window.fb.setDocMerge("invoices", inv.id, upd); }
    return Object.keys(upd);
  }
  if(parsed.lieferant && compactName(parsed.lieferant)!==compactName(inv.lieferant) && getSubFor(parsed.lieferant) && !getSubFor(inv.lieferant)) upd.lieferant = parsed.lieferant;
  if(num(inv.total)==null && parsed.total!=null) upd.total = parsed.total;
  if(parsed.rechnungsnr && cleanRnr(parsed.rechnungsnr)!==cleanRnr(inv.rechnungsnr)){
    const clash = DB.invoices.some(o => o.id!==inv.id && sameSupplier(o.lieferant, inv.lieferant) && cleanRnr(o.rechnungsnr)===cleanRnr(inv.rechnungsnr));
    if(!inv.rechnungsnr || clash) upd.rechnungsnr = parsed.rechnungsnr;
  }
  if(!inv.objekt && parsed.objekt) upd.objekt = parsed.objekt;
  if(parsed._rawText && !inv.rawText) upd.rawText = String(parsed._rawText).slice(0, 30000);
  if(Object.keys(upd).length){ Object.assign(inv, upd); await window.fb.setDocMerge("invoices", inv.id, upd); }
  return Object.keys(upd);
}
async function attachPdfToInvoice(inv, pdfId, pages){
  const old = inv.pdfId;
  inv.pdfId = pdfId; inv.pdfPages = pages || [];
  await window.fb.setDocMerge("invoices", inv.id, { pdfId, pdfPages: inv.pdfPages });
  if(old && old !== pdfId) releasePdfIfUnused(old, inv.id);
}

// Mehrere PDFs auf einmal: automatisch den vorhandenen Rechnungen zuordnen
async function bulkAttachOriginals(files, statusEl){
  let ok = 0; const misses = [];
  for(const file of files){
    try{
      if(statusEl) statusEl.textContent = `„${file.name}“ wird gelesen…`;
      const pages = await extractPagesFromPDF(file);
      const groups = splitPagesIntoInvoices(pages);
      const hits = [];
      groups.forEach(g=>{
        const parsed = parseInvoiceText(g.allText);
        parsed._rawText = g.allText;
        const ex = findExistingInvoice(parsed);
        if(ex) hits.push({ inv: ex, pages: g.pages, parsed }); else misses.push(`${file.name}${groups.length>1?` (S. ${g.pages.join(",")})`:""}`);
      });
      if(hits.length){
        const pdfId = await storePdfFile(file);
        if(pdfId) for(const h of hits){ await attachPdfToInvoice(h.inv, pdfId, h.pages); await refreshFromParsed(h.inv, h.parsed); ok++; }
      }
    }catch(err){ console.error(err); misses.push(file.name); }
  }
  if(statusEl) statusEl.textContent = "";
  toast(`${ok} Original(e) zugeordnet${misses.length ? ` · nicht zugeordnet: ${misses.join(", ")}` : ""}.`);
  if(misses.length) alert(`Nicht zugeordnet (keine passende Rechnung gefunden):\n${misses.join("\n")}\n\nDiese Rechnungen über „PDF anhängen“ in der jeweiligen Zeile zuordnen.`);
  if(currentView==="print") renderPrintCenter();
}
function attachOriginalPdf(inv, after){
  pickABFile(async (file)=>{
    try{
      toast("Original wird gespeichert…");
      const pdfId = await storePdfFile(file);
      if(!pdfId) return;
      let pages = [];

        const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;

}

function matchesQuery(text, q){
  if(!q) return true;
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => text.includes(w) || text.replace(/'/g,"").includes(w.replace(/'/g,"")));
}

      ${printTab==="gedruckt" ? `<p class="muted" style="font-size:12px;">Nach dem Drucken wird die PDF gelöscht, um Speicher zu sparen. Nochmals drucken geht nur, wenn das Original noch vorhanden ist.</p>` : ""}`
    : `<div class="empty">${printQuery ? `Keine Treffer für „${escapeHtml(printQuery)}“ in diesem Tab.` : printTab==="bereit" ? "Keine freigegebenen Rechnungen zum Drucken." : printTab==="neu" ? "Keine neuen Rechnungen." : "Keine Einträge."}</div>`}`;
  const cts = document.getElementById("checkTodoSlot");
  if(cts) wireTodos(cts, checkTodos, renderPrintCenter);
  mainEl.querySelectorAll("[data-abup]").forEach(b=>b.addEventListener("click", (e)=>{ e.stopPropagation(); uploadABForProject(b.dataset.abup, renderPrintCenter); }));
  mainEl.querySelectorAll("[data-noab]").forEach(b=>b.addEventListener("click", async (e)=>{

      const n = document.getElementById("pSearch"); if(n){ n.focus(); try{ n.setSelectionRange(pos, pos); }catch(e){} }

  const psc = document.getElementById("pSearchClear");
  if(psc) psc.addEventListener("click", ()=>{ printQuery = ""; renderPrintCenter(); });

  mainEl.querySelectorAll("[data-ptab]").forEach(b=>b.addEventListener("click", ()=>{ printTab = b.dataset.ptab; printSel.clear(); printDeselected.clear(); renderPrintCenter(); }));
  const all = document.getElementById("pSelAll");
  if(all){
    const selectable = list.filter(inv => printTab==="neu" || hasOriginal(inv));
    all.checked = selectable.length > 0 && selectable.every(i=>printSel.has(i.id));
    all.addEventListener("change", ()=>{ selectable.forEach(i=>{ if(all.checked){ printSel.add(i.id); printDeselected.delete(i.id); } else { printSel.delete(i.id); printDeselected.add(i.id); } }); renderPrintCenter(); });
  }
  mainEl.querySelectorAll("[data-psel]").forEach(cb=>cb.addEventListener("change", ()=>{
    if(cb.checked){ printSel.add(cb.dataset.psel); printDeselected.delete(cb.dataset.psel); } else { printSel.delete(cb.dataset.psel); printDeselected.add(cb.dataset.psel); }
    renderPrintCenter();
  }));
  mainEl.querySelectorAll("[data-popen]").forEach(td=>td.addEventListener("click", ()=> openLink({ type:"invoice", id: td.dataset.popen })));
  mainEl.querySelectorAll("[data-pattach]").forEach(b=>b.addEventListener("click", ()=>{ const inv = DB.invoices.find(i=>i.id===b.dataset.pattach); if(inv) attachOriginalPdf(inv, ()=>{ printSel.add(inv.id); renderPrintCenter(); }); }));
  mainEl.querySelectorAll("[data-pdate]").forEach(inp=>inp.addEventListener("change", ()=>{
    const inv = DB.invoices.find(i=>i.id===inp.dataset.pdate); if(!inv) return;
    inv.eingangsdatum = inp.value || "";
    window.fb.setDocMerge("invoices", inv.id, { eingangsdatum: inv.eingangsdatum });
  }));
  const bd = document.getElementById("bulkDrop");
  if(bd){
    const run = files => { const pdfs = Array.from(files).filter(f=>/pdf$/i.test(f.name) || f.type==="application/pdf"); if(pdfs.length){ bulkAttachOriginals(pdfs, document.getElementById("bulkStatus")); } };
    bd.addEventListener("click", ()=>{ const fi = document.createElement("input"); fi.type="file"; fi.accept="application/pdf"; fi.multiple = true; fi.addEventListener("change", ()=>run(fi.files)); fi.click(); });
    bd.addEventListener("dragover", e=>{ e.preventDefault(); bd.classList.add("hover"); });
    bd.addEventListener("dragleave", ()=> bd.classList.remove("hover"));
    bd.addEventListener("drop", e=>{ e.preventDefault(); bd.classList.remove("hover"); run(e.dataTransfer.files); });
  }
  const abd = document.getElementById("abBulkDrop");
  if(abd){
    const run = async files => {
      const pdfs = Array.from(files).filter(f=>/pdf$/i.test(f.name) || f.type==="application/pdf");
      const st = document.getElementById("abBulkStatus");
      let ok = 0; const bad = [];
      for(const f of pdfs){
        try{
          if(st) st.textContent = `„${f.name}“ wird gelesen…`;
          const pages = await extractPagesFromPDF(f);
          const text = pages.map(p=>p.text).join("\n");
          if(!isABText(text)){ bad.push(`${f.name} (keine PE-AB)`); continue; }
          const ab = abFromPages(pages, f.name);
          if(!ab.positionen.length){ bad.push(`${f.name} (keine Positionen lesbar)`); continue; }
          const res = await autoAssignAB(ab); ok++;
          await syncHousesWithABs(DB.projects.find(x=>x.id===res.projectId));
        }catch(err){ bad.push(f.name); }
      }
      toast(`${ok} AB(s) zugeordnet${bad.length ? ` · nicht verarbeitet: ${bad.join(", ")}` : ""}.`);
      renderPrintCenter();
    };
    abd.addEventListener("click", ()=>{ const fi = document.createElement("input"); fi.type="file"; fi.accept="application/pdf"; fi.multiple = true; fi.addEventListener("change", ()=>run(fi.files)); fi.click(); });
    abd.addEventListener("dragover", e=>{ e.preventDefault(); abd.classList.add("hover"); });
    abd.addEventListener("dragleave", ()=> abd.classList.remove("hover"));
    abd.addEventListener("drop", e=>{ e.preventDefault(); abd.classList.remove("hover"); run(e.dataTransfer.files); });
  }
  const apc = document.getElementById("pApproveClean");
  if(apc) apc.addEventListener("click", async ()=>{
    if(!confirm(`${cleanNeu.length} Rechnung(en) ohne Fehler und ohne Hinweise freigeben?`)) return;
    for(const inv of cleanNeu){
      inv.pruefung = { status:"ok", kommentar:(inv.pruefung&&inv.pruefung.kommentar)||"", by: currentUser.email, at: new Date().toLocaleString("de-CH"), ...freigabeVermerk() };
      await saveInvoice(inv);
    }
    printSel.clear();
    toast(`${cleanNeu.length} Rechnung(en) freigegeben – jetzt unter ③ Drucken.`);
    renderPrintCenter();
  });
  const ap = document.getElementById("pApprove");
  if(ap) ap.addEventListener("click", async ()=>{
    const sel = list.filter(i=>printSel.has(i.id));
    const ok = sel.filter(i=>!checkInvoice(i).some(f=>f.level==="danger"));
    const bad = sel.length - ok.length;
    if(!ok.length){ toast("Alle markierten Rechnungen haben Fehler – bitte einzeln prüfen."); return; }
    if(!confirm(`${ok.length} Rechnung(en) freigeben?${bad?`\n${bad} Rechnung(en) mit Fehlern werden übersprungen.`:""}`)) return;
    for(const inv of ok){
      inv.pruefung = { status:"ok", kommentar:(inv.pruefung&&inv.pruefung.kommentar)||"", by: currentUser.email, at: new Date().toLocaleString("de-CH"), ...freigabeVermerk() };
      await saveInvoice(inv);
    }
    printSel.clear();
    printDeselected.clear();
    toast(`${ok.length} Rechnung(en) freigegeben – jetzt unter ③ Drucken.`);
    renderPrintCenter();
  });
  const pp = document.getElementById("pPrint");
  if(pp) pp.addEventListener("click", ()=> openPrintPreview(list.filter(i=>printSel.has(i.id))));
}

async function openPrintPreview(invs){
  if(!invs.length) return;
  closePrintPreview();
  const root = document.createElement("div");
  root.id = "printRoot";
  const label = inv => { const p = DB.projects.find(x=>x.id===inv.projectId); return `${inv.lieferant||"?"} · ${inv.rechnungsnr||"ohne Nr."}${p?" · "+p.name:""}${inv.haus?" · "+inv.haus:""}`; };
  root.innerHTML = `
    <div class="ptoolbar noprint">
      <b>Druckvorschau – ${invs.length} Rechnung(en)</b>
      <span class="muted" style="font-size:12.5px;" id="ppInfo">Originale werden geladen…</span>
      <span style="flex:1;"></span>
      <button id="ppAll">Stempelposition der 1. Rechnung für alle</button>
      <button class="primary" id="ppPrint" disabled>🖨️ Drucken</button>
      <button id="ppClose">Schliessen</button>
    </div>
    <div class="pindex noprint">
      <b style="font-size:12.5px;">Markierte Rechnungen</b>
      ${invs.map((inv,i)=>`<a href="#" data-pjump="${inv.id}" id="pidx-${inv.id}"><span class="pnum">${i+1}</span><span class="ptxt">${escapeHtml(label(inv))}</span><span class="pst" id="pst-${inv.id}">⏳</span></a>`).join("")}
    </div>
    <div id="ppPages">${invs.map((inv,i)=>`
      <div class="pinvhead noprint" id="phead-${inv.id}"><span class="pnum">${i+1}</span> ${escapeHtml(label(inv))} <span class="muted" id="pmsg-${inv.id}">– wird geladen…</span></div>
      <div class="pinvbody" id="pbody-${inv.id}"><div class="ppage ploading"><div>⏳ Original wird geladen…</div></div></div>`).join("")}
    </div>`;
  document.body.appendChild(root);
  document.body.classList.add("printing");
  document.getElementById("ppClose").addEventListener("click", closePrintPreview);
  root.querySelectorAll("[data-pjump]").forEach(a=>a.addEventListener("click", e=>{
    e.preventDefault();
    const el = document.getElementById("phead-"+a.dataset.pjump);
    if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
  }));
  const pagesEl = document.getElementById("ppPages");
  const info = document.getElementById("ppInfo");

  const wireStamp = (st)=>{
    st.addEventListener("pointerdown", (e)=>{
      e.preventDefault();
      const page = st.parentElement, r = page.getBoundingClientRect(), sr = st.getBoundingClientRect();
      const offX = e.clientX - sr.left, offY = e.clientY - sr.top;
      if(st.setPointerCapture) st.setPointerCapture(e.pointerId);
      const move = (ev)=>{
        const x = Math.min(100 - STAMP_WIDTH_PCT, Math.max(0, (ev.clientX - offX - r.left) / r.width * 100));
        const y = Math.min(96, Math.max(0, (ev.clientY - offY - r.top) / r.height * 100));
        st.style.left = x + "%"; st.style.top = y + "%";
      };
      const up = ()=>{
        st.removeEventListener("pointermove", move); st.removeEventListener("pointerup", up);
        const inv = DB.invoices.find(i=>i.id===st.dataset.stamp); if(!inv) return;
        inv.stempelPos = { x: roundNum(parseFloat(st.style.left)), y: roundNum(parseFloat(st.style.top)) };
        window.fb.setDocMerge("invoices", inv.id, { stempelPos: inv.stempelPos });
      };
      st.addEventListener("pointermove", move); st.addEventListener("pointerup", up);
    });
  };

  // alle Rechnungen parallel laden (max. 3 gleichzeitig), Reihenfolge bleibt wie markiert
  let done = 0, okCount = 0;
  const failed = [];
  const loadOne = async (inv)=>{
    const body = document.getElementById("pbody-"+inv.id);
    const msg = document.getElementById("pmsg-"+inv.id);
    const st = document.getElementById("pst-"+inv.id);
    try{
      const imgs = await loadInvoicePageImages(inv);
      if(!imgs.length) throw new Error("kein Original gespeichert");
      const pos = inv.stempelPos || STAMP_DEFAULT_POS;
      body.innerHTML = imgs.map((src, n)=>`
        <div class="ppage" data-inv="${inv.id}">
          <img src="${src}" alt="">
          ${n===0 ? `<div class="pstamp" data-stamp="${inv.id}" style="left:${pos.x}%;top:${pos.y}%;width:${STAMP_WIDTH_PCT}%;">${stampSvg(eingangsDatum(inv), matPreisVermerk(inv))}</div>` : ""}
        </div>`).join("");
      body.querySelectorAll(".pstamp").forEach(wireStamp);
      msg.textContent = `– ${imgs.length} Seite(n), Stempel verschiebbar`;
      st.textContent = "✓"; st.className = "pst ok";
      okCount++;
    }catch(err){
      body.innerHTML = "";
      msg.innerHTML = `– <span class="flag">${escapeHtml(err.message||"Original nicht ladbar")} → wird nicht gedruckt</span>`;
      st.textContent = "✗"; st.className = "pst bad";
      failed.push(inv);
    }
    done++;
    info.textContent = done < invs.length ? `Originale werden geladen… ${done}/${invs.length}` : `${okCount} von ${invs.length} Rechnung(en) bereit – Stempel lässt sich auf jeder Rechnung mit der Maus verschieben.`;
  };
  const queue = invs.slice();
  await Promise.all([0,1,2].map(async ()=>{ while(queue.length){ await loadOne(queue.shift()); } }));
  document.getElementById("ppPrint").disabled = okCount === 0;
  if(failed.length) toast(`${failed.length} Rechnung(en) ohne Original – werden nicht gedruckt.`);

  document.getElementById("ppAll").addEventListener("click", ()=>{
    const first = pagesEl.querySelector(".pstamp"); if(!first) return;
    const pos = { x: roundNum(parseFloat(first.style.left)), y: roundNum(parseFloat(first.style.top)) };
    pagesEl.querySelectorAll(".pstamp").forEach(st=>{
      st.style.left = pos.x + "%"; st.style.top = pos.y + "%";
      const inv = DB.invoices.find(i=>i.id===st.dataset.stamp);
      if(inv){ inv.stempelPos = pos; window.fb.setDocMerge("invoices", inv.id, { stempelPos: pos }); }
    });
    toast("Position für alle übernommen.");
  });
  document.getElementById("ppPrint").addEventListener("click", ()=>{
    window.print();
    const printed = invs.filter(inv => pagesEl.querySelector(`.ppage[data-inv="${inv.id}"]`));
    setTimeout(async ()=>{
      if(!confirm(`Wurden alle ${printed.length} Rechnung(en) korrekt gedruckt?\n\nOK = als „Gedruckt“ ablegen und die gespeicherten PDFs löschen.`)) return;
      const stamp = new Date().toLocaleString("de-CH");
      const files = new Set();
      for(const inv of printed){
        if(inv.pdfId) files.add(inv.pdfId);
        inv.gedrucktAm = stamp; inv.gedrucktVon = currentUser.email;
        await window.fb.setDocMerge("invoices", inv.id, { gedrucktAm: stamp, gedrucktVon: currentUser.email, eingangsdatum: inv.eingangsdatum || isoDate(eingangsDatum(inv)) });
      }
      for(const fid of files){
        const stillNeeded = DB.invoices.some(i => i.pdfId===fid && !i.gedrucktAm && !printed.some(p=>p.id===i.id));
        if(stillNeeded) continue;
        await deletePdfFile(fid);
        for(const inv of DB.invoices.filter(i=>i.pdfId===fid)){ inv.pdfId = null; inv.pdfPages = []; await window.fb.setDocMerge("invoices", inv.id, { pdfId: null, pdfPages: [] }); }
      }
      for(const inv of printed){ if((inv.bildSeiten||0) > 0){ await deleteInvoiceImages(inv.id); inv.bildSeiten = 0; await window.fb.setDocMerge("invoices", inv.id, { bildSeiten: 0 }); } }
      printSel.clear();
      closePrintPreview();
      toast(`${printed.length} Rechnung(en) gedruckt und abgelegt – PDFs gelöscht.`);
      if(currentView==="print") renderPrintCenter();
    }, 400);
  });
}
function closePrintPreview(){
  const r = document.getElementById("printRoot"); if(r) r.remove();
  document.body.classList.remove("printing");
}

/* ============================= DOPPELRECHNUNG: BESTAETIGUNG FUER DEN SUBUNTERNEHMER ============================= */
function dupFacts(inv){
  const p = DB.projects.find(x=>x.id===inv.projectId);
  const erfasst = toDateSafe(inv.createdAt);
  const pr = inv.pruefung || {};
  return {
    p,
    nr: inv.rechnungsnr || "(ohne Nr.)",
    datum: inv.datum || "",
    betrag: inv.total!=null ? `CHF ${formatCHF(+inv.total)}` : "",
    objekt: p ? p.name + (inv.haus ? ", " + inv.haus : "") : (inv.objekt || ""),
    erfasst: erfasst ? `${erfasst.toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"numeric"})} um ${erfasst.toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})} Uhr` : "",
    freigegeben: pr.status==="ok" && pr.at ? `${String(pr.at).replace(/,\s*(\d{1,2}:\d{2})(:\d{2})?/, " um $1 Uhr")}` : "",
    beanstandet: pr.status==="beanstandet" && pr.at ? String(pr.at).replace(/,\s*(\d{1,2}:\d{2})(:\d{2})?/, " um $1 Uhr") : "",
    bezahlt: inv.bezahltAm ? new Date(inv.bezahltAm + "T12:00:00").toLocaleDateString("de-CH") : "",
    gedruckt: inv.gedrucktAm ? String(inv.gedrucktAm).replace(/,\s*(\d{1,2}:\d{2})(:\d{2})?/, " um $1 Uhr") : "",
  };
}
function subEmailFor(inv){
  const s = getSubFor(inv.lieferant);
  if(s && s.email) return String(s.email).trim();
  const fromSub = s && String(s.kontakt||"").match(/[\w.+-]+@[\w-]+\.[\w.]+/);
  if(fromSub) return fromSub[0];
  const m = String(inv.rawText||"").match(/[\w.+-]+@[\w-]+\.[a-z]{2,}(?:\.[a-z]{2,})?/gi) || [];
  return (m.find(e => !/pe-fabrikation/i.test(e)) || "").replace(/\s/g,"");
}
function duplicateLetterText(inv){
  const f = dupFacts(inv);
  const status = [
    f.erfasst ? `bei uns bereits am ${f.erfasst} eingegangen und erfasst` : "bei uns bereits erfasst",
    f.freigegeben ? `am ${f.freigegeben} geprüft und zur Zahlung freigegeben` : "",
    f.bezahlt ? `am ${f.bezahlt} bezahlt` : "",
  ].filter(Boolean);
  const statusSatz = status.length > 1 ? status.slice(0,-1).join(", ") + " und " + status[status.length-1] : status[0];
  return [
    `Doppelt zugestellte Rechnung Nr. ${f.nr}`,
    "",
    "Sehr geehrte Damen und Herren",
    "",
    `Ihre Rechnung Nr. ${f.nr}${f.datum ? " vom " + f.datum : ""}${f.betrag ? " über " + f.betrag : ""}${f.objekt ? " (Objekt: " + f.objekt + ")" : ""} wurde uns erneut zugestellt.`,
    "",
    `Diese Rechnung ist ${statusSatz}.`,
    "",
    "Die erneut zugestellte Rechnung wird daher nicht ein zweites Mal bezahlt. Wir bitten Sie, Ihre Unterlagen entsprechend zu berichtigen und uns die Rechnung nicht nochmals zuzustellen.",
    "",
    "Freundliche Grüsse",
    "PE Fabrikations AG",
    currentUser ? nameFromEmail(currentUser.email) : "",
  ].join("\n");
}

          .filter(r=>r[1]).map(r=>`<tr><td style="padding:3px 8px 3px 0;color:#555;width:45mm;border-bottom:1px solid #ddd;">${escapeHtml(r[0])}</td><td style="padding:3px 0;border-bottom:1px solid #ddd;">${escapeHtml(r[1])}</td></tr>`).join("")}

// jsPDF nur bei Bedarf laden
let jsPdfPromise = null;
function loadJsPdf(){
  if(window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if(!jsPdfPromise) jsPdfPromise = new Promise((res, rej)=>{
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = ()=> res(window.jspdf.jsPDF);
    s.onerror = ()=> { jsPdfPromise = null; rej(new Error("PDF-Bibliothek konnte nicht geladen werden.")); };
    document.head.appendChild(s);
  });
  return jsPdfPromise;
}
// Gleicher Brief wie die Druckansicht, als echte PDF-Datei
async function buildDuplicatePdf(inv){
  const jsPDF = await loadJsPdf();
  const f = dupFacts(inv);
  const lines = duplicateLetterText(inv).split("\n");
  const subject = lines.shift(); lines.shift();
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const L = 20, W = 170;
  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("PE Fabrikations AG", L, 22);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(80);
  doc.text("Feldmoosstrasse 51 · 8853 Lachen · www.pe-fabrikation.ch", L, 27);
  doc.setTextColor(17); doc.setFontSize(11);
  doc.text(String(inv.lieferant||""), L, 50);
  doc.text(`Lachen, ${new Date().toLocaleDateString("de-CH",{day:"2-digit",month:"2-digit",year:"numeric"})}`, L + W, 66, { align:"right" });
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text(subject, L, 80);
  doc.setFont("helvetica","normal"); doc.setFontSize(11);
  let y = 90;
  for(const ln of lines){
    if(!ln.trim()){ y += 3; continue; }
    const parts = doc.splitTextToSize(ln, W);
    doc.text(parts, L, y); y += parts.length * 5.6;
  }
  y += 6; doc.setFontSize(9.5);
  [["Rechnungs-Nr.", f.nr],["Rechnungsdatum", f.datum],["Betrag", f.betrag],["Objekt", f.objekt],["Bei uns eingegangen", f.erfasst],["Zur Zahlung freigegeben", f.freigegeben],["Bezahlt", f.bezahlt],["Verbucht / abgelegt", f.gedruckt]]
    .filter(r=>r[1]).forEach(r=>{
      doc.setTextColor(85); doc.text(r[0], L, y);
      doc.setTextColor(17); doc.text(doc.splitTextToSize(String(r[1]), W-50), L + 50, y);
      doc.setDrawColor(220); doc.line(L, y + 1.8, L + W, y + 1.8);
      y += 7;
    });
  return doc.output("arraybuffer");
}
function b64Lines(b64){ return b64.replace(/(.{76})/g, "$1\r\n"); }
function utf8B64(str){ return btoa(unescape(encodeURIComponent(str))); }
function mimeWord(str){ return `=?UTF-8?B?${utf8B64(str)}?=`; }
function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 60000);
}
function dupFileBase(inv){ return `Doppelrechnung_${String(inv.rechnungsnr||"ohne-Nr").replace(/[^\w.-]+/g,"_")}`; }
async function downloadDuplicatePdf(inv){
  try{
    const pdf = await buildDuplicatePdf(inv);
    downloadBlob(new Blob([pdf], { type:"application/pdf" }), dupFileBase(inv) + ".pdf");
    toast("PDF heruntergeladen.");
  }catch(err){ console.error(err); toast("PDF konnte nicht erstellt werden – Druckansicht wird geöffnet."); printDuplicateLetter(inv); }
}
// Outlook-Entwurf (.eml mit "X-Unsent: 1") inkl. PDF-Anhang
async function downloadDuplicateEml(inv, pdfBytes){
  const to = subEmailFor(inv);
  const subject = `Doppelt zugestellte Rechnung Nr. ${inv.rechnungsnr||""}`;
  const text = duplicateLetterText(inv).split("\n").slice(2).join("\n") + "\n\nIm Anhang finden Sie die Bestätigung als PDF.";
  const pdf = pdfBytes || new Uint8Array(await buildDuplicatePdf(inv));
  const fname = dupFileBase(inv) + ".pdf";
  const boundary = "----=_PE_" + Date.now().toString(36);
  const eml = [
    "X-Unsent: 1", `To: ${to||""}`, `Subject: ${mimeWord(subject)}`, "MIME-Version: 1.0",
    `Content-Type: multipart/mixed; boundary="${boundary}"`, "",
    `--${boundary}`, "Content-Type: text/plain; charset=UTF-8", "Content-Transfer-Encoding: base64", "",
    b64Lines(utf8B64(text.replace(/\n/g, "\r\n"))), "",
    `--${boundary}`, `Content-Type: application/pdf; name="${fname}"`, `Content-Disposition: attachment; filename="${fname}"`, "Content-Transfer-Encoding: base64", "",
    b64Lines(bytesToB64(pdf)), "", `--${boundary}--`, "",
  ].join("\r\n");
  downloadBlob(new Blob([eml], { type:"message/rfc822" }), "E-Mail_" + dupFileBase(inv) + ".eml");
}
// Standard: PDF herunterladen + Outlook mit fertigem Text oeffnen (funktioniert ueberall)
async function mailDuplicate(inv){
  const to = subEmailFor(inv);
  const subject = `Doppelt zugestellte Rechnung Nr. ${inv.rechnungsnr||""}`;
  const text = duplicateLetterText(inv).split("\n").slice(2).join("\n") + "\n\nIm Anhang finden Sie die Bestätigung als PDF.";
  let pdf = null;
  try{
    toast("PDF wird erstellt…");
    pdf = new Uint8Array(await buildDuplicatePdf(inv));
  }catch(err){ console.error(err); }
  const fname = dupFileBase(inv) + ".pdf";
  const pdfFile = pdf && typeof File !== "undefined" ? new File([pdf], fname, { type:"application/pdf" }) : null;
  const canShare = !!(pdfFile && navigator.canShare && navigator.canShare({ files:[pdfFile] }));
  if(pdf) downloadBlob(new Blob([pdf], { type:"application/pdf" }), fname);
  window.location.href = `mailto:${encodeURIComponent(to||"")}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
  showModal(`
    <h2>✉️ E-Mail ist geöffnet</h2>
    <p class="subtitle" style="margin-bottom:10px;">Outlook ist mit Empfänger${to ? ` <b>${escapeHtml(to)}</b>` : ""}, Betreff und Text geöffnet.
      ${pdf ? `Die Bestätigung <b>${escapeHtml(fname)}</b> wurde heruntergeladen – <b>einfach aus der Download-Leiste oben rechts in die E-Mail ziehen</b> (oder in Outlook: Einfügen → Datei anfügen → Downloads).` : `<span class="flag">Das PDF konnte nicht erstellt werden.</span>`}</p>
    ${to ? "" : `<p class="flag" style="font-size:12.5px;">Keine E-Mail-Adresse beim Subunternehmer hinterlegt – unter Preise &amp; Einstellungen erfassen.</p>`}
    <p class="muted" style="font-size:12px;">Hinweis: Ein Browser darf aus Sicherheitsgründen keine Datei selbst an eine Outlook-E-Mail anhängen. Alternativen mit automatischem Anhang:</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
      ${canShare ? `<button id="mailShare">📤 Über Windows teilen (PDF automatisch angehängt)</button>` : ""}
      ${pdf ? `<button id="mailEml">Outlook-Entwurf mit Anhang (.eml)</button>` : ""}
      <button class="primary" id="mailOk">OK</button>
    </div>`);
  document.getElementById("mailOk").addEventListener("click", closeModal);
  const sh = document.getElementById("mailShare");
  if(sh) sh.addEventListener("click", async ()=>{
    try{ await navigator.share({ files:[pdfFile], title: subject, text: (to ? `An: ${to}\n\n` : "") + text }); closeModal(); }
    catch(e){ if(e && e.name !== "AbortError") toast("Teilen nicht möglich."); }
  });
  const em = document.getElementById("mailEml");
  if(em) em.addEventListener("click", async ()=>{ await downloadDuplicateEml(inv, pdf); toast("Datei heruntergeladen – Doppelklick öffnet den Outlook-Entwurf mit Anhang (nur Outlook-Desktop)."); });
}
function mailDuplicatePlain(inv){
  const to = subEmailFor(inv);

function dupButtonsHtml(id){
  return `<button class="small primary" data-dupmail="${id}">✉️ E-Mail an Subunternehmer (+ PDF)</button>

function wireDupButtons(container){

function formatCHF(n){
  return n.toLocaleString("de-CH", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function escapeHtml(s){
  return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast";

}
